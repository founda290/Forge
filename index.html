function openVisuals(){
  let tab='sketch';
  const m=modal({title:'Visual studio',icon:'palette',size:'full',flush:true,
    tabs:[{id:'sketch',n:'Sketchpad',i:'pen'},{id:'board',n:'Moodboard',i:'grid'},{id:'palette',n:'Palette',i:'palette'}],
    body:`<div id="vBody" style="display:flex;flex-direction:column;gap:11px;padding:14px;flex:1;min-height:0"></div>`,
    foot:`<span>Send anything you make straight into the chat.</span><span class="sp"></span><button class="btn" data-cl>Close</button>`});
  m.el.querySelector('[data-cl]').onclick=()=>m.close();
  const box=m.el.querySelector('#vBody');
  m.onTab=t=>{tab=t;paint()};
  let canvas,ctx,drawing=false,tool='pen',color=getComputedStyle(root).getPropertyValue('--ac').trim()||'#1F5E52',size=4,alpha=1,undo=[],redo=[],start=null,snapshot=null;
  function paint(){
    if(tab==='sketch'){
      box.innerHTML=`<div class="line">
        <div class="seg" id="vTools">${[['pen','pen'],['line','line'],['square','square'],['circle','circle'],['eraser','eraser']].map(([v,i])=>`<button data-t="${v}" aria-pressed="${tool===v}" title="${v}">${I(i)}</button>`).join('')}</div>
        <input type="color" id="vColor" value="${color}" aria-label="Colour"/>
        <div class="swatches" id="vSw"></div>
        <label class="line" style="gap:6px;font-size:.75rem;color:var(--tx2);flex-wrap:nowrap">Size<input type="range" id="vSize" min="1" max="60" value="${size}" style="width:90px"/></label>
        <label class="line" style="gap:6px;font-size:.75rem;color:var(--tx2);flex-wrap:nowrap">Opacity<input type="range" id="vAlpha" min="10" max="100" value="${alpha*100}" style="width:80px"/></label>
        <span style="flex:1"></span>
        <button class="btn sm" id="vUndo" title="Undo">${I('undo')}</button><button class="btn sm" id="vRedo" title="Redo">${I('redo')}</button>
        <button class="btn sm" id="vClear" title="Clear">${I('trash')}</button><button class="btn sm" id="vSave">${I('download')}PNG</button>
        <button class="btn p sm" id="vSend">${I('send')}Send to chat</button></div>
        <div class="canvas-wrap"><canvas id="sketch" width="1200" height="700"></canvas></div>`;
      const pal=['#1F5E52','#3A4E6B','#8A5A3B','#2E6B4F','#8A6320','#A3392F','#2C5A8A','#1A1A18','#FFFFFF'];
      box.querySelector('#vSw').innerHTML=pal.map(c=>`<button class="swatch${c===color?' on':''}" data-c="${c}" style="background:${c}" aria-label="${c}"></button>`).join('');
      box.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;box.querySelector('#vColor').value=color;box.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b))});
      box.querySelector('#vColor').oninput=e=>{color=e.target.value};
      box.querySelector('#vSize').oninput=e=>size=+e.target.value;
      box.querySelector('#vAlpha').oninput=e=>alpha=+e.target.value/100;
      box.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tool=b.dataset.t;box.querySelectorAll('[data-t]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
      canvas=box.querySelector('#sketch');ctx=canvas.getContext('2d');
      ctx.fillStyle=getComputedStyle(root).getPropertyValue('--surface').trim()||'#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
      const saved=S.sketches.find(x=>x.projectId===S.activeProject);
      if(saved){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0);im.src=saved.data}
      const pos=e=>{const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*(canvas.width/r.width),y:(e.clientY-r.top)*(canvas.height/r.height)}};
      const push=()=>{undo.push(canvas.toDataURL());if(undo.length>25)undo.shift();redo=[]};
      canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);push();drawing=true;start=pos(e);snapshot=ctx.getImageData(0,0,canvas.width,canvas.height);
        if(tool==='pen'||tool==='eraser'){ctx.beginPath();ctx.moveTo(start.x,start.y)}};
      canvas.onpointermove=e=>{
        if(!drawing)return;const p=pos(e);
        ctx.globalAlpha=alpha;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=size;
        if(tool==='pen'){ctx.strokeStyle=color;ctx.lineTo(p.x,p.y);ctx.stroke()}
        else if(tool==='eraser'){ctx.strokeStyle=getComputedStyle(root).getPropertyValue('--surface').trim()||'#fff';ctx.lineTo(p.x,p.y);ctx.stroke()}
        else{ctx.putImageData(snapshot,0,0);ctx.strokeStyle=color;ctx.beginPath();
          if(tool==='line'){ctx.moveTo(start.x,start.y);ctx.lineTo(p.x,p.y)}
          else if(tool==='square')ctx.rect(start.x,start.y,p.x-start.x,p.y-start.y);
          else ctx.ellipse((start.x+p.x)/2,(start.y+p.y)/2,Math.abs(p.x-start.x)/2,Math.abs(p.y-start.y)/2,0,0,Math.PI*2);
          ctx.stroke()}
        ctx.globalAlpha=1;
      };
      const end=()=>{if(!drawing)return;drawing=false;
        const data=canvas.toDataURL();
        const ex=S.sketches.find(x=>x.projectId===S.activeProject);
        if(ex)ex.data=data;else S.sketches.push({id:uid(),projectId:S.activeProject,data,updatedAt:Date.now()});
        saveS()};
      canvas.onpointerup=end;canvas.onpointercancel=end;
      box.querySelector('#vUndo').onclick=()=>{if(!undo.length)return;redo.push(canvas.toDataURL());const d=undo.pop();const im=new Image();im.onload=()=>ctx.drawImage(im,0,0);im.src=d};
      box.querySelector('#vRedo').onclick=()=>{if(!redo.length)return;undo.push(canvas.toDataURL());const d=redo.pop();const im=new Image();im.onload=()=>ctx.drawImage(im,0,0);im.src=d};
      box.querySelector('#vClear').onclick=()=>{push();ctx.fillStyle=getComputedStyle(root).getPropertyValue('--surface').trim()||'#fff';ctx.fillRect(0,0,canvas.width,canvas.height)};
      box.querySelector('#vSave').onclick=()=>{canvas.toBlob(b=>{const u=URL.createObjectURL(b);const a=Object.assign(document.createElement('a'),{href:u,download:'forge-sketch.png'});a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)})};
      box.querySelector('#vSend').onclick=()=>{attachments.push({kind:'image',name:'sketch.png',data:canvas.toDataURL('image/png'),size:0});paintAtts();m.close();toast('Sketch attached.',{type:'ok'})};
    }
    else if(tab==='board'){
      let board=S.boards.find(b=>b.projectId===S.activeProject);
      if(!board){board={id:uid(),projectId:S.activeProject,items:[]};S.boards.push(board);saveS()}
      box.innerHTML=`<div class="line">
        <button class="btn sm" id="bImg">${I('image')}Add image</button>
        <button class="btn sm" id="bNote">${I('type')}Add note</button>
        <button class="btn sm" id="bColor">${I('palette')}Add colour</button>
        <button class="btn sm" id="bTidy">${I('grid')}Tidy grid</button>
        <span style="flex:1"></span>
        <button class="btn sm" id="bExp">${I('download')}Export JSON</button>
        <button class="btn p sm" id="bSend">${I('send')}Send board</button></div>
        <div class="board" id="board"></div>`;
      const bd=box.querySelector('#board');
      const render=()=>{
        bd.innerHTML=board.items.map(it=>`<div class="bitem" data-b="${it.id}" style="left:${it.x}px;top:${it.y}px;width:${it.w}px;height:${it.h}px">
          ${it.kind==='image'?`<img src="${esc(it.data)}" alt=""/>`:it.kind==='note'?`<div class="note-t">${esc(it.text)}</div>`:`<div class="sw-fill" style="background:${esc(it.color)}"></div>`}
          <button class="bx" data-bx="${it.id}">${I('x')}</button><span class="rz" data-rz="${it.id}"></span></div>`).join('')
          ||`<div style="position:absolute;inset:0;display:grid;place-items:center;color:var(--tx3);font-size:.8125rem;text-align:center;padding:20px">Empty board. Add images, notes and colour chips, then drag to arrange.</div>`;
        bd.querySelectorAll('[data-bx]').forEach(b=>b.onclick=e=>{e.stopPropagation();board.items=board.items.filter(x=>x.id!==b.dataset.bx);saveS();render()});
        bd.querySelectorAll('[data-b]').forEach(el=>{
          el.onpointerdown=e=>{
            if(e.target.closest('[data-bx]'))return;
            const it=board.items.find(x=>x.id===el.dataset.b);const rz=e.target.closest('[data-rz]');
            el.setPointerCapture(e.pointerId);el.classList.add('drag');
            const sx=e.clientX,sy=e.clientY,ox=it.x,oy=it.y,ow=it.w,oh=it.h;
            const bw=bd.clientWidth,bh=bd.clientHeight;
            const mv=ev=>{
              if(rz){it.w=clamp(ow+ev.clientX-sx,60,Math.max(60,bw-it.x));it.h=clamp(oh+ev.clientY-sy,44,Math.max(44,bh-it.y))}
              else{it.x=clamp(ox+ev.clientX-sx,0,Math.max(0,bw-it.w));it.y=clamp(oy+ev.clientY-sy,0,Math.max(0,bh-it.h))}
              el.style.left=it.x+'px';el.style.top=it.y+'px';el.style.width=it.w+'px';el.style.height=it.h+'px'};
            const up=()=>{el.classList.remove('drag');el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);saveS()};
            el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);
          };
        });
      };
      render();
      box.querySelector('#bImg').onclick=()=>{
        const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.multiple=true;
        inp.onchange=async()=>{for(const f of [...inp.files]){const d=await readDataURL(f);
          board.items.push({id:uid(),kind:'image',data:d,x:20+board.items.length*18,y:20+board.items.length*14,w:200,h:150})}saveS();render()};
        inp.click();
      };
      box.querySelector('#bNote').onclick=async()=>{const t=await promptModal({title:'Board note',label:'Text',multiline:true});
        if(t){board.items.push({id:uid(),kind:'note',text:t,x:30,y:30,w:200,h:120});saveS();render()}};
      box.querySelector('#bColor').onclick=()=>{board.items.push({id:uid(),kind:'color',color:'#1F5E52',x:40,y:40,w:110,h:80});saveS();render()};
      box.querySelector('#bTidy').onclick=()=>{const cols=Math.max(1,Math.floor((bd.clientWidth-16)/216));
        board.items.forEach((it,i)=>{it.x=16+(i%cols)*216;it.y=16+Math.floor(i/cols)*170;it.w=200;it.h=150});saveS();render()};
      box.querySelector('#bExp').onclick=()=>dl('forge-moodboard.json',JSON.stringify(board,null,2),'application/json');
      box.querySelector('#bSend').onclick=async()=>{
        const cv=document.createElement('canvas');cv.width=1200;cv.height=800;const c2=cv.getContext('2d');
        c2.fillStyle=getComputedStyle(root).getPropertyValue('--surface2').trim()||'#fafaf8';c2.fillRect(0,0,1200,800);
        for(const it of board.items){
          if(it.kind==='image'){await new Promise(r=>{const im=new Image();im.onload=()=>{c2.drawImage(im,it.x,it.y,it.w,it.h);r()};im.onerror=r;im.src=it.data})}
          else if(it.kind==='color'){c2.fillStyle=it.color;c2.fillRect(it.x,it.y,it.w,it.h)}
          else{c2.fillStyle='#ffffff';c2.fillRect(it.x,it.y,it.w,it.h);c2.fillStyle='#1A1A18';c2.font='14px sans-serif';
            it.text.split('\n').forEach((l,i)=>c2.fillText(l.slice(0,32),it.x+10,it.y+22+i*18))}
        }
        attachments.push({kind:'image',name:'moodboard.png',data:cv.toDataURL('image/png'),size:0});paintAtts();m.close();toast('Moodboard attached.',{type:'ok'});
      };
    }
    else{
      box.innerHTML=`<div class="card"><b>${I('palette')}Extract a palette from any image</b>
        <div class="line"><button class="btn p sm" id="plUp">${I('upload')}Choose image</button><span class="help">Colours are sampled locally.</span></div>
        <div class="swatches" id="plOut" style="margin-top:8px"></div></div>
        <div class="card"><b>${I('layers')}Workspace palette</b><div class="swatches" id="plBase"></div>
        <p class="help">The exact tokens this interface uses. Click to copy the hex.</p></div>`;
      const base=['#1F5E52','#3A4E6B','#8A5A3B','#2E6B4F','#8A6320','#A3392F','#2C5A8A','#F5F5F3','#1A1A18'];
      const put=(host,arr)=>{host.innerHTML=arr.map(c=>`<button class="swatch" style="background:${c};width:44px;height:44px" data-hex="${c}" title="${c}"></button>`).join('');
        host.querySelectorAll('[data-hex]').forEach(b=>b.onclick=async()=>{if(await clip(b.dataset.hex))toast(b.dataset.hex+' copied.',{type:'ok',timeout:1600})})};
      put(box.querySelector('#plBase'),base);
      box.querySelector('#plUp').onclick=()=>{
        const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
        inp.onchange=async()=>{
          const f=inp.files[0];if(!f)return;const d=await readDataURL(f);
          const im=new Image();im.onload=()=>{
            const cv=document.createElement('canvas');cv.width=80;cv.height=80;const c2=cv.getContext('2d');c2.drawImage(im,0,0,80,80);
            const px=c2.getImageData(0,0,80,80).data;const map={};
            for(let i=0;i<px.length;i+=4){const r=px[i]>>5<<5,g=px[i+1]>>5<<5,b=px[i+2]>>5<<5;const k=`${r},${g},${b}`;map[k]=(map[k]||0)+1}
            const top=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k])=>'#'+k.split(',').map(v=>(+v).toString(16).padStart(2,'0')).join(''));
            put(box.querySelector('#plOut'),top);
          };im.src=d;
        };inp.click();
      };
    }
  }
  paint();
}

"const json=(d,s=200)=>new Response(JSON.stringify(d),{status:s,headers:{'Content-Type':'application/json',...CORS}});",
"const hits=new Map();",
"function limited(ip,max=120){const now=Date.now(),w=hits.get(ip)||{n:0,t:now};",

"  async fetch(req,env){",

"    const url=new URL(req.url);",
"    const ip=req.headers.get('cf-connecting-ip')||'anon';",
"    if(limited(ip))return json({error:'rate limited'},429);",
"    const token=req.headers.get('x-forge-token')||'';",
"    if(env.FORGE_TOKEN&&token!==env.FORGE_TOKEN)return json({error:'bad forge token'},401);",

"        const key=req.headers.get('x-forge-key')||'';",

"        const body=await req.json();",
"        if(!base)return json({error:'missing x-forge-base'},400);",
"        if(adapter==='anthropic'){",
"          const sys=body.messages.filter(m=>m.role==='system').map(m=>m.content).join('\\n');",
"          const msgs=body.messages.filter(m=>m.role!=='system').map(m=>({role:m.role==='tool'?'user':m.role,",
"            content:typeof m.content==='string'?m.content:JSON.stringify(m.content)}));",
"          const r=await fetch(base+'/v1/messages',{method:'POST',",
"            headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01'},",
"            body:JSON.stringify({model:body.model,system:sys,messages:msgs,max_tokens:body.max_tokens||4096,stream:!!body.stream})});",
"          if(!body.stream){const j=await r.json();const text=(j.content||[]).map(c=>c.text||'').join('');",
"            return json({choices:[{message:{role:'assistant',content:text},finish_reason:j.stop_reason||'stop'}]})}",
"          const {readable,writable}=new TransformStream();const w=writable.getWriter();const enc=new TextEncoder();",
"          (async()=>{const rd=r.body.getReader();const dec=new TextDecoder();let buf='';",
"            while(true){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});",
"              let i;while((i=buf.indexOf('\\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);",
"                if(!line.startsWith('data:'))continue;",
"                try{const ev=JSON.parse(line.slice(5));",
"                  if(ev.type==='content_block_delta'&&ev.delta?.text)",
"                    await w.write(enc.encode('data: '+JSON.stringify({choices:[{delta:{content:ev.delta.text}}]})+'\\n\\n'));",
"                  if(ev.type==='message_stop')await w.write(enc.encode('data: [DONE]\\n\\n'));",
"                }catch{}}}",
"            await w.close()})();",
"          return new Response(readable,{headers:{'Content-Type':'text/event-stream','Cache-Control':'no-cache',...CORS}});",
"        }",
"        const headers={'Content-Type':'application/json'};if(key)headers.Authorization='Bearer '+key;",
"        const up=await fetch(base+'/chat/completions',{method:'POST',headers,body:JSON.stringify(body)});",
"        return new Response(up.body,{status:up.status,headers:{'Content-Type':up.headers.get('content-type')||'application/json','Cache-Control':'no-cache',...CORS}});",
"      }",
"      if(url.pathname==='/models'&&req.method==='POST'){",
"        const {base,key}=await req.json();const h={};if(key)h.Authorization='Bearer '+key;",
"        const r=await fetch(base.replace(/\\/+$/,'')+'/models',{headers:h});",
"        return new Response(await r.text(),{status:r.status,headers:{'Content-Type':'application/json',...CORS}});",
"      }",
"      if(url.pathname==='/mcp'&&req.method==='POST'){",
"        const {url:target,payload,headers}=await req.json();",
"        const r=await fetch(target,{method:'POST',",
"          headers:{'Content-Type':'application/json',Accept:'application/json, text/event-stream',...(headers||{})},",
"          body:JSON.stringify(payload)});",
"        const out=new Response(r.body,{status:r.status,headers:{'Content-Type':r.headers.get('content-type')||'application/json',...CORS}});",

"        return out;",

"      if(url.pathname==='/fetch'&&req.method==='POST'){",

function openWorker(){

      box.innerHTML=`<div class="note in">${I('info')}<span>The Worker holds nothing by default — keys are forwarded per request from this browser. Set <code>FORGE_TOKEN</code> as a secret so only your app can use it.</span></div>

        <div id="wNote"></div>

    }

  };

function exportWorkspace(){dl('forge-workspace-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(S,null,2),'application/json');toast('Workspace exported.',{type:'ok'})}
function exportChat(){
  const c=chat();if(!c){toast('Open a chat first.',{type:'wa'});return}
  const out=['# '+c.title,'','_Forge Studio · '+new Date().toLocaleString()+' · '+proj().name+'_',''];
  c.messages.forEach(m=>{
    out.push('## '+(m.role==='user'?'You':'Forge')+(m.model?' · '+m.model:''),'');
    if(m.role==='user')out.push(m.content,'');
    else (m.segments||[]).forEach(s=>{
      if(s.type==='text')out.push(s.text,'');
      if(s.type==='tool')out.push('```tool '+s.name+'\n'+s.args+'\n---\n'+String(s.result||'').slice(0,2000)+'\n```','');
    });
  });
  dl(c.title.replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-').slice(0,50)+'.md',out.join('\n'),'text/markdown');
  toast('Chat exported.',{type:'ok'});
}

  const paint=()=>{
    L.innerHTML=cur.map((c,i)=>`<div class="pal-item${i===hi?' hi':''}" data-i="${i}">${I(c.i)}<span>${esc(c.n)}</span>${c.k?`<small>${esc(c.k)}</small>`:''}</div>`).join('')||'<div class="pal-item">No command matches.</div>';
    L.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const c=cur[+b.dataset.i];close();c.f()});
  };
  const close=()=>{palEl?.remove();palEl=null};
  q.oninput=()=>{const v=q.value.toLowerCase();cur=COMMANDS.filter(c=>c.n.toLowerCase().includes(v));hi=0;paint()};
  q.onkeydown=e=>{
    if(e.key==='ArrowDown'){e.preventDefault();hi=Math.min(cur.length-1,hi+1);paint();L.children[hi]?.scrollIntoView({block:'nearest'})}
    if(e.key==='ArrowUp'){e.preventDefault();hi=Math.max(0,hi-1);paint();L.children[hi]?.scrollIntoView({block:'nearest'})}
    if(e.key==='Enter'){e.preventDefault();const c=cur[hi];close();c&&c.f()}
    if(e.key==='Escape')close();
  };
  palEl.querySelector('.mscrim').onclick=close;
  paint();setTimeout(()=>q.focus(),30);
}
function showShortcuts(){
  const rows=[['Ctrl / ⌘ + K','Command palette'],['Ctrl / ⌘ + M','Model picker'],['Ctrl / ⌘ + N','New chat'],['Ctrl / ⌘ + ,','Settings'],
    ['Ctrl / ⌘ + B','Toggle work panel'],['Ctrl / ⌘ + J','Terminal'],['Enter','Send message'],['Shift + Enter','New line'],
    ['Esc','Stop generation / close modal'],['↑ / ↓ in terminal','Command history'],['Tab in terminal','Autocomplete'],['Ctrl + L in terminal','Clear']];
  modal({title:'Keyboard shortcuts',icon:'cmd',size:'md',body:`<div class="scroll-list">${rows.map(([k,v])=>`<div class="kv"><dt>${esc(v)}</dt><dd><span class="kbd">${esc(k)}</span></dd></div>`).join('')}</div>`});
}
function setMode(m){
  proj().agent.mode=m;PF.mode=m;saveS();savePF();
  $$('#modeSeg [data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===m)));
  toast('Mode: '+m,{type:'in',timeout:1600});
}
$('#modeSeg').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(b)setMode(b.dataset.mode)});
function navTo(v){
  $$('.rbtn').forEach(b=>b.classList.toggle('on',b.dataset.nav===v));
  if(v==='chats'){openSidebar();return}
  ({projects:openProjects,agents:openAgents,skills:openSkills,mcp:openMCP,connectors:openConnectors,
    providers:openProviders,visuals:openVisuals,worker:openWorker,settings:openSettings,palette:openPalette,
    terminal:()=>openPanel('term')})[v]?.();
}
$$('.rbtn').forEach(b=>b.onclick=()=>navTo(b.dataset.nav));
document.addEventListener('keydown',e=>{
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()}
  else if(mod&&e.key.toLowerCase()==='m'){e.preventDefault();openModelPicker()}
  else if(mod&&e.key.toLowerCase()==='n'){e.preventDefault();$('#btnNew').click()}
  else if(mod&&e.key===','){e.preventDefault();openSettings()}
  else if(mod&&e.key.toLowerCase()==='b'){e.preventDefault();$('#btnPanel').click()}
  else if(mod&&e.key.toLowerCase()==='j'){e.preventDefault();openPanel('term')}
  else if(e.key==='Escape'){
    if(palEl){palEl.remove();palEl=null;return}
    if(openSel){openSel.remove();openSel=null;return}
    if(modalStack.length)return;
    if($('#sidebar').classList.contains('on')){closeSidebar();return}
    if(mqTablet.matches&&root.dataset.panel==='open'){closePanel();return}
    if(live){live.stopped=true;try{live.ac.abort()}catch{}}
  }
});
function paintTheme(){
  root.dataset.theme=PF.theme;root.dataset.accent=PF.accent;root.dataset.density=PF.density;
  root.dataset.focus=PF.focus?'on':'off';
  $('#themeIc').setAttribute('href',PF.theme==='light'?'#i-moon':'#i-sun');
  if(hlL){hlL.disabled=PF.theme!=='light';hlD.disabled=PF.theme==='light'}
}
$('#btnTheme').onclick=()=>{PF.theme=PF.theme==='light'?'dark':'light';savePF();paintTheme()};
window.addEventListener('online',()=>{paintState();toast('Back online.',{type:'ok',timeout:2000})});
window.addEventListener('offline',paintState);
window.addEventListener('pagehide',()=>{if(live){live.stopped=true;try{live.ac.abort()}catch{}}stopMic();speechSynthesis.cancel?.()});
let errAt=0;
window.addEventListener('error',e=>{console.error('[forge]',e.error||e.message);
  if(Date.now()-errAt>5000){errAt=Date.now();toast('Unexpected error — console has details. Your data is safe.',{type:'er'})}});
window.addEventListener('unhandledrejection',e=>{if(e.reason?.name!=='AbortError')console.error('[forge] async',e.reason)});

root.dataset.panel=PF.panel==='open'?'open':'closed';
paintTheme();paintTts();paintChip();paintState();paintFoot();layout();renderChats();renderThread();renderPanel();paintSend();grow();applyViewport();
$$('#modeSeg [data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===(proj().agent.mode||PF.mode))));
$('#cSortL').textContent=SORTS.find(s=>s.v===PF.sort)?.n||'Recent';
$('#cStar').setAttribute('aria-pressed',String(PF.starOnly));
$('#cAll').setAttribute('aria-pressed',String(PF.allProjects));
if(S.activeChat){const c=chat();if(c){input.value=c.draft||'';grow();paintSend()}}
listModels(S.activeProvider).then(l=>{
  if(!S.activeModel&&l.length){S.activeModel=l[0].id;saveS();paintChip();paintState();paintFoot();paintHero()}
}).catch(()=>{});
if(!Object.keys(S.keys).some(k=>!k.startsWith('__'))&&!provById(S.activeProvider)?.nokey){
  setTimeout(()=>toast('Add a gateway key to start. 80 providers, free tiers and an uncensored lane are ready.',
    {type:'in',timeout:8000,action:{label:'Open gateways',fn:()=>openProviders()}}),700);
}
</script>
