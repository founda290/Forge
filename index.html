async function termExec(cmd,silent=false){
  const line=cmd.trim();if(!silent)tput('❯ '+line,'cmd');
  if(!line)return '';
  termHist.push(line);termHi=termHist.length;
  const [c,...rest]=line.split(/\s+/),arg=rest.join(' ');let out='',cls='';
  try{
    switch(c){
      case 'help':out=['Forge terminal','  help                    this list','  ls / cat / write / rm   project files',
        '  echo <text>             print','  js <code>               sandboxed JavaScript','  http <url>              fetch (worker aware)',
        '  con                     list connectors','  con add <url>           connect an MCP URL',
        '  con call <name> <tool> {json}','  con on|off <name>       enable / disable connector',
        '  skill / skill run <name> <input>','  agent / agent run <name> <task>',
        '  provider / models / project','  approve on|off          auto-approve tool calls',
        '  task <title> / tasks','  export                  download log','  clear'].join('\n');break;
      case 'clear':termLines=[];renderConsole();return '';
      case 'ls':out=projectFiles().map(f=>`${f.name.padEnd(26)} ${bytes(f.size)}`).join('\n')||'(no files)';break;
      case 'cat':{const f=projectFiles().find(x=>x.name===arg);out=f?f.content:'Not found: '+arg;if(!f)cls='err';break}
      case 'write':{const n=rest[0],body=rest.slice(1).join(' ');if(!n){out='usage: write <file> <text>';cls='err';break}
        S.files.push({id:uid(),projectId:S.activeProject,name:n,type:'text',content:body,size:body.length,createdAt:Date.now()});saveS();out='wrote '+n;cls='ok';break}
      case 'rm':{const i=S.files.findIndex(x=>x.projectId===S.activeProject&&x.name===arg);
        if(i<0){out='Not found';cls='err'}else{S.files.splice(i,1);saveS();out='removed '+arg;cls='ok'}break}
      case 'echo':out=arg;break;
      case 'js':out=await runJS(arg);break;
      case 'http':{const r=await proxyFetch(arg);out=(await r.text()).slice(0,4000);cls='ok';break}
      case 'con':{
        if(rest[0]==='add'){const url=rest[1];if(!url){out='usage: con add <url>';cls='err';break}
          const d=DIRECTORY.find(x=>x.u===url);
          const cn={id:uid(),name:d?.n||new URL(url).hostname,url,cat:d?.c||'local',i:d?.i||'link',status:'new',tools:[],headers:{},viaWorker:workerOn(),autoEnabled:true,addedAt:Date.now()};
          S.connectors.push(cn);saveS();await connectURL(cn);out=cn.status+' · '+cn.tools.length+' tools';cls=cn.status==='online'?'ok':'err';break}
        if(rest[0]==='call'){const cn=S.connectors.find(x=>x.name===rest[1]||x.id===rest[1]);if(!cn){out='connector not found';cls='err';break}
          let a={};try{a=JSON.parse(rest.slice(3).join(' ')||'{}')}catch{}
          out=await mcpCall(cn,rest[2],a);cls='ok';break}
        if(rest[0]==='on'||rest[0]==='off'){const cn=S.connectors.find(x=>x.name===rest[1]||x.id===rest[1]);
          if(!cn){out='connector not found';cls='err';break}
          const o=off();o.connectors=rest[0]==='off'?[...new Set([...o.connectors,cn.id])]:o.connectors.filter(x=>x!==cn.id);
          saveS();paintFoot();out=cn.name+' '+(rest[0]==='off'?'disabled':'enabled');cls='ok';break}
        out=S.connectors.map(x=>`${x.status==='online'?'●':'○'} ${x.name} [${x.status}] ${x.tools.length} tools\n   ${x.url}`).join('\n')||'No connectors. con add <url>';break}
      case 'skill':{
        if(rest[0]==='run'){const s=S.skills.find(x=>x.name.toLowerCase()===rest[1]?.toLowerCase());
          out=s?(await execTool('skill__'+s.id,{input:rest.slice(2).join(' ')})).out:'skill not found';cls=s?'ok':'err'}
        else out=S.skills.map(s=>`${s.enabled?'●':'○'} ${s.name} — ${s.description}`).join('\n')||'No skills.';break}
      case 'agent':{
        if(rest[0]==='run'){out=await runSubagent(rest[1],rest.slice(2).join(' '));cls='ok'}
        else out=S.subagents.map(a=>`${a.name} — ${a.role}`).join('\n')||'No subagents.';break}
      case 'provider':{const g=gateway();out=`${g.p.n}\nbase: ${g.base}\nkey: ${g.key?'set':'not set'}\nmodel: ${S.activeModel||'—'}\nworker: ${workerOn()?PF.workerUrl:'off'}`;break}
      case 'models':out=(S.modelsCache[S.activeProvider]?.list||[]).slice(0,60).map(m=>m.id+(m.free?'  [free]':'')).join('\n')||'No cached models.';break;
      case 'project':{const p=proj();out=`${p.name}\nchats: ${S.chats.filter(c=>c.projectId===p.id).length}\nfiles: ${projectFiles().length}\ntools live: ${toolSpecs().length}\nauto-approve: ${PF.autoApprove}`;break}
      case 'approve':{PF.autoApprove=rest[0]!=='off';savePF();paintAgentbar();out='auto-approve '+(PF.autoApprove?'on':'off');cls='ok';break}
      case 'task':S.tasks.push({id:uid(),projectId:S.activeProject,title:arg,due:'',done:false,createdAt:Date.now()});saveS();out='task added';cls='ok';break;
      case 'tasks':out=S.tasks.filter(t=>t.projectId===S.activeProject).map(t=>`${t.done?'✔':'○'} ${t.title}`).join('\n')||'No tasks.';break;
      case 'export':dl('forge-terminal.log',termLines.map(l=>l.v).join('\n'));out='log downloaded';cls='ok';break;
      default:out=`Unknown command: ${c}. Try help.`;cls='err';
    }
  }catch(e){out=String(e.message||e);cls='err'}
  if(out)tput(out,cls);
  renderConsole();renderPanel();
  return out;
}
function renderConsole(){
  if(!PF.consoleOpen)return;
  $$('#conTabs [data-c]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.c===PF.consoleTab)));
  const body=$('#conBody');

      <div class="term-in"><span>❯</span><input type="text" id="tIn" placeholder="type help" aria-label="Terminal command" autocomplete="off"/></div></div>`;
    const o=$('#tOut');o.scrollTop=o.scrollHeight;

        const oo=$('#tOut');if(oo)oo.scrollTop=oo.scrollHeight}
      else if(e.key==='ArrowUp'){e.preventDefault();termHi=Math.max(0,termHi-1);inp.value=termHist[termHi]||''}

      else if(e.key==='Tab'){e.preventDefault();const cs=['help','ls','cat','write','rm','echo','js','http','con','skill','agent','provider','models','project','approve','task','tasks','export','clear'];
        const m=cs.filter(x=>x.startsWith(inp.value));if(m.length===1)inp.value=m[0]+' '}
      else if(e.key==='l'&&e.ctrlKey){e.preventDefault();termLines=[];renderConsole()}
    };
  }
  else if(PF.consoleTab==='steps'){

  }
  else if(PF.consoleTab==='files'){
    const fl=projectFiles();
    body.innerHTML=`<div class="con-scroll">${fl.length?fl.map(f=>`<div class="steprow"><span class="sn">${I('file')}</span>
      <span class="si"><b>${esc(f.name)}</b><small>${bytes(f.size)}</small></span>
      <button class="btn q sm" data-fv="${f.id}">${I('eye')}</button><button class="btn q sm" data-fd="${f.id}">${I('trash')}</button></div>`).join(''):'<p class="help">No project files. Drop files on the composer or use + → Attach.</p>'}
      <button class="btn sm" id="conAddFile">${I('upload')}Add files</button></div>`;
    $('#conAddFile').onclick=()=>$('#filePick').click();
    body.querySelectorAll('[data-fv]').forEach(b=>b.onclick=()=>{const f=S.files.find(x=>x.id===b.dataset.fv);
      modal({title:f.name,icon:'file',size:'lg',body:`<div class="codeview"><pre>${esc(f.content.slice(0,60000))}</pre></div>`,
        foot:`<span class="sp"></span><button class="btn" data-d>${I('download')}Download</button>`}).el.querySelector('[data-d]').onclick=()=>dl(f.name,f.content)});
    body.querySelectorAll('[data-fd]').forEach(b=>b.onclick=()=>{S.files=S.files.filter(x=>x.id!==b.dataset.fd);saveS();renderConsole()});

  else{

      <button class="btn sm" id="conPlus">${I('plus')}Open tools menu</button></div>`;

async function runBuiltin(name){
  const spec=BUILTINS.find(b=>b[0]===name);if(!spec)return;
  const props=spec[3].properties||{},keys=Object.keys(props);
  if(!keys.length){const r=await execTool(name,{});tput(r.out,r.ok?'ok':'err');toggleConsole(true);PF.consoleTab='term';savePF();renderConsole();return}
  const m=modal({title:'Run '+name,icon:spec[2],size:'md',
    body:keys.map(k=>`<div class="field"><label class="lbl">${esc(k)}${(spec[3].required||[]).includes(k)?' *':''}</label>
      ${k==='code'||k==='content'||k==='instructions'||k==='note'?`<textarea rows="7" data-p="${k}"></textarea>`:`<input type="text" data-p="${k}" placeholder="${esc(props[k].type)}"/>`}</div>`).join(''),
    foot:`<span class="sp"></span><button class="btn" data-no>Cancel</button><button class="btn p" data-go>${I('play')}Run</button>`});
  m.el.querySelector('[data-no]').onclick=()=>m.close();
  m.el.querySelector('[data-go]').onclick=async()=>{
    const args={};m.el.querySelectorAll('[data-p]').forEach(i=>{if(i.value.trim())args[i.dataset.p]=i.value});
    m.close();setStep('Running '+name);tput('❯ '+name,'cmd');
    const r=await execTool(name,args);tput(r.out,r.ok?'ok':'err');
    turnSteps.push({name,ok:r.ok,ms:r.ms,at:Date.now()});
    toggleConsole(true);PF.consoleTab='term';savePF();renderConsole();paintAgentbar();
  };
}

function visibleChats(){
  let l=S.chats.filter(c=>PF.allProjects||c.projectId===S.activeProject);
  if(PF.starOnly)l=l.filter(c=>c.pinned);
  if(chatQ){const q=chatQ.toLowerCase();l=l.filter(c=>c.title.toLowerCase().includes(q)||c.messages.some(m=>(m.content||'').toLowerCase().includes(q)))}
  if(PF.sort==='oldest')l.sort((a,b)=>a.updatedAt-b.updatedAt);
  else if(PF.sort==='alpha')l.sort((a,b)=>a.title.localeCompare(b.title));

function openConnectors(cat='all',focusId=null){
  conCat=cat;conFocus=focusId;
  const m=modal({title:'Connectors',icon:'plug',size:'full',flush:true,tag:'<span class="beta">URL only</span>',
    tabs:[{id:'dir',n:'Endpoint directory',i:'layers'},{id:'mine',n:'Connected',i:'check'}],
    body:`<div class="split"><div class="split-l" id="dCats"></div><div class="split-r" id="dPane"></div></div>`,
    foot:`<span>No tokens. Paste a URL — Forge speaks MCP directly.</span><span class="sp"></span>
      <button class="btn sm" id="dWorker">${I('worker')}Worker proxy</button><button class="btn p sm" id="dDone">${I('check')}Done</button>`});
  const cats=m.el.querySelector('#dCats'),pane=m.el.querySelector('#dPane');
  let tab=focusId?'mine':'dir';
  m.el.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
  const counts=id=>id==='all'?DIRECTORY.length:DIRECTORY.filter(d=>d.c===id).length;
  function paintCats(){
    cats.innerHTML=DIR_CATS.map(c=>`<button class="catbtn${conCat===c.id?' on':''}" data-c="${c.id}">${I(c.i)}<span>${esc(c.n)}</span><small>${counts(c.id)}</small></button>`).join('');
    cats.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{conCat=b.dataset.c;tab='dir';
      m.el.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',String(x.dataset.tab==='dir')));paintCats();paintPane()});
  }
  function paintPane(){
    if(tab==='mine'){paintMine();return}
    const q=conQ.toLowerCase();
    const list=DIRECTORY.filter(d=>(conCat==='all'||d.c===conCat)&&(!q||(d.n+d.u+d.d).toLowerCase().includes(q)));
    pane.innerHTML=`<div class="line"><div class="searchbar">${I('search')}<input type="text" id="dQ" value="${esc(conQ)}" placeholder="Search ${DIRECTORY.length} endpoints"/></div></div>
      <div class="card" style="background:var(--surface)">
        <b>${I('link')}Connect any MCP URL</b>
        <div class="line" style="flex-wrap:nowrap"><input type="text" id="dUrl" placeholder="https://your-server.com/mcp" spellcheck="false"/><button class="btn p" id="dGo">${I('plug')}Connect</button></div>
        <p class="help">Streamable HTTP or SSE. Forge runs <code>initialize</code> → <code>tools/list</code>, then auto-enables every tool for this project.</p>
        <div id="dNote"></div>
      </div>
      <div class="pgrid" id="dGrid"></div>`;
    const grid=pane.querySelector('#dGrid');
    grid.innerHTML=list.map((d,i)=>{
      const already=S.connectors.find(c=>c.url===d.u&&d.u);
      return `<button class="pcard${already?' on':''}" data-d="${DIRECTORY.indexOf(d)}">
        <div class="pt">${I(d.i)}<b>${esc(d.n)}</b>${already?I('check'):''}</div>
        <small>${esc(d.d)}</small><div class="urline">${esc(d.u||'paste your own URL')}</div>
        <div class="ptags"><span class="tag ${d.auth==='public'?'ok':'wa'}">${d.auth==='public'?'no sign-in':'provider sign-in'}</span>${already?`<span class="tag ac">${already.tools.length} tools</span>`:''}</div></button>`}).join('')
      ||'<p class="help">No endpoint matches.</p>';
    grid.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{
      const d=DIRECTORY[+b.dataset.d];
      if(!d.u){pane.querySelector('#dUrl').focus();return}
      pane.querySelector('#dUrl').value=d.u;addByURL(d.u,d);
    });
    const si=pane.querySelector('#dQ');
    si.oninput=deb(e=>{conQ=e.target.value.trim();paintPane();const n=pane.querySelector('#dQ');n.focus();n.setSelectionRange(n.value.length,n.value.length)},150);
    pane.querySelector('#dGo').onclick=()=>addByURL(pane.querySelector('#dUrl').value.trim());
    pane.querySelector('#dUrl').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addByURL(e.target.value.trim())}};
  }
  function paintMine(){
    pane.innerHTML=`<div class="line"><div class="searchbar">${I('search')}<input type="text" id="mQ" placeholder="Search connectors"/></div>
      <button class="btn p sm" id="mAdd">${I('plus')}Add URL</button><button class="btn sm" id="mAll">${I('refresh')}Reconnect all</button></div>
      <div class="scroll-list" id="mList"></div>`;
    const paintList=()=>{
      const q=(pane.querySelector('#mQ').value||'').toLowerCase();
      const l=S.connectors.filter(c=>(c.name+c.url).toLowerCase().includes(q));
      pane.querySelector('#mList').innerHTML=l.map(c=>{
        const enabled=c.status==='online'&&!off().connectors.includes(c.id);
        return `<div class="item${c.id===conFocus?' on':''}">
        <div class="im"><b>${esc(c.name)}</b><small class="mono">${esc(c.url)}</small>
          <small>${c.status==='online'?`${c.tools.length} tools · auto-enabled for this project`:esc(c.error||'not connected')}</small>
          ${c.tools.length?`<div class="line" style="margin-top:5px">${c.tools.slice(0,8).map(t=>`<span class="tag">${esc(t.name)}</span>`).join('')}${c.tools.length>8?`<span class="tag">+${c.tools.length-8}</span>`:''}</div>`:''}
          <details class="adv" style="margin-top:7px"><summary>${I('gear')}Advanced</summary><div class="adv-in">
            <div class="field"><label class="lbl">Headers JSON (only if the server demands it)</label><textarea rows="3" data-h="${c.id}">${esc(JSON.stringify(c.headers||{},null,2))}</textarea></div>
            <label class="chk"><input type="checkbox" data-w="${c.id}" ${c.viaWorker?'checked':''}/>Route via Cloudflare Worker</label>
            <button class="btn sm" data-save="${c.id}">${I('save')}Save &amp; reconnect</button>
          </div></details></div>
        <div class="ia"><span class="tag ${c.status==='online'?'ok':c.status==='error'?'er':''}">${esc(c.status)}</span>
          <div class="sw" role="switch" aria-checked="${enabled}" data-tog="${c.id}" tabindex="0" title="Enable for agent"></div>
          <button class="btn q sm" data-rec="${c.id}" title="Reconnect">${I('refresh')}</button>
          <button class="btn q sm" data-tools="${c.id}" title="Tools">${I('layers')}</button>
          <button class="btn q sm" data-del="${c.id}" title="Remove">${I('trash')}</button></div></div>`}).join('')
        ||`<div class="note">${I('plug')}<span>Nothing connected yet. Open the directory and tap an endpoint, or paste any MCP URL.</span></div>`;
      pane.querySelectorAll('[data-tog]').forEach(sw=>sw.onclick=()=>{const id=sw.dataset.tog,o=off(),c=S.connectors.find(x=>x.id===id);
        if(c.status!=='online'){connectURL(c).then(paintList);return}
        o.connectors=o.connectors.includes(id)?o.connectors.filter(x=>x!==id):[...o.connectors,id];saveS();paintFoot();paintList();renderPanel()});
      pane.querySelectorAll('[data-rec]').forEach(b=>b.onclick=async()=>{await connectURL(S.connectors.find(x=>x.id===b.dataset.rec));paintList()});
      pane.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
        if(!await confirmModal({title:'Remove connector?',body:'Its tools are removed from the agent.'}))return;
        S.connectors=S.connectors.filter(x=>x.id!==b.dataset.del);saveS();paintFoot();paintList();renderPanel()});
      pane.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{
        const c=S.connectors.find(x=>x.id===b.dataset.save);
        try{c.headers=JSON.parse(pane.querySelector(`[data-h="${c.id}"]`).value||'{}')}catch{toast('Headers must be valid JSON.',{type:'er'});return}
        c.viaWorker=pane.querySelector(`[data-w="${c.id}"]`).checked;saveS();await connectURL(c);paintList()});
      pane.querySelectorAll('[data-tools]').forEach(b=>b.onclick=()=>{
        const c=S.connectors.find(x=>x.id===b.dataset.tools);
        const mm=modal({title:c.name+' · tools',icon:'layers',size:'lg',body:`<div class="scroll-list">${c.tools.map(t=>`<div class="card">
          <b class="mono" style="font-size:.8125rem">${esc(t.name)}</b><p class="help">${esc(t.description)}</p>
          <div class="codeview"><pre>${esc(JSON.stringify(t.schema,null,2))}</pre></div>
          <button class="btn sm" data-call="${esc(t.name)}">${I('play')}Call tool</button></div>`).join('')||'<p class="help">No tools.</p>'}</div>`});
        mm.el.querySelectorAll('[data-call]').forEach(cb=>cb.onclick=async()=>{
          const raw=await promptModal({title:'Arguments JSON',label:cb.dataset.call,value:'{}',multiline:true});
          if(raw===null)return;let a={};try{a=JSON.parse(raw)}catch{toast('Invalid JSON.',{type:'er'});return}
          try{const out=await mcpCall(c,cb.dataset.call,a);tput(out,'ok');modal({title:'Result',icon:'check',size:'lg',body:`<div class="codeview"><pre>${esc(out)}</pre></div>`})}
          catch(e){toast(e.message,{type:'er',timeout:7000})}});
      });
    };
    pane.querySelector('#mQ').oninput=deb(paintList,120);
    pane.querySelector('#mAdd').onclick=()=>{tab='dir';m.el.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',String(x.dataset.tab==='dir')));paintPane()};
    pane.querySelector('#mAll').onclick=async()=>{for(const c of S.connectors)await connectURL(c,{silent:true});paintList();toast('Reconnect pass complete.',{type:'ok'})};
    paintList();
  }
  async function addByURL(url,meta){
    if(!url){toast('Paste an MCP URL first.',{type:'wa'});return}
    if(!/^https?:\/\//i.test(url)){toast('URL must start with http:// or https://',{type:'er'});return}
    let c=S.connectors.find(x=>x.url===url);
    if(!c){
      let host='connector';try{host=new URL(url).hostname}catch{}
      c={id:uid(),name:meta?.n||host,url,cat:meta?.c||'local',i:meta?.i||'link',status:'new',tools:[],resources:[],headers:{},viaWorker:workerOn(),autoEnabled:true,addedAt:Date.now()};
      S.connectors.push(c);saveS();
    }
    const note=pane.querySelector('#dNote');
    if(note)note.innerHTML=`<div class="note in">${I('refresh')}<span>Handshaking with ${esc(url)}…</span></div>`;
    toggleConsole(true);PF.consoleTab='term';savePF();
    const ok=await connectURL(c);
    if(note)note.innerHTML=`<div class="note ${ok?'ok':'er'}">${I(ok?'check':'alert')}<span>${ok?`${c.tools.length} tools online and auto-enabled for ${esc(proj().name)}.`:'Handshake failed: '+esc(c.error||'')+' — try the Worker proxy, or the endpoint may need provider sign-in.'}</span></div>`;
    paintFoot();paintHero();
    if(ok){tab='mine';conFocus=c.id;m.el.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',String(x.dataset.tab==='mine')));paintPane()}
  }
  m.onTab=t=>{tab=t;paintPane()};
  m.el.querySelector('#dWorker').onclick=openWorker;
  m.el.querySelector('#dDone').onclick=()=>m.close();
  paintCats();paintPane();
}

/* ══ PROJECTS ══ */
function openProjects(){
  const m=modal({title:'Projects',icon:'folder',size:'lg',
    body:`<div class="line"><div class="searchbar">${I('search')}<input type="text" id="pq" placeholder="Search projects"/></div><button class="btn p" id="pNew">${I('plus')}New project</button></div><div class="pgrid" id="pList"></div>`,
    foot:`<span>Chats, files, skills and tool scope are all project-scoped.</span><span class="sp"></span><button class="btn" id="pExp">${I('download')}Export workspace</button>`});
  const paint=()=>{
    const q=(m.el.querySelector('#pq').value||'').toLowerCase();
    m.el.querySelector('#pList').innerHTML=S.projects.filter(p=>p.name.toLowerCase().includes(q)).map(p=>`<div class="pcard${p.id===S.activeProject?' on':''}">
      <div class="pt"><span class="proj-dot" style="background:${esc(p.color)}"></span><b>${esc(p.name)}</b>${p.id===S.activeProject?I('check'):''}</div>
      <small>${esc(p.desc||'No description')}</small>
      <div class="ptags"><span class="tag">${S.chats.filter(c=>c.projectId===p.id).length} chats</span><span class="tag">${S.files.filter(f=>f.projectId===p.id).length} files</span></div>
      <div class="line" style="margin-top:4px"><button class="btn sm" data-open="${p.id}">Open</button><button class="btn q sm" data-edit="${p.id}">${I('edit')}</button><button class="btn q sm" data-del="${p.id}">${I('trash')}</button></div></div>`).join('')||'<p class="help">No projects match.</p>';
    m.el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{S.activeProject=b.dataset.open;S.activeChat='';saveS();layout();renderChats();renderThread();paintChip();paintHero();renderPanel();m.close();toast('Project switched.',{type:'ok',timeout:1800})});
    m.el.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editProject(b.dataset.edit,paint));
    m.el.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      if(S.projects.length===1){toast('Keep at least one project.',{type:'wa'});return}
      const p=S.projects.find(x=>x.id===b.dataset.del);
      if(!await confirmModal({title:'Delete project?',body:`"${p.name}" with its chats, files and tasks.`}))return;
      S.projects=S.projects.filter(x=>x.id!==p.id);S.chats=S.chats.filter(c=>c.projectId!==p.id);
      S.files=S.files.filter(f=>f.projectId!==p.id);S.tasks=S.tasks.filter(t=>t.projectId!==p.id);
      if(S.activeProject===p.id){S.activeProject=S.projects[0].id;S.activeChat=''}
      saveS();paint();layout();renderChats();renderThread();paintChip()});
  };
  m.el.querySelector('#pq').oninput=deb(paint,120);
  m.el.querySelector('#pNew').onclick=()=>editProject(null,paint);
  m.el.querySelector('#pExp').onclick=exportWorkspace;paint();
}
function editProject(id,after){
  const p=id?S.projects.find(x=>x.id===id):null;
  const colors=['#1F5E52','#3A4E6B','#8A5A3B','#2E6B4F','#8A6320','#A3392F','#2C5A8A','#5B5B56'];
  const m=modal({title:p?'Edit project':'New project',icon:'folder',size:'md',
    body:`<div class="field"><label class="lbl">Name</label><input type="text" id="pn" value="${esc(p?.name||'')}"/></div>
      <div class="field"><label class="lbl">Description</label><input type="text" id="pd" value="${esc(p?.desc||'')}"/></div>
      <div class="field"><label class="lbl">Colour</label><div class="swatches">${colors.map(c=>`<button class="swatch${(p?.color||colors[0])===c?' on':''}" data-c="${c}" style="background:${c}" aria-label="${c}"></button>`).join('')}</div></div>
      <div class="field"><label class="lbl">Agent persona</label><textarea id="pp" rows="6">${esc(p?.agent.persona||SYS_DEFAULT)}</textarea></div>
      <div class="grid g2"><div class="field"><label class="lbl">Default mode</label><div id="pm2"></div></div>
      <div class="field"><label class="lbl">Tool approval</label><div id="pa2"></div></div></div>`,
    foot:`<span class="sp"></span><button class="btn" data-no>Cancel</button><button class="btn p" data-ok>${I('check')}Save project</button>`});
  let color=p?.color||colors[0],mode=p?.agent.mode||'auto',aut=p?.agent.autonomy||'auto';
  m.el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;m.el.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b))});
  mountSelect(m.el.querySelector('#pm2'),{value:mode,options:[{v:'fast',n:'Fast',i:'zap'},{v:'auto',n:'Auto',i:'auto'},{v:'think',n:'Thinking',i:'brain'}],onChange:v=>mode=v});
  mountSelect(m.el.querySelector('#pa2'),{value:aut,options:[{v:'auto',n:'Auto-approve tools',i:'zap'},{v:'confirm',n:'Confirm each call',i:'shield'}],onChange:v=>aut=v});
  m.el.querySelector('[data-no]').onclick=()=>m.close();
  m.el.querySelector('[data-ok]').onclick=()=>{
    const name=m.el.querySelector('#pn').value.trim();if(!name){toast('Name required.',{type:'wa'});return}
    const data={name,desc:m.el.querySelector('#pd').value.trim(),color},agent={persona:m.el.querySelector('#pp').value.trim()||SYS_DEFAULT,mode,autonomy:aut};
    if(p){Object.assign(p,data);p.agent={...p.agent,...agent}}
    else{const np={id:uid(),...data,createdAt:Date.now(),agent:{...agent,knowledge:'',off:{tools:[],connectors:[],skills:[]}}};
      S.projects.push(np);S.activeProject=np.id;S.activeChat=''}
    if(aut==='auto')PF.autoApprove=true;savePF();
    saveS();m.close();after&&after();layout();renderChats();renderThread();paintChip();paintHero();renderPanel();paintAgentbar();toast('Project saved.',{type:'ok'});
  };
}

/* ══ PROVIDERS ══ */
let provCat='all',provQ='',provSel='openrouter';
function openProviders(tab='all'){
  provCat=tab;provSel=S.activeProvider;
  const m=modal({title:'Gateways & keys',icon:'key',size:'full',flush:true,tag:'<span class="beta">BYOK beta</span>',
    body:`<div class="split"><div class="split-l" id="cats"></div><div class="split-r" id="pane"></div></div>`,
    foot:`<span>${PROVIDERS.length} providers · keys stay in this browser</span><span class="sp"></span>
      <button class="btn sm" id="wCfg">${I('worker')}Worker proxy</button><button class="btn sm" id="uncBtn">${I('shield')}Uncensored lane</button><button class="btn p sm" id="doneBtn">${I('check')}Done</button>`});
  const cats=m.el.querySelector('#cats'),pane=m.el.querySelector('#pane');
  const counts=c=>c==='all'?PROVIDERS.length:c==='free'?PROVIDERS.filter(p=>p.free).length:c==='uncensored'?PROVIDERS.filter(p=>p.unc).length:
    c==='connected'?PROVIDERS.filter(p=>keyOf(p.id)||S.keys['__cfg_'+p.id]).length:PROVIDERS.filter(p=>p.c===c).length;
  function paintCats(){cats.innerHTML=CATS.map(c=>`<button class="catbtn${provCat===c.id?' on':''}" data-c="${c.id}">${I(c.i)}<span>${esc(c.n)}</span><small>${counts(c.id)}</small></button>`).join('');
    cats.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{provCat=b.dataset.c;paintCats();paintPane()})}
  function paintPane(){
    let l=[...PROVIDERS];
    if(provCat==='free')l=l.filter(p=>p.free);else if(provCat==='uncensored')l=l.filter(p=>p.unc);
    else if(provCat==='connected')l=l.filter(p=>keyOf(p.id)||S.keys['__cfg_'+p.id]);
    else if(provCat!=='all')l=l.filter(p=>p.c===provCat);
    if(provQ){const q=provQ.toLowerCase();l=l.filter(p=>(p.n+p.id+p.note).toLowerCase().includes(q))}
    pane.innerHTML=`<div class="line"><div class="searchbar">${I('search')}<input type="text" id="pvq" value="${esc(provQ)}" placeholder="Search ${PROVIDERS.length} providers"/></div><span class="tag ac">${l.length} shown</span></div>
      <div class="pgrid" id="pvGrid"></div><div id="pvDetail"></div>`;
    pane.querySelector('#pvGrid').innerHTML=l.map(p=>`<button class="pcard${provSel===p.id?' on':''}" data-p="${p.id}">
      <div class="pt">${I(p.c==='local'?'term':p.c==='router'?'branch':p.c==='uncensored'?'shield':'cloud')}<b>${esc(p.n)}</b>${keyOf(p.id)||p.nokey?I('check'):''}</div>
      <small>${esc(p.note)}</small><div class="ptags">${p.free?'<span class="tag ok">free tier</span>':''}${p.unc?'<span class="tag wa">uncensored</span>':''}${S.activeProvider===p.id?'<span class="tag ac">active</span>':''}</div></button>`).join('')||'<p class="help">No provider matches.</p>';
    pane.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{provSel=b.dataset.p;paintPane()});
    const si=pane.querySelector('#pvq');
    si.oninput=deb(e=>{provQ=e.target.value.trim();paintPane();const n=pane.querySelector('#pvq');n.focus();n.setSelectionRange(n.value.length,n.value.length)},150);
    paintDetail();
  }
  function paintDetail(){
    const p=provById(provSel);if(!p)return;const cfg=S.keys['__cfg_'+p.id]||{},box=pane.querySelector('#pvDetail');
    box.innerHTML=`<div class="card" style="background:var(--surface)"><b>${I('key')}${esc(p.n)}</b>
      <p class="help">${esc(p.note)} ${p.d?`<a href="${esc(p.d)}" target="_blank" rel="noopener">Get a key ${I('ext')}</a>`:''}</p>
      <div class="field"><label class="lbl">Base URL</label><input type="text" id="pvBase" value="${esc(cfg.base||p.b)}"/></div>
      ${p.nokey?'<p class="help">Local runtime — no key needed.</p>':`<div class="field"><label class="lbl">API key</label>
        <div class="line" style="flex-wrap:nowrap"><input type="password" id="pvKey" value="${esc(keyOf(p.id))}" placeholder="${esc(p.k)}" autocomplete="off"/><button class="btn ic" id="pvEye">${I('eye')}</button></div></div>
        <label class="chk"><input type="checkbox" id="pvRem" ${S.keys[p.id]?'checked':''}/>Remember on this device</label>`}
      <div class="line"><button class="btn p" id="pvSave">${I('check')}Save &amp; verify</button><button class="btn" id="pvLoad">${I('refresh')}Load models</button>
        <button class="btn" id="pvUse">${I('play')}Use gateway</button>${p.nokey?'':`<button class="btn d sm" id="pvDel">Remove key</button>`}</div>
      <div id="pvNote"></div>
      <div class="field"><label class="lbl">Model</label><div class="line" style="flex-wrap:nowrap"><input type="text" id="pvModel" value="${esc(S.activeProvider===p.id?S.activeModel:(cfg.model||''))}" placeholder="model id"/><button class="btn" id="pvSet">Set</button></div></div>
      ${p.id==='openrouter'?`<label class="chk"><input type="checkbox" id="pvFree" ${S.freeOnly?'checked':''}/>Only free models</label>`:''}
      <div class="scroll-list" id="pvModels" style="max-height:250px;overflow:auto"></div></div>`;
    const note=box.querySelector('#pvNote'),setNote=(cls,t)=>note.innerHTML=`<div class="note ${cls}">${I(cls==='ok'?'check':cls==='er'?'alert':'info')}<span>${t}</span></div>`;
    box.querySelector('#pvEye')&&(box.querySelector('#pvEye').onclick=()=>{const i=box.querySelector('#pvKey');i.type=i.type==='password'?'text':'password'});
    const load=async()=>{const b=box.querySelector('#pvLoad');b.disabled=true;b.innerHTML='<span class="ring"></span>';
      try{delete S.modelsCache[p.id];renderModels(await listModels(p.id));setNote('ok','Models loaded.')}catch(e){setNote('er',esc(e.message))}
      b.disabled=false;b.innerHTML=I('refresh')+'Load models'};
    box.querySelector('#pvFree')&&(box.querySelector('#pvFree').onchange=e=>{S.freeOnly=e.target.checked;saveS();delete S.modelsCache[p.id];load()});
    box.querySelector('#pvSave').onclick=async e=>{
      S.keys['__cfg_'+p.id]={...(S.keys['__cfg_'+p.id]||{}),base:box.querySelector('#pvBase').value.trim()};
      if(!p.nokey)setKey(p.id,box.querySelector('#pvKey').value.trim(),box.querySelector('#pvRem').checked);
      saveS();const b=e.currentTarget;b.disabled=true;b.innerHTML='<span class="ring"></span>Verifying…';

        <button class="btn sm" id="vUndo">${I('undo')}</button><button class="btn sm" id="vRedo">${I('redo')}</button>
        <button class="btn sm" id="vClear">${I('trash')}</button><button class="btn sm" id="vSave">${I('download')}PNG</button>
        <button class="btn p sm" id="vSend">${I('send')}Send to chat</button></div>
        <div class="canvas-wrap"><canvas id="sketch" width="1200" height="700"></canvas></div>`;
      const pal=['#1F5E52','#3A4E6B','#8A5A3B','#2E6B4F','#8A6320','#A3392F','#2C5A8A','#1A1A18','#FFFFFF'];
      box.querySelector('#vSw').innerHTML=pal.map(c=>`<button class="swatch${c===color?' on':''}" data-c="${c}" style="background:${c}" aria-label="${c}"></button>`).join('');
      box.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;box.querySelector('#vColor').value=color;box.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b))});
      box.querySelector('#vColor').oninput=e=>color=e.target.value;
      box.querySelector('#vSize').oninput=e=>size=+e.target.value;
      box.querySelector('#vAlpha').oninput=e=>alpha=+e.target.value/100;
      box.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tool=b.dataset.t;box.querySelectorAll('[data-t]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
      canvas=box.querySelector('#sketch');ctx=canvas.getContext('2d');
      ctx.fillStyle=getComputedStyle(root).getPropertyValue('--surface').trim()||'#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
      const saved=S.sketches.find(x=>x.projectId===S.activeProject);
      if(saved){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0);im.src=saved.data}
      const pos=e=>{const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*(canvas.width/r.width),y:(e.clientY-r.top)*(canvas.height/r.height)}};
      const push=()=>{undo.push(canvas.toDataURL());if(undo.length>25)undo.shift();redo=[]};
      canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);push();drawing=true;start=pos(e);snap=ctx.getImageData(0,0,canvas.width,canvas.height);
        if(tool==='pen'||tool==='eraser'){ctx.beginPath();ctx.moveTo(start.x,start.y)}};
      canvas.onpointermove=e=>{if(!drawing)return;const p=pos(e);
        ctx.globalAlpha=alpha;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=size;
        if(tool==='pen'||tool==='eraser'){ctx.strokeStyle=tool==='pen'?color:(getComputedStyle(root).getPropertyValue('--surface').trim()||'#fff');ctx.lineTo(p.x,p.y);ctx.stroke()}
        else{ctx.putImageData(snap,0,0);ctx.strokeStyle=color;ctx.beginPath();
          if(tool==='line'){ctx.moveTo(start.x,start.y);ctx.lineTo(p.x,p.y)}
          else if(tool==='square')ctx.rect(start.x,start.y,p.x-start.x,p.y-start.y);
          else ctx.ellipse((start.x+p.x)/2,(start.y+p.y)/2,Math.abs(p.x-start.x)/2,Math.abs(p.y-start.y)/2,0,0,Math.PI*2);
          ctx.stroke()}
        ctx.globalAlpha=1};
      const end=()=>{if(!drawing)return;drawing=false;const data=canvas.toDataURL();
        const ex=S.sketches.find(x=>x.projectId===S.activeProject);
        if(ex)ex.data=data;else S.sketches.push({id:uid(),projectId:S.activeProject,data,updatedAt:Date.now()});saveS()};
      canvas.onpointerup=end;canvas.onpointercancel=end;
      box.querySelector('#vUndo').onclick=()=>{if(!undo.length)return;redo.push(canvas.toDataURL());const d=undo.pop();const im=new Image();im.onload=()=>ctx.drawImage(im,0,0);im.src=d};
      box.querySelector('#vRedo').onclick=()=>{if(!redo.length)return;undo.push(canvas.toDataURL());const d=redo.pop();const im=new Image();im.onload=()=>ctx.drawImage(im,0,0);im.src=d};
      box.querySelector('#vClear').onclick=()=>{push();ctx.fillStyle=getComputedStyle(root).getPropertyValue('--surface').trim()||'#fff';ctx.fillRect(0,0,canvas.width,canvas.height)};
      box.querySelector('#vSave').onclick=()=>canvas.toBlob(b=>{const u=URL.createObjectURL(b);const a=Object.assign(document.createElement('a'),{href:u,download:'forge-sketch.png'});a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)});
      box.querySelector('#vSend').onclick=()=>{attachments.push({kind:'image',name:'sketch.png',data:canvas.toDataURL('image/png'),size:0});paintAtts();m.close();toast('Sketch attached.',{type:'ok'})};
    }else if(tab==='board'){
      let board=S.boards.find(b=>b.projectId===S.activeProject);
      if(!board){board={id:uid(),projectId:S.activeProject,items:[]};S.boards.push(board);saveS()}
      box.innerHTML=`<div class="line"><button class="btn sm" id="bImg">${I('image')}Image</button><button class="btn sm" id="bNote">${I('type')}Note</button>
        <button class="btn sm" id="bColor">${I('palette')}Colour</button><button class="btn sm" id="bTidy">${I('grid')}Tidy</button><span style="flex:1"></span>
        <button class="btn sm" id="bExp">${I('download')}JSON</button><button class="btn p sm" id="bSend">${I('send')}Send board</button></div><div class="board" id="board"></div>`;
      const bd=box.querySelector('#board');
      const render=()=>{
        bd.innerHTML=board.items.map(it=>`<div class="bitem" data-b="${it.id}" style="left:${it.x}px;top:${it.y}px;width:${it.w}px;height:${it.h}px">
          ${it.kind==='image'?`<img src="${esc(it.data)}" alt=""/>`:it.kind==='note'?`<div class="note-t">${esc(it.text)}</div>`:`<div class="sw-fill" style="background:${esc(it.color)}"></div>`}
          <button class="bx" data-bx="${it.id}">${I('x')}</button><span class="rz" data-rz="${it.id}"></span></div>`).join('')
          ||`<div style="position:absolute;inset:0;display:grid;place-items:center;color:var(--tx3);font-size:.8125rem;text-align:center;padding:20px">Empty board. Add images, notes and colours, then drag to arrange.</div>`;
        bd.querySelectorAll('[data-bx]').forEach(b=>b.onclick=e=>{e.stopPropagation();board.items=board.items.filter(x=>x.id!==b.dataset.bx);saveS();render()});
        bd.querySelectorAll('[data-b]').forEach(el=>{el.onpointerdown=e=>{
          if(e.target.closest('[data-bx]'))return;
          const it=board.items.find(x=>x.id===el.dataset.b),rz=e.target.closest('[data-rz]');
          el.setPointerCapture(e.pointerId);el.classList.add('drag');
          const sx=e.clientX,sy=e.clientY,ox=it.x,oy=it.y,ow=it.w,oh=it.h,bw=bd.clientWidth,bh=bd.clientHeight;
          const mv=ev=>{if(rz){it.w=clamp(ow+ev.clientX-sx,60,Math.max(60,bw-it.x));it.h=clamp(oh+ev.clientY-sy,44,Math.max(44,bh-it.y))}
            else{it.x=clamp(ox+ev.clientX-sx,0,Math.max(0,bw-it.w));it.y=clamp(oy+ev.clientY-sy,0,Math.max(0,bh-it.h))}
            el.style.left=it.x+'px';el.style.top=it.y+'px';el.style.width=it.w+'px';el.style.height=it.h+'px'};
          const up=()=>{el.classList.remove('drag');el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);saveS()};
          el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up)}});
      };
      render();
      box.querySelector('#bImg').onclick=()=>{const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.multiple=true;
        inp.onchange=async()=>{for(const f of [...inp.files])board.items.push({id:uid(),kind:'image',data:await readDataURL(f),x:20+board.items.length*16,y:20+board.items.length*12,w:200,h:150});saveS();render()};inp.click()};
      box.querySelector('#bNote').onclick=async()=>{const t=await promptModal({title:'Board note',label:'Text',multiline:true});
        if(t){board.items.push({id:uid(),kind:'note',text:t,x:30,y:30,w:200,h:120});saveS();render()}};
      box.querySelector('#bColor').onclick=()=>{board.items.push({id:uid(),kind:'color',color:'#1F5E52',x:40,y:40,w:110,h:80});saveS();render()};
      box.querySelector('#bTidy').onclick=()=>{const cols=Math.max(1,Math.floor((bd.clientWidth-16)/216));
        board.items.forEach((it,i)=>{it.x=16+(i%cols)*216;it.y=16+Math.floor(i/cols)*170;it.w=200;it.h=150});saveS();render()};
      box.querySelector('#bExp').onclick=()=>dl('forge-moodboard.json',JSON.stringify(board,null,2),'application/json');
      box.querySelector('#bSend').onclick=async()=>{
        const cv=document.createElement('canvas');cv.width=1200;cv.height=800;const c2=cv.getContext('2d');
        c2.fillStyle=getComputedStyle(root).getPropertyValue('--surface2').trim()||'#fafaf8';c2.fillRect(0,0,1200,800);
        for(const it of board.items){
          if(it.kind==='image')await new Promise(r=>{const im=new Image();im.onload=()=>{c2.drawImage(im,it.x,it.y,it.w,it.h);r()};im.onerror=r;im.src=it.data});
          else if(it.kind==='color'){c2.fillStyle=it.color;c2.fillRect(it.x,it.y,it.w,it.h)}
          else{c2.fillStyle='#fff';c2.fillRect(it.x,it.y,it.w,it.h);c2.fillStyle='#1A1A18';c2.font='14px sans-serif';
            it.text.split('\n').forEach((l,i)=>c2.fillText(l.slice(0,32),it.x+10,it.y+22+i*18))}}
        attachments.push({kind:'image',name:'moodboard.png',data:cv.toDataURL('image/png'),size:0});paintAtts();m.close();toast('Moodboard attached.',{type:'ok'})};
    }else{
      box.innerHTML=`<div class="card"><b>${I('palette')}Extract a palette</b><div class="line"><button class="btn p sm" id="plUp">${I('upload')}Choose image</button><span class="help">Sampled locally.</span></div><div class="swatches" id="plOut" style="margin-top:8px"></div></div>
        <div class="card"><b>${I('layers')}Workspace palette</b><div class="swatches" id="plBase"></div><p class="help">Click to copy the hex.</p></div>`;
      const put=(host,arr)=>{host.innerHTML=arr.map(c=>`<button class="swatch" style="background:${c};width:44px;height:44px" data-hex="${c}" title="${c}"></button>`).join('');
        host.querySelectorAll('[data-hex]').forEach(b=>b.onclick=async()=>{if(await clip(b.dataset.hex))toast(b.dataset.hex+' copied.',{type:'ok',timeout:1500})})};
      put(box.querySelector('#plBase'),['#1F5E52','#3A4E6B','#8A5A3B','#2E6B4F','#8A6320','#A3392F','#2C5A8A','#F5F5F3','#1A1A18']);
      box.querySelector('#plUp').onclick=()=>{const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
        inp.onchange=async()=>{const f=inp.files[0];if(!f)return;const d=await readDataURL(f);const im=new Image();
          im.onload=()=>{const cv=document.createElement('canvas');cv.width=80;cv.height=80;const c2=cv.getContext('2d');c2.drawImage(im,0,0,80,80);
            const px=c2.getImageData(0,0,80,80).data,map={};
            for(let i=0;i<px.length;i+=4){const k=`${px[i]>>5<<5},${px[i+1]>>5<<5},${px[i+2]>>5<<5}`;map[k]=(map[k]||0)+1}
            put(box.querySelector('#plOut'),Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k])=>'#'+k.split(',').map(v=>(+v).toString(16).padStart(2,'0')).join('')))};
          im.src=d};inp.click()};
    }
  }
  paint();
}

function openWorker(){

    if(tab==='cfg'){

      box.querySelector('#wTest').onclick=async()=>{const u=box.querySelector('#wUrl').value.trim().replace(/\/+$/,'');
        if(!u){toast('Enter the Worker URL.',{type:'wa'});return}
        try{const r=await fetch(u+'/',{headers:{'x-forge-token':box.querySelector('#wTok').value.trim()},signal:AbortSignal.timeout(10000)});
          box.querySelector('#wNote').innerHTML=`<div class="note ok">${I('check')}<span>${esc(JSON.stringify(await r.json()))}</span></div>`}
        catch(e){box.querySelector('#wNote').innerHTML=`<div class="note er">${I('alert')}<span>${esc(e.message)}</span></div>`}};
      box.querySelector('#wOff').onclick=()=>{PF.workerUrl='';PF.workerToken='';savePF();box.querySelector('#wUrl').value='';box.querySelector('#wTok').value='';paintState();toast('Direct mode restored.',{type:'ok'})};

      box.querySelector('#tDl').onclick=()=>dl('wrangler.toml',WRANGLER);

    if(tab==='look'){
      box.innerHTML=`<div class="field"><label class="lbl">Theme</label><div class="seg">
        <button data-th="light" aria-pressed="${PF.theme==='light'}">${I('sun')}<span>Light</span></button>
        <button data-th="dark" aria-pressed="${PF.theme==='dark'}">${I('moon')}<span>Dark</span></button></div></div>
        <div class="field"><label class="lbl">Accent</label><div class="swatches">${[['pine','#1F5E52'],['slate','#3A4E6B'],['clay','#8A5A3B']].map(([v,c])=>`<button class="swatch${PF.accent===v?' on':''}" data-ac="${v}" style="background:${c};width:38px;height:38px" aria-label="${v}"></button>`).join('')}</div></div>
        <div class="field"><label class="lbl">Density</label><div class="seg"><button data-dn="cozy" aria-pressed="${PF.density==='cozy'}">Cozy</button><button data-dn="compact" aria-pressed="${PF.density==='compact'}">Compact</button></div></div>
        <div class="swrow"><span>Focus mode</span><div class="sw" role="switch" aria-checked="${PF.focus}" id="stFocus" tabindex="0"></div></div>`;
      box.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{PF.theme=b.dataset.th;savePF();paintTheme();paint()});
      box.querySelectorAll('[data-ac]').forEach(b=>b.onclick=()=>{PF.accent=b.dataset.ac;savePF();paintTheme();paint()});
      box.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{PF.density=b.dataset.dn;savePF();paintTheme();paint()});
      box.querySelector('#stFocus').onclick=()=>{PF.focus=!PF.focus;root.dataset.focus=PF.focus?'on':'off';savePF();paint();syncScrim()};
    }else if(tab==='gen'){
      box.innerHTML=`<div class="swrow"><span>Auto-approve tool calls</span><div class="sw" role="switch" aria-checked="${PF.autoApprove}" id="gApp" tabindex="0"></div></div>
        <div class="grid g2"><div class="field"><label class="lbl">Output limit</label><div id="gMax"></div></div>
        <div class="field"><label class="lbl">History</label><div id="gHist"></div></div>
        <div class="field"><label class="lbl">Max tool loops</label><div id="gLoop"></div></div>
        <div class="field"><label class="lbl">Temperature — <span id="gTempV">${PF.temp.toFixed(1)}</span></label><input type="range" id="gTemp" min="0" max="2" step="0.1" value="${PF.temp}"/></div></div>
        <div class="swrow"><span>Stream responses</span><div class="sw" role="switch" aria-checked="${PF.stream}" id="gStream" tabindex="0"></div></div>
        <div class="note">${I('info')}<span>Auto output limit sends no cap, so replies are never cut short.</span></div>`;
      box.querySelector('#gApp').onclick=()=>{PF.autoApprove=!PF.autoApprove;savePF();paintAgentbar();paint()};
      mountSelect(box.querySelector('#gMax'),{value:String(PF.maxTok),options:[{v:'0',n:'Auto — no cap'},{v:'2048',n:'2048'},{v:'4096',n:'4096'},{v:'8192',n:'8192'},{v:'16384',n:'16384'}],onChange:v=>{PF.maxTok=+v;savePF()}});
      mountSelect(box.querySelector('#gHist'),{value:String(PF.hist),options:[12,24,30,50,80].map(n=>({v:String(n),n:n+' messages'})),onChange:v=>{PF.hist=+v;savePF()}});
      mountSelect(box.querySelector('#gLoop'),{value:String(PF.toolLoops),options:[2,4,6,8,12,16].map(n=>({v:String(n),n:n+' loops'})),onChange:v=>{PF.toolLoops=+v;savePF()}});
      box.querySelector('#gTemp').oninput=e=>{PF.temp=+e.target.value;box.querySelector('#gTempV').textContent=PF.temp.toFixed(1);savePF()};
      box.querySelector('#gStream').onclick=()=>{PF.stream=!PF.stream;savePF();paint()};
    }else if(tab==='voice'){
      box.innerHTML=`<div class="field"><label class="lbl">Speech voice</label><div id="vSel"></div></div>
        <div class="grid g2"><div class="field"><label class="lbl">Rate — <span id="vRateV">${PF.rate.toFixed(1)}</span></label><input type="range" id="vRate" min="0.5" max="2" step="0.1" value="${PF.rate}"/></div>
        <div class="field"><label class="lbl">Pitch — <span id="vPitchV">${PF.pitch.toFixed(1)}</span></label><input type="range" id="vPitch" min="0" max="2" step="0.1" value="${PF.pitch}"/></div></div>
        <div class="swrow"><span>Auto-speak replies</span><div class="sw" role="switch" aria-checked="${PF.autoSpeak}" id="vAuto" tabindex="0"></div></div>
        <div class="line"><button class="btn" id="vTest">${I('vol')}Test</button><button class="btn" id="vStop">${I('mute')}Stop</button></div>`;
      mountSelect(box.querySelector('#vSel'),{value:PF.voice,options:[{v:'',n:'System default'},...voices.map(v=>({v:v.voiceURI,n:`${v.name} (${v.lang})`}))],search:true,width:300,onChange:v=>{PF.voice=v;savePF()}});
      box.querySelector('#vRate').oninput=e=>{PF.rate=+e.target.value;box.querySelector('#vRateV').textContent=PF.rate.toFixed(1);savePF()};
      box.querySelector('#vPitch').oninput=e=>{PF.pitch=+e.target.value;box.querySelector('#vPitchV').textContent=PF.pitch.toFixed(1);savePF()};
      box.querySelector('#vAuto').onclick=()=>{PF.autoSpeak=!PF.autoSpeak;savePF();paint()};
      box.querySelector('#vTest').onclick=()=>speak('Forge Studio ready. Tools armed and auto-approved.');
      box.querySelector('#vStop').onclick=()=>speechSynthesis.cancel();
    }else{
      let kb=0;try{kb=Math.round(new Blob([JSON.stringify(S)]).size/1024)}catch{}
      box.innerHTML=`<div class="stats"><div class="stat"><b>${S.projects.length}</b><span>projects</span></div><div class="stat"><b>${S.chats.length}</b><span>chats</span></div>
        <div class="stat"><b>${S.connectors.length}</b><span>connectors</span></div><div class="stat"><b>${kb} KB</b><span>stored</span></div></div>
        <div class="line"><button class="btn" id="dExp">${I('download')}Export</button><button class="btn" id="dImp">${I('upload')}Import</button>
        <button class="btn" id="dChat">${I('file')}Chat .md</button><button class="btn d" id="dWipe">${I('trash')}Reset all</button></div>
        <div class="card"><b>${I('lock')}Key storage</b><p class="help">Session storage by default; Remember persists to this device only.</p>
        <button class="btn d sm" id="dKeys">Clear stored keys</button></div>`;
      box.querySelector('#dExp').onclick=exportWorkspace;
      box.querySelector('#dImp').onclick=()=>{$('#importPick').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
        try{const j=JSON.parse(await readText(f));if(!j.projects)throw new Error('Not a Forge workspace');S=j;saveS();toast('Imported. Reloading…',{type:'ok'});setTimeout(()=>location.reload(),700)}
        catch(err){toast('Import failed: '+err.message,{type:'er'})}};$('#importPick').click()};
      box.querySelector('#dChat').onclick=exportChat;
      box.querySelector('#dWipe').onclick=async()=>{if(!await confirmModal({title:'Reset everything?',body:'All projects, chats, connectors, skills and keys.'}))return;
        Object.keys(S.keys||{}).forEach(k=>{try{sessionStorage.removeItem('fs.k.'+k)}catch{}});
        localStorage.removeItem(LS.s);S=DEF_STATE();S.activeProject=S.projects[0].id;saveS();m.close();location.reload()};
      box.querySelector('#dKeys').onclick=()=>{Object.keys(S.keys).forEach(k=>{if(!k.startsWith('__')){delete S.keys[k];try{sessionStorage.removeItem('fs.k.'+k)}catch{}}});
        saveS();paintFoot();paintState();toast('Keys cleared.',{type:'ok'})};
    }
  };
  m.onTab=t=>{tab=t;paint()};paint();
}
function exportWorkspace(){dl('forge-workspace-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(S,null,2),'application/json');toast('Workspace exported.',{type:'ok'})}
function exportChat(){
  const c=chat();if(!c){toast('Open a chat first.',{type:'wa'});return}
  const out=['# '+c.title,'','_Forge Studio · '+new Date().toLocaleString()+' · '+proj().name+'_',''];
  c.messages.forEach(m=>{out.push('## '+(m.role==='user'?'You':'Forge')+(m.model?' · '+m.model:''),'');
    if(m.role==='user')out.push(m.content,'');
    else (m.segments||[]).forEach(s=>{if(s.type==='text')out.push(s.text,'');
      if(s.type==='tool')out.push('```tool '+s.name+'\n'+s.args+'\n---\n'+String(s.result||'').slice(0,2000)+'\n```','')})});
  dl(c.title.replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-').slice(0,50)+'.md',out.join('\n'),'text/markdown');toast('Chat exported.',{type:'ok'});
}
const COMMANDS=[
 {n:'New chat',i:'plus',k:'Ctrl+N',f:()=>$('#btnNew').click()},
 {n:'Tools menu',i:'plus',f:()=>openPlus($('#btnPlus'))},
 {n:'Agent console',i:'term',k:'Ctrl+`',f:()=>toggleConsole()},
 {n:'Connectors — add by URL',i:'plug',f:()=>openConnectors('all')},
 {n:'Connected endpoints',i:'check',f:()=>openConnectors('connected')},
 {n:'Model & gateway',i:'cpu',k:'Ctrl+M',f:openModelPicker},
 {n:'Gateways & keys',i:'key',f:()=>openProviders()},
 {n:'Uncensored lane',i:'shield',f:openUncensored},
 {n:'Projects',i:'folder',f:openProjects},
 {n:'Agent configuration',i:'agent',f:openAgents},
 {n:'Skills',i:'skill',f:openSkills},
 {n:'Visual studio',i:'palette',f:openVisuals},
 {n:'Cloudflare Worker',i:'worker',f:openWorker},
 {n:'Settings',i:'gear',k:'Ctrl+,',f:openSettings},
 {n:'Toggle auto-approve',i:'shield',f:()=>$('#abShield').click()},
 {n:'Toggle theme',i:'moon',f:()=>$('#btnTheme').click()},
 {n:'Toggle work panel',i:'panel',f:()=>$('#btnPanel').click()},
 {n:'Focus mode',i:'max',f:()=>{PF.focus=!PF.focus;root.dataset.focus=PF.focus?'on':'off';savePF();syncScrim()}},
 {n:'Export workspace',i:'download',f:exportWorkspace},
 {n:'Export chat .md',i:'file',f:exportChat},
 {n:'Mode: Fast',i:'zap',f:()=>setMode('fast')},
 {n:'Mode: Auto',i:'auto',f:()=>setMode('auto')},
 {n:'Mode: Thinking',i:'brain',f:()=>setMode('think')},
 {n:'Attach image or file',i:'clip',f:()=>$('#filePick').click()},
 {n:'Voice input',i:'mic',f:()=>$('#btnMic').click()},
 {n:'Speak last reply',i:'vol',f:()=>{const m=chat()?.messages.filter(x=>x.role==='assistant').at(-1);if(m)speak((m.segments||[]).filter(s=>s.type==='text').map(s=>s.text).join('\n'))}},
 {n:'Keyboard shortcuts',i:'cmd',f:showShortcuts},
 {n:'Search all projects',i:'search',f:()=>{PF.allProjects=true;savePF();renderChats();openSidebar();$('#qChat').focus()}}
];
let palEl=null;
function openPalette(){
  if(palEl){palEl.remove();palEl=null;return}
  palEl=document.createElement('div');palEl.className='palette';
  palEl.innerHTML=`<div class="mscrim"></div><div class="pal-card"><div class="pal-in">${I('search','i l')}<input type="text" id="palQ" placeholder="Type a command…" aria-label="Command"/></div><div class="pal-list" id="palL"></div></div>`;
  document.body.appendChild(palEl);
  const q=palEl.querySelector('#palQ'),L=palEl.querySelector('#palL');let hi=0,cur=COMMANDS;
  const close=()=>{palEl?.remove();palEl=null};
  const paint=()=>{L.innerHTML=cur.map((c,i)=>`<div class="pal-item${i===hi?' hi':''}" data-i="${i}">${I(c.i)}<span>${esc(c.n)}</span>${c.k?`<small>${esc(c.k)}</small>`:''}</div>`).join('')||'<div class="pal-item">No match.</div>';
    L.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const c=cur[+b.dataset.i];close();c.f()})};
  q.oninput=()=>{const v=q.value.toLowerCase();cur=COMMANDS.filter(c=>c.n.toLowerCase().includes(v));hi=0;paint()};
  q.onkeydown=e=>{
    if(e.key==='ArrowDown'){e.preventDefault();hi=Math.min(cur.length-1,hi+1);paint();L.children[hi]?.scrollIntoView({block:'nearest'})}
    if(e.key==='ArrowUp'){e.preventDefault();hi=Math.max(0,hi-1);paint();L.children[hi]?.scrollIntoView({block:'nearest'})}
    if(e.key==='Enter'){e.preventDefault();const c=cur[hi];close();c&&c.f()}
    if(e.key==='Escape')close()};
  palEl.querySelector('.mscrim').onclick=close;paint();setTimeout(()=>q.focus(),30);
}
function showShortcuts(){
  const rows=[['Ctrl/⌘ + K','Command palette'],['Ctrl/⌘ + M','Model picker'],['Ctrl/⌘ + N','New chat'],['Ctrl/⌘ + ,','Settings'],
   ['Ctrl/⌘ + B','Work panel'],['Ctrl + `','Agent console'],['Enter','Send'],['Shift + Enter','New line'],['Esc','Stop / close'],
   ['↑ ↓ in terminal','History'],['Tab in terminal','Autocomplete'],['Ctrl + L','Clear terminal']];
  modal({title:'Keyboard shortcuts',icon:'cmd',size:'md',body:`<div class="scroll-list">${rows.map(([k,v])=>`<div class="kv"><dt>${esc(v)}</dt><dd><span class="kbd">${esc(k)}</span></dd></div>`).join('')}</div>`});
}
function setMode(m){proj().agent.mode=m;PF.mode=m;saveS();savePF();
  $$('#modeSeg [data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===m)));toast('Mode: '+m,{type:'in',timeout:1500})}
$('#modeSeg').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(b)setMode(b.dataset.mode)});
function navTo(v){
  $$('.rbtn').forEach(b=>b.classList.toggle('on',b.dataset.nav===v));
  if(v==='chats'){openSidebar();return}
  if(v==='console'){toggleConsole();return}
  ({projects:openProjects,agents:openAgents,skills:openSkills,connectors:()=>openConnectors('all'),
    providers:openProviders,visuals:openVisuals,worker:openWorker,settings:openSettings,palette:openPalette})[v]?.();
}
$$('.rbtn').forEach(b=>b.onclick=()=>navTo(b.dataset.nav));
document.addEventListener('keydown',e=>{
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()}
  else if(mod&&e.key.toLowerCase()==='m'){e.preventDefault();openModelPicker()}
  else if(mod&&e.key.toLowerCase()==='n'){e.preventDefault();$('#btnNew').click()}
  else if(mod&&e.key===','){e.preventDefault();openSettings()}
  else if(mod&&e.key.toLowerCase()==='b'){e.preventDefault();$('#btnPanel').click()}
  else if(mod&&e.key==='`'){e.preventDefault();toggleConsole()}
  else if(e.key==='Escape'){
    if(palEl){palEl.remove();palEl=null;return}
    if(pmEl){closePlus();return}
    if(openSel){openSel.remove();openSel=null;return}
    if(modalStack.length)return;
    if($('#sidebar').classList.contains('on')){closeSidebar();return}
    if(mqTablet.matches&&root.dataset.panel==='open'){closePanel();return}
    if(live){live.stopped=true;try{live.ac.abort()}catch{}}
  }
});
function paintTheme(){root.dataset.theme=PF.theme;root.dataset.accent=PF.accent;root.dataset.density=PF.density;root.dataset.focus=PF.focus?'on':'off';
  $('#themeIc').setAttribute('href',PF.theme==='light'?'#i-moon':'#i-sun');
  if(hlL){hlL.disabled=PF.theme!=='light';hlD.disabled=PF.theme==='light'}}
$('#btnTheme').onclick=()=>{PF.theme=PF.theme==='light'?'dark':'light';savePF();paintTheme()};
window.addEventListener('online',()=>{paintState();toast('Back online.',{type:'ok',timeout:1800})});
window.addEventListener('offline',paintState);
window.addEventListener('pagehide',()=>{if(live){live.stopped=true;try{live.ac.abort()}catch{}}stopMic();speechSynthesis.cancel?.()});
let errAt=0;
window.addEventListener('error',e=>{console.error('[forge]',e.error||e.message);
  if(Date.now()-errAt>5000){errAt=Date.now();toast('Unexpected error — console has details. Data is safe.',{type:'er'})}});
window.addEventListener('unhandledrejection',e=>{if(e.reason?.name!=='AbortError')console.error('[forge] async',e.reason)});

/* ══ BOOT ══ */
root.dataset.panel=PF.panel==='open'?'open':'closed';
paintTheme();paintChip();paintState();paintFoot();layout();renderChats();renderThread();renderPanel();paintSend();grow();applyViewport();
$('#console').hidden=!PF.consoleOpen;paintAgentbar();renderConsole();
$$('#modeSeg [data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===(proj().agent.mode||PF.mode))));
$('#cSortL').textContent=SORTS.find(s=>s.v===PF.sort)?.n||'Recent';
$('#cStar').setAttribute('aria-pressed',String(PF.starOnly));
$('#cAll').setAttribute('aria-pressed',String(PF.allProjects));
if(S.activeChat){const c=chat();if(c){input.value=c.draft||'';grow();paintSend()}}
setStep('Idle · '+toolSpecs().length+' tools armed');
listModels(S.activeProvider).then(l=>{if(!S.activeModel&&l.length){S.activeModel=l[0].id;saveS();paintChip();paintState();paintFoot();paintHero()}}).catch(()=>{});
S.connectors.filter(c=>c.status==='online').forEach(c=>connectURL(c,{silent:true}));
if(!Object.keys(S.keys).some(k=>!k.startsWith('__'))&&!provById(S.activeProvider)?.nokey)
  setTimeout(()=>toast('Add a gateway key to start writing. Connectors need only a URL.',{type:'in',timeout:7500,action:{label:'Open gateways',fn:()=>openProviders()}}),700);
</script>
