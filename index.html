<style>
:root{
  --ui:'Instrument Sans',system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  --r1:8px;--r2:12px;--r3:18px;--r4:22px;--t:130ms;--ease:cubic-bezier(.2,.7,.3,1);
  --rail:56px;--sb:258px;--wp:380px;--bar:52px;--col:800px;--mobnav:0px;
}
html[data-theme=light]{
  --bg:#F5F5F3;--surface:#FFFFFF;--surface2:#FAFAF8;--surface3:#F0EFEC;--surface4:#E7E6E1;
  --line:#E5E4E0;--line2:#D4D3CE;--tx:#1A1A18;--tx2:#5B5B56;--tx3:#76766E;
  --ok:#2E6B4F;--ok-bg:#E9F1EC;--warn:#8A6320;--warn-bg:#F6EFE2;--danger:#A3392F;--danger-bg:#F8E9E7;--info:#2C5A8A;--info-bg:#E9EFF6;
  --sh1:0 1px 2px rgba(26,26,24,.05);--sh2:0 2px 8px rgba(26,26,24,.06),0 12px 32px rgba(26,26,24,.06);
  --sh3:0 24px 70px rgba(26,26,24,.18);--scrim:rgba(26,26,24,.42);--code:#FBFAF8;--term:#1A1C1B;--term-tx:#DDE3DF;
}
html[data-theme=dark]{
  --bg:#111214;--surface:#17181B;--surface2:#1D1F23;--surface3:#25272C;--surface4:#2F3238;
  --line:#2A2C31;--line2:#3B3E45;--tx:#EDEDEB;--tx2:#A9A9A4;--tx3:#8A8A85;
  --ok:#74BE97;--ok-bg:#17281F;--warn:#D3A85F;--warn-bg:#2A2317;--danger:#E08A80;--danger-bg:#2C1B19;--info:#8FB2D8;--info-bg:#18222C;
  --sh1:0 1px 2px rgba(0,0,0,.3);--sh2:0 2px 10px rgba(0,0,0,.35),0 16px 40px rgba(0,0,0,.3);
  --sh3:0 28px 80px rgba(0,0,0,.62);--scrim:rgba(6,7,8,.68);--code:#131417;--term:#0D0F10;--term-tx:#DDE3DF;
}
html[data-theme=light][data-accent=pine]{--ac:#1F5E52;--ac-ink:#FFF;--ac-bg:#E8F0EE;--ac-line:#B8CFC9;--ac-hi:#184C42;}
html[data-theme=light][data-accent=slate]{--ac:#3A4E6B;--ac-ink:#FFF;--ac-bg:#EAEEF4;--ac-line:#BFC9D8;--ac-hi:#2E3F58;}
html[data-theme=light][data-accent=clay]{--ac:#8A5A3B;--ac-ink:#FFF;--ac-bg:#F3ECE5;--ac-line:#DCC6B2;--ac-hi:#71482E;}
html[data-theme=dark][data-accent=pine]{--ac:#79B8A9;--ac-ink:#0B1614;--ac-bg:#182523;--ac-line:#2E4441;--ac-hi:#8FCBBC;}
html[data-theme=dark][data-accent=slate]{--ac:#93A9C9;--ac-ink:#0C121C;--ac-bg:#1A2130;--ac-line:#313D52;--ac-hi:#A6BBD8;}
html[data-theme=dark][data-accent=clay]{--ac:#C79A76;--ac-ink:#1A1209;--ac-bg:#271E16;--ac-line:#463628;--ac-hi:#D6AC8A;}
html[data-density=compact]{--bar:46px;--col:860px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:var(--ui);background:var(--bg);color:var(--tx);line-height:1.6;height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--ac);text-underline-offset:3px}
::selection{background:var(--ac-bg);color:var(--tx)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:5px}
[hidden]{display:none!important}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:3px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:var(--ac);background-clip:padding-box}
*::-webkit-scrollbar-corner{background:transparent}
.i{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.i.s{width:14px;height:14px}.i.l{width:20px;height:20px}
.mono{font-family:var(--mono)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:34px;padding:6px 13px;border:1px solid var(--line2);
  border-radius:var(--r1);background:var(--surface);color:var(--tx);font-size:.8125rem;font-weight:500;cursor:pointer;
  transition:background var(--t),border-color var(--t),color var(--t);white-space:nowrap}
.btn:hover:not(:disabled){background:var(--surface3);border-color:var(--tx3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.p{background:var(--ac);border-color:var(--ac);color:var(--ac-ink);font-weight:600}
.btn.p:hover:not(:disabled){background:var(--ac-hi);border-color:var(--ac-hi)}
.btn.q{background:transparent;border-color:transparent;color:var(--tx2)}
.btn.q:hover:not(:disabled){background:var(--surface3);color:var(--tx)}
.btn.d{background:var(--danger-bg);border-color:color-mix(in srgb,var(--danger) 32%,transparent);color:var(--danger)}
.btn.ic{width:34px;height:34px;padding:0}
.btn.sm{min-height:28px;padding:3px 9px;font-size:.75rem}
.btn.full{width:100%}
.btn.on{background:var(--ac-bg);border-color:var(--ac-line);color:var(--ac)}
.ring{width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
input[type=text],input[type=password],input[type=url],input[type=number],textarea{
  background:var(--surface);border:1px solid var(--line2);border-radius:var(--r1);padding:8px 11px;font-size:.8125rem;width:100%;min-width:0;
  transition:border-color var(--t),box-shadow var(--t)}
input:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-bg)}
input::placeholder,textarea::placeholder{color:var(--tx3)}
textarea{resize:vertical;line-height:1.6}
input[type=range]{accent-color:var(--ac);cursor:pointer;height:20px;width:100%}
input[type=checkbox]{accent-color:var(--ac);width:15px;height:15px;cursor:pointer;flex:none}
input[type=color]{width:34px;height:30px;padding:2px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);cursor:pointer;flex:none}
.lbl{display:block;font-size:.6875rem;font-weight:600;color:var(--tx3);margin-bottom:5px}
.field{min-width:0}
.help{font-size:.75rem;color:var(--tx3);line-height:1.7;overflow-wrap:anywhere}
.help code{font-family:var(--mono);background:var(--surface3);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:.9em;color:var(--tx2)}
.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.grid{display:grid;gap:11px;min-width:0}
.g2{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.chk{display:flex;align-items:center;gap:8px;font-size:.8125rem;color:var(--tx2);cursor:pointer;min-width:0}
.tag{font-family:var(--mono);font-size:.625rem;color:var(--tx2);background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;white-space:nowrap}
.tag.ac{color:var(--ac);background:var(--ac-bg);border-color:var(--ac-line)}
.tag.ok{color:var(--ok);background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 28%,transparent)}
.tag.wa{color:var(--warn);background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 28%,transparent)}
.tag.er{color:var(--danger);background:var(--danger-bg);border-color:color-mix(in srgb,var(--danger) 28%,transparent)}
.tag.in{color:var(--info);background:var(--info-bg);border-color:color-mix(in srgb,var(--info) 28%,transparent)}
.note{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r1);padding:10px 12px;font-size:.75rem;line-height:1.65;background:var(--surface);color:var(--tx2);overflow-wrap:anywhere}
.note .i{margin-top:2px;color:var(--tx3)}
.note.ok{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 28%,transparent);color:var(--ok)}.note.ok .i{color:var(--ok)}
.note.er{background:var(--danger-bg);border-color:color-mix(in srgb,var(--danger) 28%,transparent);color:var(--danger)}.note.er .i{color:var(--danger)}
.note.wa{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 28%,transparent);color:var(--warn)}.note.wa .i{color:var(--warn)}
.note.in{background:var(--info-bg);border-color:color-mix(in srgb,var(--info) 28%,transparent);color:var(--info)}.note.in .i{color:var(--info)}
.seg{display:inline-flex;gap:2px;padding:2px;background:var(--surface3);border:1px solid var(--line);border-radius:10px;flex:none}
.seg button{display:flex;align-items:center;gap:6px;border:none;background:transparent;color:var(--tx2);font-size:.75rem;font-weight:500;padding:5px 9px;border-radius:8px;cursor:pointer;min-height:28px}
.seg button:hover{color:var(--tx)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ac);font-weight:600;box-shadow:var(--sh1)}
.sw{position:relative;width:32px;height:18px;border-radius:999px;background:var(--surface4);border:1px solid var(--line2);cursor:pointer;flex:none;transition:background var(--t),border-color var(--t)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--tx3);transition:transform var(--t) var(--ease),background var(--t)}
.sw[aria-checked=true]{background:var(--ac-bg);border-color:var(--ac-line)}
.sw[aria-checked=true]::after{transform:translateX(14px);background:var(--ac)}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.8125rem;color:var(--tx2)}
.sel{position:relative;min-width:0;width:100%}
.sel-btn{display:flex;align-items:center;gap:8px;width:100%;min-height:34px;padding:7px 11px;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r1);cursor:pointer;font-size:.8125rem;text-align:left}
.sel-btn:hover{border-color:var(--tx3)}
.sel-btn span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel-btn .i{color:var(--tx3)}
.sel-pop{position:fixed;z-index:900;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r2);box-shadow:var(--sh3);padding:5px;overflow:auto;min-width:160px;animation:fade .12s var(--ease)}
.sel-pop input{margin-bottom:5px}
.sel-opt{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;cursor:pointer;font-size:.8125rem}
.sel-opt:hover,.sel-opt.hi{background:var(--surface3)}
.sel-opt.on{background:var(--ac-bg);color:var(--ac);font-weight:600}
.sel-opt small{margin-left:auto;color:var(--tx3);font-family:var(--mono);font-size:.625rem}
.shell{display:grid;grid-template-columns:var(--rail) var(--sb) minmax(0,1fr);height:100dvh;overflow:hidden}
html[data-panel=open] .shell{grid-template-columns:var(--rail) var(--sb) minmax(0,1fr) var(--wp)}
.rail{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;background:var(--surface2);border-right:1px solid var(--line);z-index:30;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.rail::-webkit-scrollbar{width:4px}
.rail .logo{width:31px;height:31px;border-radius:9px;background:var(--ac);color:var(--ac-ink);display:grid;place-items:center;margin-bottom:7px;flex:none}
.rail .logo svg{width:17px;height:17px;stroke:currentColor;stroke-width:2.3;fill:none}
.rbtn{width:37px;height:37px;display:grid;place-items:center;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--tx3);cursor:pointer;position:relative;flex:none}
.rbtn:hover{background:var(--surface3);color:var(--tx)}
.rbtn.on{background:var(--ac-bg);border-color:var(--ac-line);color:var(--ac)}
.rbtn .badge{position:absolute;top:2px;right:2px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--ac);color:var(--ac-ink);font-family:var(--mono);font-size:.5rem;display:grid;place-items:center;font-weight:600}
.rail .sp{flex:1}
.sidebar{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--surface2);border-right:1px solid var(--line)}
.sb-top{padding:10px 11px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.proj-btn{display:flex;align-items:center;gap:9px;flex:1;min-width:0;padding:7px 10px;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r1);cursor:pointer;text-align:left}
.proj-btn:hover{border-color:var(--ac)}
.proj-dot{width:9px;height:9px;border-radius:3px;flex:none;background:var(--ac)}
.proj-btn b{flex:1;min-width:0;font-size:.8125rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-search{position:relative}
.sb-search .i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--tx3);pointer-events:none}
.sb-search input{padding-left:32px}
.sb-tools{display:flex;gap:6px;padding:7px 11px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.6875rem;font-weight:500;color:var(--tx2);cursor:pointer;min-height:27px;display:inline-flex;align-items:center;gap:5px}
.chip:hover{background:var(--surface3)}
.chip[aria-pressed=true]{background:var(--ac-bg);border-color:var(--ac-line);color:var(--ac)}
.list{flex:1;min-height:0;overflow-y:auto;scrollbar-gutter:stable;padding:4px 8px 12px}
.grp{font-size:.625rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);padding:11px 8px 4px}
.crow{display:flex;gap:7px;align-items:flex-start;padding:8px 9px;border-radius:var(--r1);cursor:pointer;border:1px solid transparent}
.crow:hover{background:var(--surface3)}
.crow.on{background:var(--surface);border-color:var(--line)}
.crow.sel{background:var(--ac-bg);border-color:var(--ac-line)}
.cmain{flex:1;min-width:0}
.ctitle{font-size:.8125rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cprev{font-size:.6875rem;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cacts{display:flex;gap:1px;opacity:0;transition:opacity var(--t)}
.crow:hover .cacts,.crow:focus-within .cacts{opacity:1}
.cacts button{width:23px;height:23px;display:grid;place-items:center;border:none;background:none;border-radius:6px;color:var(--tx3);cursor:pointer}
.cacts button:hover{background:var(--surface4);color:var(--tx)}
.cacts button.on{color:var(--warn)}.cacts button.on .i{fill:currentColor}
.cacts button[data-a=del]:hover{color:var(--danger)}
.empty-list{padding:26px 14px;text-align:center;color:var(--tx3);font-size:.75rem;line-height:1.8}
.sb-foot{border-top:1px solid var(--line);padding:9px 11px;display:flex;flex-direction:column;gap:5px}
.foot{display:flex;align-items:center;gap:7px;font-size:.6875rem;color:var(--tx3);min-width:0}
.foot span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--tx3);flex:none}
.dot.ok{background:var(--ok)}.dot.wa{background:var(--warn)}.dot.er{background:var(--danger)}.dot.live{background:var(--ac)}
.scrim2{position:fixed;inset:0;background:var(--scrim);z-index:60;opacity:0;pointer-events:none;transition:opacity var(--t)}
.scrim2.on{opacity:1;pointer-events:auto}
.main{display:grid;grid-template-rows:var(--bar) minmax(0,1fr) auto;min-width:0;min-height:0;background:var(--bg);overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);min-width:0}
.bar-t{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.bar-t .ttl{font-size:.875rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bar-r{display:flex;align-items:center;gap:3px;flex:none}
.state{display:flex;align-items:center;gap:6px;font-size:.6875rem;color:var(--tx2);background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap;flex:none}
.stage{overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;min-height:0;display:flex;flex-direction:column;overscroll-behavior:contain}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px 30px;gap:18px;min-height:100%}
.hero-in{width:100%;max-width:var(--col);display:flex;flex-direction:column;gap:16px;min-width:0}
.greet{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.greet h1{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:600;letter-spacing:-.025em;line-height:1.2}
.greet h1 em{font-style:normal;color:var(--ac)}
.greet p{color:var(--tx2);font-size:.9375rem;max-width:52ch}
.hero-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:8px}
.hcard{display:flex;flex-direction:column;gap:4px;padding:11px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);cursor:pointer;text-align:left;min-width:0}
.hcard:hover{border-color:var(--ac-line);background:var(--ac-bg)}
.hcard .i{color:var(--ac)}
.hcard b{font-size:.8125rem;font-weight:600}
.hcard small{font-size:.6875rem;color:var(--tx3);line-height:1.5}
.thread{width:100%;max-width:var(--col);margin:0 auto;padding:20px 20px 24px;display:flex;flex-direction:column;gap:20px;min-width:0}
.msg{display:flex;flex-direction:column;gap:6px;animation:fade .18s var(--ease) both;min-width:0}
@keyframes fade{from{opacity:0}to{opacity:1}}
.msg.user{align-items:flex-end}
.mhead{display:flex;align-items:center;gap:8px;font-size:.625rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3)}
.mhead .i{color:var(--ac)}
.ubody{max-width:88%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);border-bottom-right-radius:6px;padding:11px 15px;box-shadow:var(--sh1);min-width:0}
.abody{min-width:0;display:flex;flex-direction:column;gap:9px}
.md{font-size:1rem;line-height:1.78;overflow-wrap:anywhere;word-break:break-word;min-width:0}
html[data-density=compact] .md{font-size:.9375rem;line-height:1.7}
.md p{margin:0 0 .8em}.md p:last-child{margin-bottom:0}
.md h3,.md h4,.md h5{margin:1.1em 0 .45em;line-height:1.3;font-weight:600}
.md h3{font-size:1.08rem}.md h4{font-size:1rem}.md h5{font-size:.9375rem}
.md ul,.md ol{margin:.45em 0 .85em;padding-left:1.35em}.md li{margin:.25em 0}
.md blockquote{border-left:2px solid var(--ac-line);padding-left:1em;color:var(--tx2);margin:.6em 0}
.md hr{border:none;border-top:1px solid var(--line);margin:1.1em 0}
.md :not(pre)>code{font-family:var(--mono);font-size:.82em;background:var(--surface3);border:1px solid var(--line);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
.md a{overflow-wrap:anywhere}
.tbl{overflow-x:auto;margin:.8em 0;border:1px solid var(--line);border-radius:var(--r2);max-width:100%}
.md table{border-collapse:collapse;width:100%;font-size:.8125rem}
.md th,.md td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:left}
.md th{background:var(--surface2);font-size:.6875rem;text-transform:uppercase;color:var(--tx2);font-weight:600}
.md tr:last-child td{border-bottom:none}
.code{margin:.8em 0;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:var(--code);max-width:100%;min-width:0}
.codebar{display:flex;align-items:center;gap:8px;padding:5px 7px 5px 12px;background:var(--surface2);border-bottom:1px solid var(--line)}
.codebar span{font-family:var(--mono);font-size:.625rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tx2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cbtn{display:flex;align-items:center;gap:5px;background:transparent;border:1px solid var(--line2);border-radius:6px;color:var(--tx2);font-family:var(--mono);font-size:.625rem;padding:3px 8px;cursor:pointer;min-height:24px;flex:none}
.cbtn:hover{color:var(--ac);border-color:var(--ac)}
.cbtn.ok{color:var(--ok);border-color:var(--ok)}
.code pre{overflow-x:auto;padding:12px 14px;margin:0;max-width:100%}
.code code{font-family:var(--mono);font-size:.8125rem;line-height:1.7;display:block;white-space:pre}
.code .hljs{background:transparent;padding:0}
.caret{display:inline-block;width:7px;height:1.02em;background:var(--ac);vertical-align:text-bottom;margin-left:2px;border-radius:1px}
.think{display:inline-flex;align-items:center;gap:9px;color:var(--tx3);font-size:.8125rem}
.reason{border:1px solid var(--line);border-left:2px solid var(--info);border-radius:var(--r1);background:var(--info-bg);overflow:hidden}
.reason summary{cursor:pointer;padding:8px 12px;font-size:.75rem;font-weight:600;color:var(--info);list-style:none;display:flex;align-items:center;gap:7px}
.reason summary::-webkit-details-marker{display:none}
.reason .rb{padding:0 12px 10px;font-size:.8125rem;color:var(--tx2);line-height:1.7;white-space:pre-wrap;max-height:260px;overflow:auto;overflow-wrap:anywhere}
.toolcard{border:1px solid var(--line);border-radius:var(--r2);background:var(--surface2);overflow:hidden}
.tc-head{display:flex;align-items:center;gap:9px;padding:8px 12px;cursor:pointer;font-size:.8125rem;min-width:0}
.tc-head .i{color:var(--ac)}
.tc-head b{font-weight:600;font-family:var(--mono);font-size:.75rem;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tc-head .sp{flex:1}
.tc-body{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.tc-body pre{font-family:var(--mono);font-size:.6875rem;line-height:1.65;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:9px 11px;overflow:auto;max-height:240px;white-space:pre-wrap;overflow-wrap:anywhere}
.atts{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.att{position:relative;width:70px;height:70px;border-radius:10px;overflow:hidden;border:1px solid var(--line2);background:var(--surface3)}
.att img{width:100%;height:100%;object-fit:cover;display:block}
.att .x{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:6px;border:none;background:var(--scrim);color:#fff;display:grid;place-items:center;cursor:pointer}
.att.audio{width:auto;height:auto;max-width:100%;padding:6px 10px;display:flex;align-items:center;gap:8px}
.msgimgs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.msgimgs img{max-width:min(230px,100%);max-height:230px;border-radius:10px;border:1px solid var(--line);display:block;cursor:zoom-in}
.macts{display:flex;flex-wrap:wrap;gap:3px;opacity:0;transition:opacity var(--t)}
.msg:hover .macts,.msg:focus-within .macts{opacity:1}
.macts button{display:flex;align-items:center;gap:5px;background:none;border:1px solid transparent;border-radius:6px;color:var(--tx3);font-size:.6875rem;padding:3px 7px;cursor:pointer;min-height:26px}
.macts button:hover{color:var(--ac);background:var(--surface2);border-color:var(--line)}
.mmeta{display:flex;flex-wrap:wrap;gap:5px}
.errbox{border:1px solid color-mix(in srgb,var(--danger) 30%,transparent);background:var(--danger-bg);border-radius:var(--r2);padding:11px 13px;display:flex;flex-direction:column;gap:9px}
.errhead{display:flex;gap:9px;align-items:flex-start;color:var(--danger);font-size:.8125rem;line-height:1.6;overflow-wrap:anywhere}
.contbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);background:var(--warn-bg);border-radius:var(--r2);padding:9px 12px;font-size:.8125rem;color:var(--warn)}
.contbar span{flex:1;min-width:170px}

/* ═══ MANUS-STYLE AGENT BAR + CONSOLE ═══ */
.dock{border-top:1px solid var(--line);background:var(--bg);padding:9px 20px calc(11px + env(safe-area-inset-bottom))}
.dock-in{max-width:var(--col);margin:0 auto;display:flex;flex-direction:column;gap:8px;min-width:0}
.agentbar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:6px 8px 6px 10px;box-shadow:var(--sh1);min-width:0}
.agentbar.busy{border-color:var(--ac-line);background:var(--ac-bg)}
.ab-main{display:flex;align-items:center;gap:9px;flex:1;min-width:0;background:none;border:none;cursor:pointer;padding:2px 0;text-align:left;color:var(--tx)}
.ab-orb{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--surface3);color:var(--ac);flex:none}
.agentbar.busy .ab-orb{background:var(--surface);color:var(--ac)}
.ab-tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.ab-tx b{font-size:.75rem;font-weight:600}
.ab-tx small{font-size:.6875rem;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
.ab-meta{display:flex;align-items:center;gap:5px;flex:none}
.ab-acts{display:flex;align-items:center;gap:2px;flex:none}
.ab-acts .btn.ic{width:28px;height:28px}
.console{border:1px solid var(--line2);border-radius:14px;overflow:hidden;background:var(--surface);box-shadow:var(--sh2);display:flex;flex-direction:column;height:min(38vh,300px);animation:fade .16s var(--ease)}
.con-tabs{display:flex;align-items:center;gap:2px;padding:5px 7px;background:var(--surface2);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.con-tabs::-webkit-scrollbar{display:none}
.con-tabs button.ct{display:flex;align-items:center;gap:6px;border:1px solid transparent;background:transparent;color:var(--tx3);font-size:.6875rem;font-weight:500;padding:4px 9px;border-radius:7px;cursor:pointer;white-space:nowrap;flex:none}
.con-tabs button.ct:hover{background:var(--surface3);color:var(--tx)}
.con-tabs button.ct[aria-selected=true]{background:var(--surface);border-color:var(--line);color:var(--ac);font-weight:600}
.con-tabs .sp{flex:1}
.con-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.term{display:flex;flex-direction:column;height:100%;min-height:0;background:var(--term)}
.term-out{flex:1;min-height:0;overflow:auto;padding:10px 13px;font-family:var(--mono);font-size:.75rem;line-height:1.7;color:var(--term-tx);overscroll-behavior:contain}
.term-out::-webkit-scrollbar-thumb{background:#3A423E;background-clip:padding-box}
.tline{white-space:pre-wrap;overflow-wrap:anywhere}
.tline.cmd{color:#8FCBBC}.tline.err{color:#E08A80}.tline.ok{color:#74BE97}.tline.dim{color:#7E8A84}.tline.warn{color:#D3A85F}
.term-in{display:flex;align-items:center;gap:8px;padding:7px 12px;border-top:1px solid #262C29;background:#141716}
.term-in span{font-family:var(--mono);font-size:.75rem;color:#8FCBBC}
.term-in input{border:none;background:transparent;font-family:var(--mono);font-size:.75rem;padding:0;color:var(--term-tx)}
.term-in input:focus{box-shadow:none}
.term-in input::placeholder{color:#6C7873}
.con-scroll{flex:1;min-height:0;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:7px;scrollbar-gutter:stable}
.steprow{display:flex;align-items:flex-start;gap:9px;padding:7px 9px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);min-width:0}
.steprow .sn{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ac);flex:none;font-family:var(--mono);font-size:.5625rem}
.steprow .si{flex:1;min-width:0}
.steprow b{display:block;font-family:var(--mono);font-size:.6875rem;font-weight:600;overflow-wrap:anywhere}
.steprow small{display:block;font-size:.625rem;color:var(--tx3)}
.jump{align-self:center;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line2);border-radius:999px;padding:5px 13px;font-size:.75rem;color:var(--tx2);cursor:pointer;box-shadow:var(--sh1)}
.jump:hover{border-color:var(--ac);color:var(--ac)}
.composer{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r4);box-shadow:var(--sh2);padding:11px 12px 9px;transition:border-color var(--t);min-width:0}
.composer.focus{border-color:var(--ac-line)}
.composer.drag{border-color:var(--ac);background:var(--ac-bg)}
.composer textarea{border:none;background:transparent;resize:none;padding:0 2px;font-size:1rem;line-height:1.62;min-height:44px;max-height:32vh;overflow-y:auto}
.composer textarea:focus{outline:none;box-shadow:none}
.ctools{display:flex;align-items:center;gap:6px;margin-top:8px;min-width:0;flex-wrap:wrap}
.plusbtn{width:32px;height:32px;border-radius:10px;border:1px solid var(--line2);background:var(--surface2);color:var(--tx2);display:grid;place-items:center;cursor:pointer;flex:none;transition:background var(--t),color var(--t),border-color var(--t)}
.plusbtn:hover{color:var(--ac);border-color:var(--ac-line)}
.plusbtn.on{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
.mchip{display:flex;align-items:center;gap:7px;min-width:0;max-width:min(280px,100%);background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:.75rem;color:var(--tx2);min-height:30px}
.mchip:hover{border-color:var(--ac-line);color:var(--ac)}
.mchip .i{color:var(--ac)}
.mchip b{font-weight:500;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ctools .sp{flex:1}
.cbtn2{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line);border-radius:9px;background:var(--surface2);color:var(--tx2);cursor:pointer;flex:none}
.cbtn2:hover{color:var(--ac);border-color:var(--ac-line)}
.cbtn2.on{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
.send{width:34px;height:34px;flex:none;border:1px solid var(--ac);border-radius:50%;background:var(--ac);color:var(--ac-ink);display:grid;place-items:center;cursor:pointer}
.send:hover:not(:disabled){background:var(--ac-hi)}
.send:disabled{opacity:.35;cursor:not-allowed}
.send.stop{background:var(--danger-bg);border-color:color-mix(in srgb,var(--danger) 38%,transparent);color:var(--danger)}
.rec{display:flex;align-items:center;gap:9px;padding:6px 11px;background:var(--danger-bg);border:1px solid color-mix(in srgb,var(--danger) 30%,transparent);border-radius:10px;font-size:.75rem;color:var(--danger)}
.rec .wave{display:flex;gap:2px;align-items:flex-end;height:14px}
.rec .wave i{width:2px;background:currentColor;border-radius:1px;height:4px}
.hintrow{display:flex;justify-content:space-between;gap:12px;font-size:.6875rem;color:var(--tx3);min-width:0}
.hintrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hintrow kbd{background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-family:var(--mono)}

/* ═══ PLUS TOOLS MENU ═══ */
.plusmenu{position:fixed;z-index:790;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r3);box-shadow:var(--sh3);
  display:flex;flex-direction:column;width:min(380px,calc(100vw - 20px));max-height:min(62vh,540px);overflow:hidden;animation:fade .14s var(--ease)}
.pm-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.pm-head .i{color:var(--tx3)}
.pm-head input{border:none;background:transparent;padding:0;font-size:.8125rem}
.pm-head input:focus{box-shadow:none}
.pm-body{flex:1;min-height:0;overflow:auto;padding:6px;scrollbar-gutter:stable}
.pm-sec{font-size:.5625rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);padding:9px 9px 4px;display:flex;align-items:center;gap:6px}
.pm-sec .sp{flex:1}
.pm-item{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:10px;cursor:pointer;min-width:0}
.pm-item:hover{background:var(--surface3)}
.pm-item .pi{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);color:var(--ac);flex:none}
.pm-item .pt{flex:1;min-width:0}
.pm-item b{display:block;font-size:.8125rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm-item small{display:block;font-size:.625rem;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm-foot{border-top:1px solid var(--line);background:var(--surface2);padding:9px 12px;display:flex;flex-direction:column;gap:8px}
.pm-empty{padding:22px 12px;text-align:center;color:var(--tx3);font-size:.75rem}

/* ═══ WORK PANEL ═══ */
.panel{display:none;flex-direction:column;min-height:0;min-width:0;background:var(--surface);border-left:1px solid var(--line)}
html[data-panel=open] .panel{display:flex}
.p-head{flex:none;display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
.p-tabs{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.p-tabs::-webkit-scrollbar{display:none}
.p-tabs button{display:flex;align-items:center;gap:6px;border:none;background:transparent;color:var(--tx3);font-size:.75rem;font-weight:500;padding:6px 9px;border-radius:8px;cursor:pointer;white-space:nowrap;flex:none}
.p-tabs button:hover{background:var(--surface3);color:var(--tx)}
.p-tabs button[aria-selected=true]{background:var(--ac-bg);color:var(--ac);font-weight:600}
.p-body{flex:1;min-height:0;overflow:auto;scrollbar-gutter:stable;padding:11px;display:flex;flex-direction:column;gap:11px;overscroll-behavior:contain}
.p-body.flush{padding:0;overflow:hidden}
.card{border:1px solid var(--line);border-radius:var(--r2);background:var(--surface2);padding:12px;display:flex;flex-direction:column;gap:9px;min-width:0}
.card>b{display:flex;align-items:center;gap:8px;font-size:.8125rem;font-weight:600;flex-wrap:wrap}
.card>b .i{color:var(--ac)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--line);font-size:.75rem}
.kv:first-of-type{border-top:none}
.kv dt{color:var(--tx3);flex:none}.kv dd{font-family:var(--mono);font-size:.6875rem;text-align:right;overflow-wrap:anywhere;min-width:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{border:1px solid var(--line);border-radius:var(--r2);background:var(--surface2);padding:9px 11px;min-width:0}
.stat b{display:block;font-family:var(--mono);font-size:1rem;font-weight:500;color:var(--ac)}
.stat span{font-size:.625rem;color:var(--tx3)}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 11px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface2);min-width:0}
.item.on{border-color:var(--ac-line);background:var(--ac-bg)}
.item .im{flex:1;min-width:0}
.item b{display:block;font-size:.8125rem;font-weight:600;overflow-wrap:anywhere}
.item small{display:block;font-size:.6875rem;color:var(--tx3);line-height:1.55;overflow-wrap:anywhere}
.item .ia{display:flex;gap:4px;flex:none;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.scroll-list{display:flex;flex-direction:column;gap:8px;min-width:0}
.canvas-wrap{position:relative;flex:1;min-height:240px;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:var(--surface);display:grid;place-items:center}
#sketch{display:block;touch-action:none;cursor:crosshair;max-width:100%;max-height:100%}
.board{position:relative;flex:1;min-height:300px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface2);overflow:hidden;touch-action:none}
.bitem{position:absolute;border-radius:10px;overflow:hidden;border:1px solid var(--line2);box-shadow:var(--sh1);cursor:grab;background:var(--surface);min-width:60px;min-height:44px;touch-action:none}
.bitem.drag{cursor:grabbing;box-shadow:var(--sh2);z-index:5}
.bitem img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.bitem .note-t{padding:9px 11px;font-size:.75rem;line-height:1.55;height:100%;overflow:auto;overflow-wrap:anywhere}
.bitem .sw-fill{width:100%;height:100%}
.bitem .bx{position:absolute;top:3px;right:3px;width:20px;height:20px;border:none;border-radius:6px;background:var(--scrim);color:#fff;display:grid;place-items:center;cursor:pointer;opacity:0}
.bitem:hover .bx{opacity:1}
.bitem .rz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,var(--line2) 50%)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatch{width:26px;height:26px;border-radius:7px;border:1px solid var(--line2);cursor:pointer;flex:none}
.swatch.on{outline:2px solid var(--ac);outline-offset:2px}
.mroot{position:fixed;inset:0;z-index:800;display:flex;align-items:center;justify-content:center;padding:18px}
.mscrim{position:absolute;inset:0;background:var(--scrim);animation:fade .14s ease}
.mcard{position:relative;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r3);box-shadow:var(--sh3);display:flex;flex-direction:column;width:100%;max-height:min(90dvh,940px);animation:mIn .18s var(--ease);overflow:hidden;min-width:0}
@keyframes mIn{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.mcard.sm{max-width:440px}.mcard.md{max-width:640px}.mcard.lg{max-width:900px}.mcard.xl{max-width:1180px}.mcard.full{max-width:1360px;height:min(92dvh,960px)}
.mhead{flex:none;display:flex;align-items:center;gap:11px;padding:13px 18px;border-bottom:1px solid var(--line);min-width:0}
.mhead .i{color:var(--ac)}
.mhead b{font-size:1rem;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mhead .sp{flex:1}
.mbody{flex:1;min-height:0;overflow:auto;scrollbar-gutter:stable;padding:16px 18px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.mbody.flush{padding:0;overflow:hidden}
.mfoot{flex:none;padding:10px 18px;border-top:1px solid var(--line);background:var(--surface2);display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:.75rem;color:var(--tx3)}
.mfoot .sp{flex:1}
.mtabs{flex:none;display:flex;gap:2px;padding:8px 14px 0;border-bottom:1px solid var(--line);background:var(--surface2);overflow-x:auto;scrollbar-width:none}
.mtabs::-webkit-scrollbar{display:none}
.mtabs button{display:flex;align-items:center;gap:7px;background:none;border:none;border-bottom:2px solid transparent;color:var(--tx3);font-size:.8125rem;font-weight:500;padding:9px 12px;cursor:pointer;white-space:nowrap;flex:none}
.mtabs button:hover{color:var(--tx)}
.mtabs button[aria-selected=true]{color:var(--ac);border-bottom-color:var(--ac);font-weight:600}
.beta{font-family:var(--mono);font-size:.5625rem;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:5px;padding:2px 6px;flex:none}
.split{display:grid;grid-template-columns:200px minmax(0,1fr);flex:1;min-height:0;min-width:0}
.split-l{border-right:1px solid var(--line);overflow:auto;padding:10px;background:var(--surface2);display:flex;flex-direction:column;gap:3px}
.split-r{overflow:auto;scrollbar-gutter:stable;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0;overscroll-behavior:contain}
.catbtn{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--tx2);font-size:.8125rem;cursor:pointer;text-align:left;flex:none}
.catbtn:hover{background:var(--surface3)}
.catbtn.on{background:var(--ac-bg);border-color:var(--ac-line);color:var(--ac);font-weight:600}
.catbtn small{margin-left:auto;font-family:var(--mono);font-size:.625rem;color:var(--tx3)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:9px;min-width:0}
.pcard{display:flex;flex-direction:column;gap:6px;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface2);cursor:pointer;text-align:left;min-width:0}
.pcard:hover{border-color:var(--ac-line)}
.pcard.on{border-color:var(--ac);background:var(--ac-bg)}
.pcard .pt{display:flex;align-items:center;gap:7px;min-width:0}
.pcard b{font-size:.8125rem;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard small{font-size:.6875rem;color:var(--tx3);line-height:1.5;overflow-wrap:anywhere}
.pcard .ptags{display:flex;gap:4px;flex-wrap:wrap}
.urline{font-family:var(--mono);font-size:.625rem;color:var(--tx3);overflow-wrap:anywhere;line-height:1.5}
.searchbar{position:relative;flex:1;min-width:160px}
.searchbar .i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--tx3)}
.searchbar input{padding-left:32px}
.codeview{background:var(--code);border:1px solid var(--line);border-radius:var(--r2);overflow:auto;max-height:52dvh}
.codeview pre{font-family:var(--mono);font-size:.6875rem;line-height:1.7;padding:13px 15px;margin:0;white-space:pre;color:var(--tx2)}
.kbd{display:inline-flex;align-items:center;font-family:var(--mono);font-size:.625rem;background:var(--surface3);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--tx2)}
.palette{position:fixed;inset:0;z-index:850;display:flex;align-items:flex-start;justify-content:center;padding:12vh 18px 18px}
.pal-card{position:relative;width:100%;max-width:620px;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r3);box-shadow:var(--sh3);overflow:hidden;animation:mIn .16s var(--ease)}
.pal-in{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.pal-in input{border:none;background:transparent;font-size:.9375rem;padding:0}
.pal-in input:focus{box-shadow:none}
.pal-list{max-height:52vh;overflow:auto;padding:6px}
.pal-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;cursor:pointer;font-size:.8125rem}
.pal-item:hover,.pal-item.hi{background:var(--ac-bg);color:var(--ac)}
.pal-item .i{color:var(--tx3)}.pal-item.hi .i{color:var(--ac)}
.pal-item small{margin-left:auto;color:var(--tx3);font-size:.6875rem}
.toasts{position:fixed;top:12px;right:12px;z-index:950;display:flex;flex-direction:column;gap:8px;max-width:min(370px,calc(100vw - 24px))}
.toast{position:relative;display:flex;align-items:flex-start;gap:9px;background:var(--surface);border:1px solid var(--line2);border-left:3px solid var(--ac);border-radius:var(--r2);padding:10px 12px;box-shadow:var(--sh2);font-size:.8125rem;overflow:hidden;animation:fade .16s ease}
.toast.out{opacity:0;transition:opacity .18s}
.toast.ok{border-left-color:var(--ok)}.toast.wa{border-left-color:var(--warn)}.toast.er{border-left-color:var(--danger)}.toast.in{border-left-color:var(--info)}
.toast .i{margin-top:2px;color:var(--ac)}
.toast.ok .i{color:var(--ok)}.toast.wa .i{color:var(--warn)}.toast.er .i{color:var(--danger)}.toast.in .i{color:var(--info)}
.toast b{flex:1;font-weight:400;line-height:1.55;overflow-wrap:anywhere;min-width:0}
.toast button.a{background:none;border:none;color:var(--ac);font-weight:600;font-size:.75rem;cursor:pointer;white-space:nowrap}
.toast button.x{background:none;border:none;color:var(--tx3);cursor:pointer;padding:2px;display:grid;place-items:center}
.life{position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--ac-line);transform-origin:left;animation:life linear forwards}
@keyframes life{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.lightbox{position:fixed;inset:0;z-index:880;background:var(--scrim);display:grid;place-items:center;padding:24px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:var(--sh3)}
details.adv{border:1px solid var(--line);border-radius:var(--r2);background:var(--surface2)}
details.adv summary{cursor:pointer;padding:10px 12px;font-size:.75rem;font-weight:600;color:var(--tx2);list-style:none;display:flex;align-items:center;gap:8px}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary::after{content:"";margin-left:auto;width:6px;height:6px;border-right:1.6px solid var(--tx3);border-bottom:1.6px solid var(--tx3);transform:rotate(45deg)}
details.adv[open] summary::after{transform:rotate(-135deg)}
details.adv .adv-in{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
#sbClose{display:none}
#focusExit{display:none;position:fixed;top:10px;right:10px;z-index:65;box-shadow:var(--sh2)}
html[data-focus=on] #focusExit{display:grid}
html[data-focus=on] .rail,html[data-focus=on] .sidebar,html[data-focus=on] .panel{display:none}
@media (max-width:1280px){
  .shell,html[data-panel=open] .shell{grid-template-columns:var(--rail) var(--sb) minmax(0,1fr)}
  .panel{position:fixed;right:0;top:0;bottom:0;left:auto;width:min(420px,94vw);z-index:70;box-shadow:var(--sh3);animation:fade .16s ease}
}
@media (max-width:1023px){
  .shell,html[data-panel=open] .shell{grid-template-columns:var(--rail) minmax(0,1fr)}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:min(318px,88vw);z-index:70;transform:translateX(-100%);visibility:hidden;transition:transform var(--t) var(--ease),visibility var(--t);box-shadow:var(--sh3);border-right:1px solid var(--line2)}
  .sidebar.on{transform:none;visibility:visible}
  #sbClose{display:grid}
  #projTag{display:none}
  .cacts{opacity:1}
}
@media (max-width:900px){.seg button span{display:none}.seg button{padding:5px 8px}}
@media (max-width:760px){
  :root{--rail:0px;--bar:50px;--mobnav:54px}
  .shell,html[data-panel=open] .shell{grid-template-columns:minmax(0,1fr);padding-bottom:calc(var(--mobnav) + env(safe-area-inset-bottom))}
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;height:calc(var(--mobnav) + env(safe-area-inset-bottom));flex-direction:row;align-items:center;gap:2px;padding:4px 8px calc(4px + env(safe-area-inset-bottom));border-right:none;border-top:1px solid var(--line);overflow-x:auto;overflow-y:hidden;z-index:40;scrollbar-width:thin}
  .rail::-webkit-scrollbar{height:4px;width:4px}
  .rail .logo,.rail .sp{display:none}
  .rbtn{width:39px;height:39px}
  .sidebar{width:min(318px,92vw)}
  .panel{width:100vw;left:0;right:0;border-left:none}
  .bar{padding:0 8px;gap:5px}
  .state .st{display:none}.state{padding:4px 7px}
  .hero{padding:16px 13px 24px;gap:15px}
  .hero-cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .hcard{padding:10px 11px}.hcard small{font-size:.625rem}
  .thread{padding:15px 13px 20px;gap:17px}
  .dock{padding:8px 11px 9px}
  .composer{padding:10px 11px 8px;border-radius:18px}
  .console{height:min(42vh,280px)}
  .ubody{max-width:94%}
  .macts{opacity:1}
  .hintrow .k{display:none}
  .toasts{top:auto;bottom:calc(var(--mobnav) + 128px + env(safe-area-inset-bottom));left:10px;right:10px;max-width:none}
  .mroot{padding:10px}
  .mcard{max-height:calc(100dvh - 20px);border-radius:var(--r3)}
  .mcard.full{height:calc(100dvh - 20px)}
  .mhead{padding:12px 14px}.mbody{padding:13px 14px}.mfoot{padding:10px 14px}
  .split{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .split-l{border-right:none;border-bottom:1px solid var(--line);flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:8px;scrollbar-width:none}
  .split-l::-webkit-scrollbar{display:none}
  .catbtn{width:auto;white-space:nowrap}.catbtn small{display:none}
  .split-r{padding:12px 13px}
  .pgrid{grid-template-columns:1fr}
  .palette{padding:8vh 10px 10px}
  .plusmenu{width:calc(100vw - 20px);max-height:58vh}
  #vBody{overflow:auto}
  .canvas-wrap{flex:none;height:44vh;min-height:230px}
  .board{flex:none;height:50vh;min-height:270px}
  .bitem .bx{opacity:1}
  .msgimgs img{max-width:100%}
  .ab-meta{display:none}
}
@media (max-width:480px){.bar .btn.ic{width:32px;height:32px}.bar-r{gap:1px}.greet p{font-size:.875rem}}
@media (max-height:560px) and (min-width:761px){.rail{gap:2px;padding:6px 0}.rbtn{width:34px;height:34px}}
html[data-focus=on] .shell{grid-template-columns:minmax(0,1fr);padding-bottom:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

const toasts=$('#toasts');
function toast(msg,{type='in',timeout=4600,action=null}={}){
  const nm={ok:'check',wa:'alert',er:'alert',in:'info'};
  const el=document.createElement('div');el.className='toast '+type;
  el.innerHTML=`${I(nm[type]||'info')}<b></b>${action?'<button class="a"></button>':''}<button class="x" aria-label="Dismiss">${I('x')}</button><span class="life" style="animation-duration:${timeout}ms"></span>`;
  el.querySelector('b').textContent=msg;
  const kill=()=>{el.classList.add('out');setTimeout(()=>el.remove(),200)};
  const t=setTimeout(kill,timeout);
  el.querySelector('.x').onclick=()=>{clearTimeout(t);kill()};
  if(action){const b=el.querySelector('.a');b.textContent=action.label;b.onclick=()=>{clearTimeout(t);kill();action.fn()}}
  toasts.appendChild(el);while(toasts.children.length>4)toasts.firstChild.remove();
}
const modalStack=[];
function modal({title,icon='gear',size='md',tabs=null,body='',foot='',flush=false,onMount,tag=''}){
  const el=document.createElement('div');el.className='mroot';
  el.innerHTML=`<div class="mscrim"></div><div class="mcard ${size}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="mhead">${I(icon,'i l')}<b>${esc(title)}</b>${tag}<span class="sp"></span><button class="btn q ic" data-x aria-label="Close">${I('x','i')}</button></div>
    ${tabs?`<div class="mtabs" role="tablist">${tabs.map((t,i)=>`<button role="tab" data-tab="${t.id}" aria-selected="${i===0}">${I(t.i)}${esc(t.n)}</button>`).join('')}</div>`:''}
    <div class="mbody${flush?' flush':''}">${body}</div>${foot?`<div class="mfoot">${foot}</div>`:''}</div>`;
  $('#modalHost').appendChild(el);
  const card=el.querySelector('.mcard');
  const close=()=>{const i=modalStack.indexOf(api);if(i>=0)modalStack.splice(i,1);el.remove();if(!modalStack.length)document.body.style.overflow='';api.onClose&&api.onClose()};
  const api={el,card,body:el.querySelector('.mbody'),close,onClose:null,onTab:null};
  modalStack.push(api);document.body.style.overflow='hidden';
  el.querySelector('[data-x]').onclick=close;el.querySelector('.mscrim').onclick=close;
  el.addEventListener('keydown',e=>{
    if(e.key==='Escape'){e.stopPropagation();close();return}
    if(e.key==='Tab'){const f=[...card.querySelectorAll('button,input,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled&&x.offsetParent!==null);
      if(!f.length)return;const a=f[0],b=f[f.length-1];
      if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus()}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus()}}
  });
  if(tabs)el.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
    el.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));api.onTab&&api.onTab(b.dataset.tab)});
  setTimeout(()=>{const f=card.querySelector('input,textarea,button.p');f&&f.focus()},40);
  onMount&&onMount(api);return api;
}
function confirmModal({title='Confirm',body='',ok='Delete',danger=true}){

    const m=modal({title,icon:'alert',size:'sm',body:`<p style="font-size:.875rem;color:var(--tx2);line-height:1.7">${esc(body)}</p>`,
      foot:`<span class="sp"></span><button class="btn" data-no>Cancel</button><button class="btn ${danger?'d':'p'}" data-yes>${esc(ok)}</button>`});
    m.el.querySelector('[data-no]').onclick=()=>{m.close();res(false)};
    m.el.querySelector('[data-yes]').onclick=()=>{m.close();res(true)};
    m.onClose=()=>res(false);
  });
}
function promptModal({title='Input',label='Value',value='',placeholder='',multiline=false,ok='Save',hint=''}){

      foot:`<span class="sp"></span><button class="btn" data-no>Cancel</button><button class="btn p" data-yes>${esc(ok)}</button>`});
    const inp=m.el.querySelector('#pmIn');

function select({value,options,onChange,placeholder='Select',search=false,width=220}){
  const wrap=document.createElement('div');wrap.className='sel';
  const cur=options.find(o=>o.v===value);
  wrap.innerHTML=`<button type="button" class="sel-btn">${cur&&cur.i?I(cur.i):''}<span>${esc(cur?cur.n:placeholder)}</span>${I('chev')}</button>`;
  wrap.querySelector('.sel-btn').onclick=e=>{
    e.stopPropagation();if(openSel){openSel.remove();openSel=null}
    const r=e.currentTarget.getBoundingClientRect();
    const w=Math.min(Math.max(width,r.width),innerWidth-16),h=Math.min(320,options.length*36+(search?46:12),innerHeight-16);
    const pop=document.createElement('div');pop.className='sel-pop';
    pop.style.width=w+'px';pop.style.maxHeight=h+'px';
    pop.style.left=clamp(r.left,8,Math.max(8,innerWidth-w-8))+'px';
    pop.style.top=(innerHeight-r.bottom>h+8?r.bottom+4:Math.max(8,r.top-h-4))+'px';
    pop.innerHTML=(search?`<input type="text" placeholder="Filter" aria-label="Filter"/>`:'')+
      options.map(o=>`<div class="sel-opt${o.v===value?' on':''}" data-v="${esc(o.v)}">${o.i?I(o.i):''}<span>${esc(o.n)}</span>${o.h?`<small>${esc(o.h)}</small>`:''}</div>`).join('');
    $('#selHost').appendChild(pop);openSel=pop;
    const opts=[...pop.querySelectorAll('.sel-opt')],pick=v=>{pop.remove();openSel=null;onChange(v)};
    opts.forEach(o=>o.onclick=()=>pick(o.dataset.v));
    const si=pop.querySelector('input');
    if(si){si.focus();si.oninput=()=>{const q=si.value.toLowerCase();opts.forEach(o=>o.hidden=!o.textContent.toLowerCase().includes(q))}}
    pop.addEventListener('keydown',ev=>{
      const vis=opts.filter(o=>!o.hidden);let i=vis.findIndex(o=>o.classList.contains('hi'));
      if(ev.key==='ArrowDown'){ev.preventDefault();i=Math.min(vis.length-1,i+1);vis.forEach(o=>o.classList.remove('hi'));vis[i]?.classList.add('hi');vis[i]?.scrollIntoView({block:'nearest'})}
      if(ev.key==='ArrowUp'){ev.preventDefault();i=Math.max(0,i-1);vis.forEach(o=>o.classList.remove('hi'));vis[i]?.classList.add('hi');vis[i]?.scrollIntoView({block:'nearest'})}
      if(ev.key==='Enter'){ev.preventDefault();const t=vis.find(o=>o.classList.contains('hi'))||vis[0];t&&pick(t.dataset.v)}
      if(ev.key==='Escape'){pop.remove();openSel=null}
    });
  };
  return wrap;
}

/* ══ MARKDOWN ══ */
function codeBox(lang,code){
  const l=/^[a-z0-9+#.-]{1,20}$/i.test(lang||'')?lang.toLowerCase():'';
  return `<div class="code"><div class="codebar"><span>${esc(l||'text')}</span><button class="cbtn" data-cc>${I('copy')}Copy</button>${l==='js'||l==='javascript'?`<button class="cbtn" data-run>${I('play')}Run</button>`:''}</div><pre><code${l?` class="language-${l}"`:''}>${esc(code)}</code></pre></div>`;
}
function inl(t){
  const cs=[];t=t.replace(/`([^`\n]+)`/g,(_,c)=>{cs.push(c);return `\u0001C${cs.length-1}\u0001`});
  t=t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,x,u)=>/^(https?:\/\/|mailto:)/i.test(u)?`<a href="${u}" target="_blank" rel="noopener noreferrer">${x}</a>`:m);
  t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  t=t.replace(/(?<![\w])_([^_\n]+)_(?![\w])/g,'<em>$1</em>').replace(/~~([^~]+)~~/g,'<del>$1</del>');
  return t.replace(/\u0001C(\d+)\u0001/g,(_,i)=>`<code>${cs[+i]}</code>`);
}
function md(src){
  src=String(src||'').replace(/[\u0000\u0001]/g,'');const boxes=[];
  let t=src.replace(/```([^\n`]*)\n?([\s\S]*?)```/g,(_,l,c)=>{boxes.push(codeBox(l.trim(),c.replace(/\n$/,'')));return `\u0001B${boxes.length-1}\u0001`});
  t=t.replace(/```([^\n`]*)\n?([\s\S]*)$/,(_,l,c)=>{boxes.push(codeBox(l.trim(),c));return `\u0001B${boxes.length-1}\u0001`});
  t=esc(t);const L=t.split('\n'),out=[];let p=[],li=null,q=[];
  const fp=()=>{if(p.length){out.push('<p>'+inl(p.join('<br>'))+'</p>');p=[]}};
  const fl=()=>{if(li){out.push(`<${li.t}>`+li.i.map(x=>'<li>'+inl(x)+'</li>').join('')+`</${li.t}>`);li=null}};
  const fq=()=>{if(q.length){out.push('<blockquote>'+inl(q.join('<br>'))+'</blockquote>');q=[]}};
  const fa=()=>{fp();fl();fq()};
  for(let i=0;i<L.length;i++){
    const s=L[i].trim();if(!s){fa();continue}
    if(/^\u0001B\d+\u0001$/.test(s)){fa();out.push(s);continue}
    const h=s.match(/^(#{1,4})\s+(.*)$/);if(h){fa();const v=Math.min(h[1].length+2,5);out.push(`<h${v}>`+inl(h[2])+`</h${v}>`);continue}
    if(/^(-{3,}|\*{3,})$/.test(s)){fa();out.push('<hr>');continue}
    if(s.startsWith('&gt;')){fp();fl();q.push(s.replace(/^&gt;\s?/,''));continue}
    if(s.startsWith('|')&&i+1<L.length&&/^\|?[\s:|-]+\|[\s:|-]*$/.test(L[i+1].trim())){
      fa();const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>inl(c.trim()));const head=cells(s);i++;const rows=[];
      while(i+1<L.length&&L[i+1].trim().startsWith('|'))rows.push(cells(L[++i]));
      out.push('<div class="tbl"><table><thead><tr>'+head.map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>');continue}
    const m=s.match(/^([-*+]|\d+\.)\s+(.*)$/);
    if(m){fp();fq();const tag=/^\d/.test(m[1])?'ol':'ul';if(!li||li.t!==tag){fl();li={t:tag,i:[]}}li.i.push(m[2]);continue}
    fl();fq();p.push(s);
  }
  fa();return out.join('\n').replace(/\u0001B(\d+)\u0001/g,(_,i)=>boxes[+i]);
}
function loadHL(){
  if(window.hljs)return Promise.resolve(window.hljs);if(hlP)return hlP;
  hlP=new Promise((res,rej)=>{
    const b='https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/';
    hlL=document.createElement('link');hlL.rel='stylesheet';hlL.href=b+'github.min.css';
    hlD=document.createElement('link');hlD.rel='stylesheet';hlD.href=b+'github-dark.min.css';
    document.head.append(hlL,hlD);hlL.disabled=PF.theme!=='light';hlD.disabled=PF.theme==='light';
    const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js';
    s.onload=()=>res(window.hljs);s.onerror=()=>{hlP=null;rej(new Error('hl unavailable'))};document.head.appendChild(s)});
  return hlP;
}

const workerOn=()=>!!(PF.workerUrl&&PF.workerUrl.trim());
function chatEndpoint(){

    ...(g.p.id==='openrouter'?{'HTTP-Referer':location.origin.startsWith('http')?location.origin:'https://forge.studio','X-Title':'Forge Studio'}:{})}};

async function proxyFetch(url,opts={}){
  if(workerOn()){
    const r=await fetch(PF.workerUrl.replace(/\/+$/,'')+'/fetch',{method:'POST',headers:{'Content-Type':'application/json','x-forge-token':PF.workerToken||''},
      body:JSON.stringify({url,method:opts.method||'GET',headers:opts.headers||{},body:opts.body||null}),signal:opts.signal});
    if(!r.ok)throw new Error('Worker fetch '+r.status);return r;
  }
  return fetch(url,{...opts});
}
async function listModels(pid){
  const p=provById(pid);if(!p)return [];
  const cfg=S.keys['__cfg_'+pid]||{},base=(cfg.base||p.b||'').replace(/\/+$/,'');
  if(!base)return [];
  const key=p.nokey?'':keyOf(pid),cache=S.modelsCache[pid];
  if(cache&&Date.now()-cache.ts<36e5&&cache.list.length)return cache.list;
  let raw=[];
  try{
    let r;
    if(workerOn())r=await fetch(PF.workerUrl.replace(/\/+$/,'')+'/models',{method:'POST',headers:{'Content-Type':'application/json','x-forge-token':PF.workerToken||''},body:JSON.stringify({base,key,provider:pid}),signal:AbortSignal.timeout(20000)});
    else{if(p.adapter)throw new Error('This provider needs the Forge Worker adapter for listing. Type a model id manually.');
      const h={};if(key)h.Authorization='Bearer '+key;r=await fetch(base+'/models',{headers:h,signal:AbortSignal.timeout(20000)})}
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();raw=j.data||j.models||[];
  }catch(e){if(cache)return cache.list;throw e}
  let list=raw.map(m=>{const pr=m.pricing||{};
    return {id:m.id||m.name,name:m.name||m.id,ctx:m.context_length||m.max_context_length||0,
      free:['prompt','completion','request','image'].every(k=>!pr[k]||parseFloat(pr[k])===0),
      tools:(m.supported_parameters||[]).includes('tools'),vision:(m.architecture?.input_modalities||[]).includes('image'),created:m.created||0}}).filter(m=>m.id);
  if(pid==='openrouter'&&S.freeOnly)list=list.filter(m=>m.free);
  list.sort((a,b)=>a.name.localeCompare(b.name));
  S.modelsCache[pid]={ts:Date.now(),list};saveS();return list;
}

/* ══ MCP CLIENT (URL only) ══ */
let mcpSeq=1;
async function mcpRPC(c,method,params={},notify=false){
  const body={jsonrpc:'2.0',method,params};if(!notify)body.id=mcpSeq++;
  const headers={'Content-Type':'application/json',Accept:'application/json, text/event-stream',...(c.headers||{})};
  if(c.session)headers['Mcp-Session-Id']=c.session;
  let res;
  if(c.viaWorker&&workerOn())res=await fetch(PF.workerUrl.replace(/\/+$/,'')+'/mcp',{method:'POST',
    headers:{'Content-Type':'application/json','x-forge-token':PF.workerToken||''},body:JSON.stringify({url:c.url,payload:body,headers}),signal:AbortSignal.timeout(45000)});
  else res=await fetch(c.url,{method:'POST',headers,body:JSON.stringify(body),signal:AbortSignal.timeout(45000)});
  const sid=res.headers.get('Mcp-Session-Id')||res.headers.get('mcp-session-id');if(sid)c.session=sid;
  if(notify)return null;
  if(!res.ok)throw new Error('HTTP '+res.status+' '+(await res.text()).slice(0,160));
  const ct=res.headers.get('content-type')||'';
  if(ct.includes('text/event-stream')){
    const txt=await res.text();
    for(const l of txt.split('\n').filter(x=>x.startsWith('data:'))){try{const j=JSON.parse(l.slice(5).trim());if(j.id===body.id)return j}catch{}}
    throw new Error('No JSON-RPC reply in SSE stream');
  }
  return res.json();
}
async function connectURL(c,{silent=false}={}){
  c.status='connecting';paintAgentbar();renderConsole();
  tput('mcp connect '+c.url,'cmd');
  try{
    const init=await mcpRPC(c,'initialize',{protocolVersion:'2024-11-05',capabilities:{tools:{},resources:{},prompts:{}},clientInfo:{name:'Forge Studio',version:'2.0'}});
    if(init.error)throw new Error(init.error.message);
    c.info=init.result?.serverInfo||{name:c.name};
    try{await mcpRPC(c,'notifications/initialized',{},true)}catch{}
    const tl=await mcpRPC(c,'tools/list',{});
    if(tl.error)throw new Error(tl.error.message);
    c.tools=(tl.result?.tools||[]).map(t=>({name:t.name,description:t.description||'',schema:t.inputSchema||{type:'object',properties:{}}}));
    try{const rl=await mcpRPC(c,'resources/list',{});c.resources=rl.result?.resources||[]}catch{c.resources=[]}
    c.status='online';c.error='';c.connectedAt=Date.now();c.autoEnabled=true;
    const o=off();o.connectors=o.connectors.filter(x=>x!==c.id);
    tput(`${c.name} online · ${c.tools.length} tools auto-enabled`,'ok');
    if(!silent)toast(`${c.name}: ${c.tools.length} tools auto-enabled for this project.`,{type:'ok',timeout:5200});
  }catch(e){
    c.status='error';c.error=String(e.message||e);
    tput(`${c.name}: ${c.error}`,'err');
    if(!silent)toast(`${c.name}: ${c.error}`,{type:'er',timeout:7000,action:{label:'Worker proxy',fn:openWorker}});
  }
  saveS();paintFoot();paintAgentbar();renderConsole();renderPanel();
  return c.status==='online';
}
async function mcpCall(c,tool,args){
  const r=await mcpRPC(c,'tools/call',{name:tool,arguments:args||{}});
  if(r.error)throw new Error(r.error.message);
  const ct=r.result?.content;
  if(Array.isArray(ct))return ct.map(x=>x.type==='text'?x.text:x.type==='image'?`[image ${x.mimeType}]`:JSON.stringify(x)).join('\n');
  return JSON.stringify(r.result,null,2);
}

/* ══ TOOLS ══ */
const projectFiles=()=>S.files.filter(f=>f.projectId===S.activeProject);
const activeSkills=()=>S.skills.filter(s=>s.enabled&&!off().skills.includes(s.id));
const liveConnectors=()=>S.connectors.filter(c=>c.status==='online'&&!off().connectors.includes(c.id));
const BUILTINS=[
 ['web_fetch','Fetch a URL and return readable text.','globe',{type:'object',properties:{url:{type:'string'},max_chars:{type:'number'}},required:['url']}],
 ['run_js','Execute JavaScript in a sandbox and return output.','code',{type:'object',properties:{code:{type:'string'}},required:['code']}],
 ['list_files','List files stored in this project.','file',{type:'object',properties:{}}],
 ['read_file','Read a project file by name.','file',{type:'object',properties:{name:{type:'string'}},required:['name']}],
 ['write_file','Create or overwrite a project file.','save',{type:'object',properties:{name:{type:'string'},content:{type:'string'}},required:['name','content']}],
 ['search_workspace','Search chats, files, skills and snippets.','search',{type:'object',properties:{query:{type:'string'}},required:['query']}],
 ['terminal','Run a Forge terminal command.','term',{type:'object',properties:{command:{type:'string'}},required:['command']}],
 ['spawn_subagent','Delegate a sub-task to a specialist subagent.','agent',{type:'object',properties:{agent:{type:'string'},task:{type:'string'}},required:['task']}],
 ['create_skill','Save a reusable skill from instructions.','skill',{type:'object',properties:{name:{type:'string'},description:{type:'string'},instructions:{type:'string'}},required:['name','instructions']}],
 ['remember','Store a durable note in project knowledge.','brain',{type:'object',properties:{note:{type:'string'}},required:['note']}],
 ['add_task','Add a project task.','bell',{type:'object',properties:{title:{type:'string'},due:{type:'string'}},required:['title']}],
 ['save_snippet','Save a reusable code snippet.','code',{type:'object',properties:{name:{type:'string'},language:{type:'string'},code:{type:'string'}},required:['name','code']}]
];
const READONLY=['list_files','read_file','search_workspace'];
function toolSpecs(){
  const o=off(),out=[];
  BUILTINS.forEach(([n,d,,s])=>{if(!o.tools.includes(n))out.push({type:'function',function:{name:n,description:d,parameters:s}})});
  liveConnectors().forEach(c=>c.tools.forEach(t=>out.push({type:'function',function:{
    name:`mcp__${c.id}__${t.name}`,description:`[${c.name}] ${t.description}`.slice(0,900),parameters:t.schema||{type:'object',properties:{}}}})));
  activeSkills().filter(s=>s.asTool).forEach(s=>out.push({type:'function',function:{name:'skill__'+s.id,
    description:`[Skill] ${s.name}: ${s.description}`.slice(0,900),parameters:{type:'object',properties:{input:{type:'string'}},required:['input']}}}));
  return out;
}
async function runJS(code){
  return new Promise(res=>{
    const f=document.createElement('iframe');f.sandbox='allow-scripts';f.style.display='none';
    const id='r'+Math.random().toString(36).slice(2);
    const html=`<script>const L=[];const c=(...a)=>L.push(a.map(x=>{try{return typeof x==='object'?JSON.stringify(x):String(x)}catch{return String(x)}}).join(' '));
      console.log=c;console.error=c;console.warn=c;console.info=c;
      (async()=>{let r;try{r=await (async()=>{${code}})()}catch(e){c('Error: '+e.message)}
      parent.postMessage({t:'${id}',out:L.join('\\n'),val:r===undefined?'':String(r)},'*')})();<\/script>`;
    const to=setTimeout(()=>{cleanup();res('Timed out after 5s')},5000);
    function h(e){if(e.data&&e.data.t===id){clearTimeout(to);cleanup();res((e.data.out||'')+(e.data.val?'\n→ '+e.data.val:'')||'(no output)')}}
    function cleanup(){window.removeEventListener('message',h);f.remove()}
    window.addEventListener('message',h);f.srcdoc=html;document.body.appendChild(f);
  });
}
async function execTool(name,args){
  const t0=performance.now();
  try{
    let out='';
    if(name==='web_fetch'){const r=await proxyFetch(args.url,{method:'GET'});const txt=await r.text();
      out=txt.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<style[\s\S]*?<\/style>/gi,'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,args.max_chars||6000)}
    else if(name==='run_js')out=await runJS(String(args.code||''));
    else if(name==='list_files')out=projectFiles().map(f=>`${f.name} · ${bytes(f.size)}`).join('\n')||'(no files)';
    else if(name==='read_file'){const f=projectFiles().find(x=>x.name===args.name);out=f?f.content.slice(0,20000):'File not found: '+args.name}
    else if(name==='write_file'){
      const ex=projectFiles().find(x=>x.name===args.name);
      if(ex){ex.content=String(args.content);ex.size=ex.content.length}
      else S.files.push({id:uid(),projectId:S.activeProject,name:String(args.name),type:'text',content:String(args.content),size:String(args.content).length,createdAt:Date.now()});
      saveS();out='Saved '+args.name;renderConsole()}
    else if(name==='search_workspace'){
      const q=String(args.query||'').toLowerCase(),hits=[];
      S.chats.filter(c=>c.projectId===S.activeProject).forEach(c=>{if(c.title.toLowerCase().includes(q))hits.push('chat: '+c.title)});
      projectFiles().forEach(f=>{if((f.name+f.content).toLowerCase().includes(q))hits.push('file: '+f.name)});
      S.skills.forEach(s=>{if((s.name+s.description+s.instructions).toLowerCase().includes(q))hits.push('skill: '+s.name)});
      S.snippets.forEach(s=>{if((s.name+s.code).toLowerCase().includes(q))hits.push('snippet: '+s.name)});
      out=hits.slice(0,40).join('\n')||'No matches.'}
    else if(name==='terminal')out=await termExec(String(args.command||''),true);
    else if(name==='spawn_subagent')out=await runSubagent(args.agent,args.task);
    else if(name==='create_skill'){S.skills.push({id:uid(),name:String(args.name),description:String(args.description||''),
      instructions:String(args.instructions),enabled:true,asTool:false,triggers:[],createdAt:Date.now(),projectId:S.activeProject});
      saveS();paintFoot();out='Skill created: '+args.name}
    else if(name==='remember'){const p=proj();p.agent.knowledge=(p.agent.knowledge||'')+'\n- '+args.note;saveS();out='Noted in project knowledge.'}
    else if(name==='add_task'){S.tasks.push({id:uid(),projectId:S.activeProject,title:String(args.title),due:args.due||'',done:false,createdAt:Date.now()});saveS();out='Task added.'}
    else if(name==='save_snippet'){S.snippets.push({id:uid(),projectId:S.activeProject,name:String(args.name),language:args.language||'text',code:String(args.code),createdAt:Date.now()});saveS();out='Snippet saved.'}
    else if(name.startsWith('mcp__')){const [,cid,...rest]=name.split('__');const c=S.connectors.find(x=>x.id===cid);
      if(!c)throw new Error('Connector missing');out=await mcpCall(c,rest.join('__'),args)}
    else if(name.startsWith('skill__')){const s=S.skills.find(x=>x.id===name.slice(7));if(!s)throw new Error('Skill missing');
      out=`SKILL "${s.name}" ACTIVATED. Follow exactly:\n\n${s.instructions}\n\nINPUT: ${args.input}`}
    else throw new Error('Unknown tool: '+name);
    return {ok:true,out:String(out).slice(0,24000),ms:Math.round(performance.now()-t0)};
  }catch(e){return {ok:false,out:String(e.message||e),ms:Math.round(performance.now()-t0)}}
}

/* ══ STREAM ══ */
function modeParams(m){
  if(m==='fast')return {temperature:.3,reasoning:null,sys:'Answer immediately and concisely. No preamble.'};
  if(m==='think')return {temperature:.6,reasoning:{effort:'high'},sys:'Think step by step before answering. Consider edge cases, then give the verified result.'};
  return {temperature:PF.temp,reasoning:null,sys:''};
}
async function streamChat({messages,tools,mode,signal,onText,onReason}){
  const ep=chatEndpoint(),g=gateway(),model=S.activeModel||g.cfg.model||'';
  if(!model)throw Object.assign(new Error('No model selected. Open the model picker.'),{needs:'model'});
  if(!g.base&&!workerOn())throw Object.assign(new Error('Gateway base URL is empty.'),{needs:'key'});
  if(!g.key&&!g.p.nokey&&!workerOn())throw Object.assign(new Error('No API key for '+g.p.n+'. Add it in Gateways & keys.'),{needs:'key'});
  const mp=modeParams(mode),body={model,messages,stream:PF.stream,temperature:mp.temperature};
  if(PF.maxTok>0)body.max_tokens=PF.maxTok;
  if(tools&&tools.length){body.tools=tools;body.tool_choice='auto';body.parallel_tool_calls=true}
  if(mp.reasoning&&S.activeProvider==='openrouter')body.reasoning=mp.reasoning;
  if(S.activeProvider==='openrouter')body.usage={include:true};
  const r=await fetch(ep.url,{method:'POST',headers:ep.headers,body:JSON.stringify(body),signal});
  if(!r.ok){let m='';try{const j=await r.json();m=j.error?.message||j.message||''}catch{}
    const e=new Error(r.status===401?'Invalid key (401) for '+g.p.n+'.':r.status===429?'Rate limited (429). Retry or switch model.':r.status===402?'Credits required (402). Pick a free model.':(m||'Request failed')+' (HTTP '+r.status+')');
    if(r.status===401||r.status===403)e.needs='key';throw e}
  let content='',reason='',finish='',usage=null;const tc=[];
  if(!PF.stream){const j=await r.json(),ch=j.choices?.[0];
    content=ch?.message?.content||'';reason=ch?.message?.reasoning||ch?.message?.reasoning_content||'';
    if(content)onText(content);if(reason)onReason(reason);
    (ch?.message?.tool_calls||[]).forEach((t,i)=>tc[i]={id:t.id,type:'function',function:{name:t.function.name,arguments:t.function.arguments}});
    return {content,reason,toolCalls:tc.filter(Boolean),finish:ch?.finish_reason||'',usage:j.usage}}
  const rd2=r.body.getReader(),dec=new TextDecoder();let buf='';
  while(true){
    const {done,value}=await rd2.read();if(done)break;
    buf+=dec.decode(value,{stream:true});let i;
    while((i=buf.indexOf('\n'))>=0){
      const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
      if(!line.startsWith('data:'))continue;
      const d=line.slice(5).trim();if(d==='[DONE]')continue;
      try{const j=JSON.parse(d),ch=j.choices?.[0];
        if(ch?.delta?.content){content+=ch.delta.content;onText(ch.delta.content)}
        const rz=ch?.delta?.reasoning||ch?.delta?.reasoning_content;if(rz){reason+=rz;onReason(rz)}
        if(ch?.delta?.tool_calls)ch.delta.tool_calls.forEach(t=>{const k=t.index??0;
          tc[k]=tc[k]||{id:'',type:'function',function:{name:'',arguments:''}};
          if(t.id)tc[k].id=t.id;if(t.function?.name)tc[k].function.name+=t.function.name;
          if(t.function?.arguments)tc[k].function.arguments+=t.function.arguments});
        if(ch?.finish_reason)finish=ch.finish_reason;if(j.usage)usage=j.usage;

    }
  }
  return {content,reason,toolCalls:tc.filter(Boolean),finish,usage};
}

    const fT=()=>{if(buf){out.push({role:'assistant',content:buf});buf=''}};
    const fC=()=>{if(!calls.length)return;fT();
      out.push({role:'assistant',content:null,tool_calls:calls.map(t=>({id:t.id,type:'function',function:{name:t.name,arguments:t.args}}))});
      calls.forEach(t=>out.push({role:'tool',tool_call_id:t.id,content:String(t.result||'').slice(0,12000)}));calls=[]};
    (m.segments||[]).forEach(sg=>{if(sg.type==='text')buf+=sg.text;else if(sg.type==='tool'&&sg.done){fT();calls.push(sg)}});
    fC();if(buf)out.push({role:'assistant',content:buf});
    if(!m.segments&&m.content)out.push({role:'assistant',content:m.content});
  }
  return out;
}

async function agentLoop(c,m,{depth=0,extraSys=''}={}){
  const t0=performance.now();
  m.pending=true;m.error='';m.needs='';m.stopped=false;m.truncated=false;m.segments=m.segments||[];
  m.model=S.activeModel;m.mode=proj().agent.mode||PF.mode;m.toolCount=0;
  if(!nodeOf(m.id))thread.appendChild(msgNode(m,c));else repaint(m,c);
  toEnd(true);
  const st={cid:c.id,ac:new AbortController(),stopped:false,usage:null,raf:0};
  if(depth===0){live=st;turnSteps=[];paintSend();paintState();paintAgentbar()}
  const tools=depth>0?[]:toolSpecs(),maxLoops=depth>0?1:PF.toolLoops;
  let msgs=toApi(c);if(extraSys)msgs[0]={role:'system',content:msgs[0].content+'\n\n'+extraSys};
  let textSeg=null,reasonSeg=null;
  const flush=()=>{st.raf=0;const el=nodeOf(m.id);if(!el)return;
    el.querySelector('.abody').innerHTML=m.segments.map(segHTML).join('')+'<span class="caret"></span>';
    if(near())toEnd();else $('#jump').hidden=false};
  const sched=()=>{if(!st.raf)st.raf=requestAnimationFrame(flush)};
  let problem=null;

    for(let loop=0;loop<maxLoops;loop++){
      if(st.stopped)break;
      textSeg=null;reasonSeg=null;
      setStep(depth?'Subagent thinking':'Thinking · '+m.mode);
      const res=await streamChat({messages:msgs,tools,mode:m.mode,signal:st.ac.signal,
        onText:d=>{if(!textSeg){textSeg={type:'text',text:''};m.segments.push(textSeg)}textSeg.text+=d;setStep('Writing response');sched()},
        onReason:d=>{if(!reasonSeg){reasonSeg={type:'reason',text:''};m.segments.unshift(reasonSeg)}reasonSeg.text+=d;setStep('Reasoning');sched()}});
      if(res.usage)st.usage=res.usage;
      if(res.finish==='length')m.truncated=true;
      if(!res.toolCalls.length)break;
      if(loop===maxLoops-1){m.segments.push({type:'text',text:'\n\n_Tool loop limit reached. Ask me to continue if more steps are needed._'});break}
      const pending=[];

        m.segments.push(seg);m.toolCount++;pending.push(seg)}
      sched();
      msgs.push({role:'assistant',content:res.content||null,tool_calls:res.toolCalls.map(t=>({id:t.id,type:'function',function:{name:t.function.name,arguments:t.function.arguments}}))});
      for(const seg of pending){
        if(st.stopped)break;
        let args={};try{args=JSON.parse(seg.args||'{}')}catch{}
        setStep('Running '+seg.name);
        tput('❯ '+seg.name+' '+JSON.stringify(args).slice(0,160),'cmd');
        if(!PF.autoApprove&&!READONLY.includes(seg.name)){
          const ok=await confirmModal({title:'Approve tool call?',body:`${seg.name}\n\n${JSON.stringify(args,null,2).slice(0,700)}`,ok:'Run tool',danger:false});
          if(!ok){seg.done=true;seg.ok=false;seg.result='Denied by user.';msgs.push({role:'tool',tool_call_id:seg.id,content:'User denied this tool call.'});repaint(m,c);continue}
        }
        const r=await execTool(seg.name,args);
        seg.done=true;seg.ok=r.ok;seg.result=r.out;seg.ms=r.ms;
        tput(r.out.slice(0,1400),r.ok?'ok':'err');
        turnSteps.push({name:seg.name,ok:r.ok,ms:r.ms,at:Date.now()});
        S.runs.unshift({id:uid(),tool:seg.name,ok:r.ok,ms:r.ms,at:Date.now(),args:seg.args.slice(0,400),out:r.out.slice(0,1000),chat:c.id});
        if(S.runs.length>200)S.runs.length=200;
        msgs.push({role:'tool',tool_call_id:seg.id,content:r.out});
        repaint(m,c);paintAgentbar();renderConsole();renderPanel();
      }
      textSeg=null;
    }
  }catch(e){
    if(e?.name==='AbortError'||st.stopped)problem='stopped';
    else{problem=e;m.needs=e?.needs||'';console.error('[forge]',e);tput(String(e.message||e),'err')}
  }
  cancelAnimationFrame(st.raf);
  m.pending=false;m.ms=Math.round(performance.now()-t0);
  const allText=m.segments.filter(s=>s.type==='text').map(s=>s.text).join('');
  m.content=allText;m.tokens=st.usage?.total_tokens||est(allText);
  if(problem==='stopped'){m.stopped=true;if(!allText)m.segments.push({type:'text',text:'_Stopped before output._'})}
  else if(problem)m.error=problem instanceof TypeError?'Network error — check the gateway URL, CORS, or enable the Worker proxy.':String(problem.message||problem).slice(0,400);
  c.updatedAt=Date.now();repaint(m,c);saveS();renderChats();
  if(depth===0){live=null;setStep('Idle · '+(m.toolCount?m.toolCount+' tool calls done':'tools armed'));paintSend();paintState();paintFoot()}
  renderConsole();renderPanel();if(near())toEnd();
  if(PF.autoSpeak&&allText&&depth===0)speak(allText.slice(0,1200));
  return allText;
}

function startTranscribe(){

  micOn=true;$('#btnMic').classList.add('on');$('#recBar').hidden=false;const base=input.value;
  recognizer.onresult=e=>{let fin='',inter='';

    if(fin)input.value=(base+' '+fin).trim()+' ';$('#recTxt').textContent=inter||'Listening…';grow();paintSend()};
  recognizer.onerror=e=>{toast('Mic error: '+e.error,{type:'er'});stopMic()};

async function startRecord(){

    recorder=new MediaRecorder(recStream);recChunks=[];
    recorder.ondataavailable=e=>recChunks.push(e.data);

      attachments.push({kind:'audio',name:'voice-note.webm',data:await readDataURL(blob),size:blob.size});
      paintAtts();recStream.getTracks().forEach(t=>t.stop());recStream=null;toast('Voice note attached.',{type:'ok'})};
    recorder.start();micOn=true;$('#btnMic').classList.add('on');$('#recBar').hidden=false;
    let n=0;const w=$('#wave');w.innerHTML=Array.from({length:14},()=>'<i></i>').join('');const bars=[...w.children];

  }catch(e){toast('Microphone permission denied.',{type:'er'})}
