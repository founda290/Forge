<style>
:root{
  --ui:'Instrument Sans',system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  --r1:8px;--r2:12px;--r3:18px;--r4:24px;--t:130ms;--ease:cubic-bezier(.2,.7,.3,1);
  --rail:58px;--sb:262px;--wp:392px;--bar:54px;--col:820px;--mobnav:0px;
}
html[data-theme=light]{
  --bg:#F5F5F3;--surface:#FFFFFF;--surface2:#FAFAF8;--surface3:#F0EFEC;--surface4:#E7E6E1;
  --line:#E5E4E0;--line2:#D4D3CE;--tx:#1A1A18;--tx2:#5B5B56;--tx3:#76766E;
  --ok:#2E6B4F;--ok-bg:#E9F1EC;--warn:#8A6320;--warn-bg:#F6EFE2;--danger:#A3392F;--danger-bg:#F8E9E7;--info:#2C5A8A;--info-bg:#E9EFF6;
  --sh1:0 1px 2px rgba(26,26,24,.05);--sh2:0 2px 8px rgba(26,26,24,.06),0 12px 32px rgba(26,26,24,.06);
  --sh3:0 24px 70px rgba(26,26,24,.18);--scrim:rgba(26,26,24,.42);--code:#FBFAF8;
}
html[data-theme=dark]{
  --bg:#111214;--surface:#17181B;--surface2:#1D1F23;--surface3:#25272C;--surface4:#2F3238;
  --line:#2A2C31;--line2:#3B3E45;--tx:#EDEDEB;--tx2:#A9A9A4;--tx3:#8A8A85;
  --ok:#74BE97;--ok-bg:#17281F;--warn:#D3A85F;--warn-bg:#2A2317;--danger:#E08A80;--danger-bg:#2C1B19;--info:#8FB2D8;--info-bg:#18222C;
  --sh1:0 1px 2px rgba(0,0,0,.3);--sh2:0 2px 10px rgba(0,0,0,.35),0 16px 40px rgba(0,0,0,.3);
  --sh3:0 28px 80px rgba(0,0,0,.62);--scrim:rgba(6,7,8,.68);--code:#131417;
}
html[data-theme=light][data-accent=pine]{--ac:#1F5E52;--ac-ink:#FFF;--ac-bg:#E8F0EE;--ac-line:#B8CFC9;--ac-hi:#184C42;}
html[data-theme=light][data-accent=slate]{--ac:#3A4E6B;--ac-ink:#FFF;--ac-bg:#EAEEF4;--ac-line:#BFC9D8;--ac-hi:#2E3F58;}
html[data-theme=light][data-accent=clay]{--ac:#8A5A3B;--ac-ink:#FFF;--ac-bg:#F3ECE5;--ac-line:#DCC6B2;--ac-hi:#71482E;}
html[data-theme=dark][data-accent=pine]{--ac:#79B8A9;--ac-ink:#0B1614;--ac-bg:#182523;--ac-line:#2E4441;--ac-hi:#8FCBBC;}
html[data-theme=dark][data-accent=slate]{--ac:#93A9C9;--ac-ink:#0C121C;--ac-bg:#1A2130;--ac-line:#313D52;--ac-hi:#A6BBD8;}
html[data-theme=dark][data-accent=clay]{--ac:#C79A76;--ac-ink:#1A1209;--ac-bg:#271E16;--ac-line:#463628;--ac-hi:#D6AC8A;}
html[data-density=compact]{--bar:48px;--col:880px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:var(--ui);background:var(--bg);color:var(--tx);line-height:1.6;height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--ac);text-underline-offset:3px}
::selection{background:var(--ac-bg);color:var(--tx)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:5px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:3px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:var(--ac);background-clip:padding-box}
*::-webkit-scrollbar-corner{background:transparent}
.i{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.i.s{width:14px;height:14px}.i.l{width:20px;height:20px}
.mono{font-family:var(--mono)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:34px;padding:6px 13px;border:1px solid var(--line2);
  border-radius:var(--r1);background:var(--surface);color:var(--tx);font-size:.8125rem;font-weight:500;cursor:pointer;
  transition:background var(--t),border-color var(--t),color var(--t);white-space:nowrap}
.btn:hover:not(:disabled){background:var(--surface3);border-color:var(--tx3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.p{background:var(--ac);border-color:var(--ac);color:var(--ac-ink);font-weight:600}
.btn.p:hover:not(:disabled){background:var(--ac-hi);border-color:var(--ac-hi)}
.btn.q{background:transparent;border-color:transparent;color:var(--tx2)}
.btn.q:hover:not(:disabled){background:var(--surface3);color:var(--tx)}
.btn.d{background:var(--danger-bg);border-color:color-mix(in srgb,var(--danger) 32%,transparent);color:var(--danger)}
.btn.d:hover:not(:disabled){border-color:var(--danger)}
.btn.ic{width:34px;height:34px;padding:0}
.btn.sm{min-height:28px;padding:3px 9px;font-size:.75rem}
.btn.full{width:100%}
.ring{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
input[type=text],input[type=password],input[type=url],input[type=number],input[type=email],textarea{
  background:var(--surface);border:1px solid var(--line2);border-radius:var(--r1);padding:8px 11px;font-size:.8125rem;width:100%;min-width:0;
  transition:border-color var(--t),box-shadow var(--t)}
input:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-bg)}
input::placeholder,textarea::placeholder{color:var(--tx3)}
textarea{resize:vertical;line-height:1.6}
input[type=range]{accent-color:var(--ac);cursor:pointer;height:20px;width:100%}
input[type=checkbox]{accent-color:var(--ac);width:15px;height:15px;cursor:pointer;flex:none}
input[type=color]{width:34px;height:30px;padding:2px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);cursor:pointer;flex:none}
.lbl{display:block;font-size:.6875rem;font-weight:600;color:var(--tx3);margin-bottom:5px}
.field{min-width:0}
.help{font-size:.75rem;color:var(--tx3);line-height:1.7;overflow-wrap:anywhere}
.help code{font-family:var(--mono);background:var(--surface3);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:.9em;color:var(--tx2)}
.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.grid{display:grid;gap:11px;min-width:0}
.g2{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.chk{display:flex;align-items:center;gap:8px;font-size:.8125rem;color:var(--tx2);cursor:pointer;min-width:0}
.tag{font-family:var(--mono);font-size:.625rem;color:var(--tx2);background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;white-space:nowrap}
.tag.ac{color:var(--ac);background:var(--ac-bg);border-color:var(--ac-line)}
.tag.ok{color:var(--ok);background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 28%,transparent)}
.tag.wa{color:var(--warn);background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 28%,transparent)}
.tag.er{color:var(--danger);background:var(--danger-bg);border-color:color-mix(in srgb,var(--danger) 28%,transparent)}
.tag.in{color:var(--info);background:var(--info-bg);border-color:color-mix(in srgb,var(--info) 28%,transparent)}
.note{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r1);padding:10px 12px;font-size:.75rem;
  line-height:1.65;background:var(--surface);color:var(--tx2);overflow-wrap:anywhere}
.note .i{margin-top:2px;color:var(--tx3)}
.note.ok{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 28%,transparent);color:var(--ok)}.note.ok .i{color:var(--ok)}
.note.er{background:var(--danger-bg);border-color:color-mix(in srgb,var(--danger) 28%,transparent);color:var(--danger)}.note.er .i{color:var(--danger)}
.note.wa{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 28%,transparent);color:var(--warn)}.note.wa .i{color:var(--warn)}
.note.in{background:var(--info-bg);border-color:color-mix(in srgb,var(--info) 28%,transparent);color:var(--info)}.note.in .i{color:var(--info)}
.seg{display:inline-flex;gap:2px;padding:2px;background:var(--surface3);border:1px solid var(--line);border-radius:10px;flex:none}
.seg button{display:flex;align-items:center;gap:6px;border:none;background:transparent;color:var(--tx2);font-size:.75rem;font-weight:500;
  padding:5px 10px;border-radius:8px;cursor:pointer;min-height:28px;transition:background var(--t),color var(--t)}
.seg button:hover{color:var(--tx)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ac);font-weight:600;box-shadow:var(--sh1)}
.sw{position:relative;width:34px;height:19px;border-radius:999px;background:var(--surface4);border:1px solid var(--line2);cursor:pointer;flex:none;transition:background var(--t),border-color var(--t)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--tx3);transition:transform var(--t) var(--ease),background var(--t)}
.sw[aria-checked=true]{background:var(--ac-bg);border-color:var(--ac-line)}
.sw[aria-checked=true]::after{transform:translateX(15px);background:var(--ac)}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.8125rem;color:var(--tx2)}
.sel{position:relative;min-width:0;width:100%}
.sel-btn{display:flex;align-items:center;gap:8px;width:100%;min-height:34px;padding:7px 11px;background:var(--surface);
  border:1px solid var(--line2);border-radius:var(--r1);cursor:pointer;font-size:.8125rem;text-align:left;transition:border-color var(--t)}
.sel-btn:hover{border-color:var(--tx3)}
.sel-btn span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel-btn .i{color:var(--tx3)}
.sel-pop{position:fixed;z-index:900;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r2);box-shadow:var(--sh3);
  padding:5px;overflow:auto;min-width:160px;animation:pop .12s var(--ease)}
@keyframes pop{from{opacity:0}to{opacity:1}}
.sel-pop input{margin-bottom:5px}
.sel-opt{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;cursor:pointer;font-size:.8125rem;color:var(--tx)}
.sel-opt:hover,.sel-opt.hi{background:var(--surface3)}
.sel-opt.on{background:var(--ac-bg);color:var(--ac);font-weight:600}
.sel-opt small{margin-left:auto;color:var(--tx3);font-family:var(--mono);font-size:.625rem}
.shell{display:grid;grid-template-columns:var(--rail) var(--sb) minmax(0,1fr);height:100dvh;overflow:hidden}
html[data-panel=open] .shell{grid-template-columns:var(--rail) var(--sb) minmax(0,1fr) var(--wp)}
.rail{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;background:var(--surface2);border-right:1px solid var(--line);z-index:30;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.rail::-webkit-scrollbar{width:4px}
.rail .logo{width:32px;height:32px;border-radius:9px;background:var(--ac);color:var(--ac-ink);display:grid;place-items:center;margin-bottom:8px;flex:none}
.rail .logo svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.3;fill:none}
.rbtn{width:38px;height:38px;display:grid;place-items:center;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--tx3);cursor:pointer;position:relative;flex:none;transition:background var(--t),color var(--t)}
.rbtn:hover{background:var(--surface3);color:var(--tx)}
.rbtn.on{background:var(--ac-bg);border-color:var(--ac-line);color:var(--ac)}
.rbtn .badge{position:absolute;top:3px;right:3px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--ac);color:var(--ac-ink);font-family:var(--mono);font-size:.5rem;display:grid;place-items:center;font-weight:600}
.rail .sp{flex:1}
.sidebar{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--surface2);border-right:1px solid var(--line)}
.sb-top{padding:11px 12px;display:flex;flex-direction:column;gap:9px;border-bottom:1px solid var(--line)}
.proj-btn{display:flex;align-items:center;gap:9px;flex:1;min-width:0;padding:8px 10px;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r1);cursor:pointer;text-align:left;transition:border-color var(--t)}
.proj-btn:hover{border-color:var(--ac)}
.proj-dot{width:9px;height:9px;border-radius:3px;flex:none;background:var(--ac)}
.proj-btn b{flex:1;min-width:0;font-size:.8125rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-search{position:relative}
.sb-search .i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--tx3);pointer-events:none}
.sb-search input{padding-left:32px}
.sb-tools{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.6875rem;font-weight:500;color:var(--tx2);cursor:pointer;min-height:27px;display:inline-flex;align-items:center;gap:5px;transition:background var(--t),color var(--t),border-color var(--t)}
.chip:hover{background:var(--surface3)}
.chip[aria-pressed=true]{background:var(--ac-bg);border-color:var(--ac-line);color:var(--ac)}
.list{flex:1;min-height:0;overflow-y:auto;scrollbar-gutter:stable;padding:4px 8px 12px}
.grp{font-size:.625rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);padding:11px 8px 4px}
.crow{display:flex;gap:7px;align-items:flex-start;padding:8px 9px;border-radius:var(--r1);cursor:pointer;border:1px solid transparent;transition:background var(--t)}
.crow:hover{background:var(--surface3)}
.crow.on{background:var(--surface);border-color:var(--line)}
.crow.sel{background:var(--ac-bg);border-color:var(--ac-line)}
.cmain{flex:1;min-width:0}
.ctitle{font-size:.8125rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cprev{font-size:.6875rem;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cacts{display:flex;gap:1px;opacity:0;transition:opacity var(--t)}
.crow:hover .cacts,.crow:focus-within .cacts{opacity:1}
.cacts button{width:23px;height:23px;display:grid;place-items:center;border:none;background:none;border-radius:6px;color:var(--tx3);cursor:pointer}
.cacts button:hover{background:var(--surface4);color:var(--tx)}
.cacts button.on{color:var(--warn)}.cacts button.on .i{fill:currentColor}
.cacts button[data-a=del]:hover{color:var(--danger)}
.empty-list{padding:28px 14px;text-align:center;color:var(--tx3);font-size:.75rem;line-height:1.8}
.sb-foot{border-top:1px solid var(--line);padding:9px 12px;display:flex;flex-direction:column;gap:6px}
.foot{display:flex;align-items:center;gap:7px;font-size:.6875rem;color:var(--tx3);min-width:0}
.foot span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--tx3);flex:none}
.dot.ok{background:var(--ok)}.dot.wa{background:var(--warn)}.dot.er{background:var(--danger)}.dot.live{background:var(--ac)}
.scrim2{position:fixed;inset:0;background:var(--scrim);z-index:60;opacity:0;pointer-events:none;transition:opacity var(--t)}
.scrim2.on{opacity:1;pointer-events:auto}
.main{display:grid;grid-template-rows:var(--bar) minmax(0,1fr) auto;min-width:0;min-height:0;background:var(--bg);overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);min-width:0}
.bar-t{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.bar-t .ttl{font-size:.875rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bar-r{display:flex;align-items:center;gap:3px;flex:none}
.state{display:flex;align-items:center;gap:6px;font-size:.6875rem;color:var(--tx2);background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap;flex:none}
.stage{overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;min-height:0;display:flex;flex-direction:column;overscroll-behavior:contain}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 20px 34px;gap:20px;min-height:100%}
.hero-in{width:100%;max-width:var(--col);display:flex;flex-direction:column;gap:18px;min-width:0}
.greet{text-align:center;display:flex;flex-direction:column;gap:7px;align-items:center}
.greet h1{font-size:clamp(1.55rem,4vw,2.2rem);font-weight:600;letter-spacing:-.025em;line-height:1.2}
.greet h1 em{font-style:normal;color:var(--ac)}
.greet p{color:var(--tx2);font-size:.9375rem;max-width:52ch}
.hero-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:9px}
.hcard{display:flex;flex-direction:column;gap:5px;padding:12px 13px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);cursor:pointer;text-align:left;transition:border-color var(--t),background var(--t);min-width:0}
.hcard:hover{border-color:var(--ac-line);background:var(--ac-bg)}
.hcard .i{color:var(--ac)}
.hcard b{font-size:.8125rem;font-weight:600}
.hcard small{font-size:.6875rem;color:var(--tx3);line-height:1.5}
.thread{width:100%;max-width:var(--col);margin:0 auto;padding:22px 20px 26px;display:flex;flex-direction:column;gap:22px;min-width:0}
.msg{display:flex;flex-direction:column;gap:6px;animation:fade .18s var(--ease) both;min-width:0}
@keyframes fade{from{opacity:0}to{opacity:1}}
.msg.user{align-items:flex-end}
.mhead{display:flex;align-items:center;gap:8px;font-size:.625rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3)}
.mhead .i{color:var(--ac)}
.ubody{max-width:88%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);border-bottom-right-radius:6px;padding:11px 15px;box-shadow:var(--sh1);min-width:0}
.abody{min-width:0;display:flex;flex-direction:column;gap:10px}
.md{font-size:1rem;line-height:1.78;overflow-wrap:anywhere;word-break:break-word;min-width:0}
html[data-density=compact] .md{font-size:.9375rem;line-height:1.7}
.md p{margin:0 0 .8em}.md p:last-child{margin-bottom:0}
.md h3,.md h4,.md h5{margin:1.1em 0 .45em;line-height:1.3;font-weight:600}
.md h3{font-size:1.08rem}.md h4{font-size:1rem}.md h5{font-size:.9375rem}
.md ul,.md ol{margin:.45em 0 .85em;padding-left:1.35em}.md li{margin:.25em 0}
.md blockquote{border-left:2px solid var(--ac-line);padding-left:1em;color:var(--tx2);margin:.6em 0}
.md hr{border:none;border-top:1px solid var(--line);margin:1.1em 0}
.md :not(pre)>code{font-family:var(--mono);font-size:.82em;background:var(--surface3);border:1px solid var(--line);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
.md a{overflow-wrap:anywhere}
.tbl{overflow-x:auto;margin:.8em 0;border:1px solid var(--line);border-radius:var(--r2);max-width:100%}
.md table{border-collapse:collapse;width:100%;font-size:.8125rem}
.md th,.md td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:left}

    transition:transform var(--t) var(--ease),visibility var(--t);box-shadow:var(--sh3);border-right:1px solid var(--line2)}
  .sidebar.on{transform:none;visibility:visible}
  #sbClose{display:grid}
  #projTag{display:none}
  .cacts{opacity:1}
}
@media (max-width:900px){
  .seg button span{display:none}
  .seg button{padding:5px 8px}
}
@media (max-width:760px){
  :root{--rail:0px;--bar:50px;--mobnav:56px}
  .shell,html[data-panel=open] .shell{grid-template-columns:minmax(0,1fr);padding-bottom:calc(var(--mobnav) + env(safe-area-inset-bottom))}
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;height:calc(var(--mobnav) + env(safe-area-inset-bottom));flex-direction:row;align-items:center;
    gap:2px;padding:4px 8px calc(4px + env(safe-area-inset-bottom));border-right:none;border-top:1px solid var(--line);overflow-x:auto;overflow-y:hidden;z-index:40;scrollbar-width:thin}
  .rail::-webkit-scrollbar{height:4px;width:4px}
  .rail .logo,.rail .sp{display:none}
  .rbtn{width:40px;height:40px}
  .sidebar{width:min(320px,92vw)}
  .panel{width:100vw;left:0;right:0;border-left:none}
  .bar{padding:0 8px;gap:5px}
  .state .st{display:none}
  .state{padding:4px 7px}
  .hero{padding:18px 13px 26px;gap:16px}
  .hero-cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .hcard{padding:10px 11px}
  .hcard small{font-size:.625rem}
  .thread{padding:16px 13px 22px;gap:18px}
  .dock{padding:9px 11px 10px}
  .composer{padding:11px 12px 9px;border-radius:19px}
  .ubody{max-width:94%}
  .macts{opacity:1}
  .hintrow .k{display:none}
  .ctools{gap:6px}
  .toasts{top:auto;bottom:calc(var(--mobnav) + 118px + env(safe-area-inset-bottom));left:10px;right:10px;max-width:none}
  .mroot{padding:10px}
  .mcard{max-height:calc(100dvh - 20px);border-radius:var(--r3)}
  .mcard.full{height:calc(100dvh - 20px)}
  .mhead{padding:12px 14px}
  .mbody{padding:13px 14px}
  .mfoot{padding:10px 14px}
  .split{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .split-l{border-right:none;border-bottom:1px solid var(--line);flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:8px;scrollbar-width:none}
  .split-l::-webkit-scrollbar{display:none}
  .catbtn{width:auto;white-space:nowrap}
  .catbtn small{display:none}
  .split-r{padding:12px 13px}
  .pgrid{grid-template-columns:1fr}
  .palette{padding:8vh 10px 10px}
  #vBody{overflow:auto}
  .canvas-wrap{flex:none;height:44vh;min-height:240px}
  .board{flex:none;height:50vh;min-height:280px}
  .bitem .bx{opacity:1}
  .msgimgs img{max-width:100%}
}
@media (max-width:480px){
  .bar .btn.ic{width:32px;height:32px}
  .bar-r{gap:1px}
  .greet p{font-size:.875rem}
  .stats{grid-template-columns:1fr 1fr}
  .mfoot{font-size:.6875rem}
}
@media (max-height:560px) and (min-width:761px){
  .rail{gap:2px;padding:6px 0}
  .rbtn{width:34px;height:34px}
  .rail .logo{margin-bottom:4px}
}
html[data-focus=on] .shell{grid-template-columns:minmax(0,1fr);padding-bottom:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

    $('#selHost').appendChild(pop);openSel=pop;

    opts.forEach(o=>o.onclick=()=>pick(o.dataset.v));
    const si=pop.querySelector('input');
    if(si){si.focus();si.oninput=()=>{const q=si.value.toLowerCase();opts.forEach(o=>{o.hidden=!o.textContent.toLowerCase().includes(q)})}}

      if(ev.key==='ArrowUp'){ev.preventDefault();i=Math.max(0,i-1);vis.forEach(o=>o.classList.remove('hi'));vis[i]?.classList.add('hi');vis[i]?.scrollIntoView({block:'nearest'})}

function codeBox(lang,code){
  const l=/^[a-z0-9+#.-]{1,20}$/i.test(lang||'')?lang.toLowerCase():'';
  return `<div class="code"><div class="codebar"><span>${esc(l||'text')}</span><button class="cbtn" data-cc>${I('copy')}Copy</button>${l==='js'||l==='javascript'?`<button class="cbtn" data-run>${I('play')}Run</button>`:''}</div><pre><code${l?` class="language-${l}"`:''}>${esc(code)}</code></pre></div>`;
}
function inl(t){
  const cs=[];t=t.replace(/`([^`\n]+)`/g,(_,c)=>{cs.push(c);return `\u0001C${cs.length-1}\u0001`});
  t=t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,x,u)=>/^(https?:\/\/|mailto:)/i.test(u)?`<a href="${u}" target="_blank" rel="noopener noreferrer">${x}</a>`:m);
  t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  t=t.replace(/(?<![\w])_([^_\n]+)_(?![\w])/g,'<em>$1</em>').replace(/~~([^~]+)~~/g,'<del>$1</del>');
  return t.replace(/\u0001C(\d+)\u0001/g,(_,i)=>`<code>${cs[+i]}</code>`);
}
function md(src){
  src=String(src||'').replace(/[\u0000\u0001]/g,'');const boxes=[];
  let t=src.replace(/```([^\n`]*)\n?([\s\S]*?)```/g,(_,l,c)=>{boxes.push(codeBox(l.trim(),c.replace(/\n$/,'')));return `\u0001B${boxes.length-1}\u0001`});
  t=t.replace(/```([^\n`]*)\n?([\s\S]*)$/,(_,l,c)=>{boxes.push(codeBox(l.trim(),c));return `\u0001B${boxes.length-1}\u0001`});
  t=esc(t);const L=t.split('\n'),out=[];let p=[],li=null,q=[];
  const fp=()=>{if(p.length){out.push('<p>'+inl(p.join('<br>'))+'</p>');p=[]}};
  const fl=()=>{if(li){out.push(`<${li.t}>`+li.i.map(x=>'<li>'+inl(x)+'</li>').join('')+`</${li.t}>`);li=null}};
  const fq=()=>{if(q.length){out.push('<blockquote>'+inl(q.join('<br>'))+'</blockquote>');q=[]}};
  const fa=()=>{fp();fl();fq()};
  for(let i=0;i<L.length;i++){
    const s=L[i].trim();if(!s){fa();continue}
    if(/^\u0001B\d+\u0001$/.test(s)){fa();out.push(s);continue}
    const h=s.match(/^(#{1,4})\s+(.*)$/);if(h){fa();const v=Math.min(h[1].length+2,5);out.push(`<h${v}>`+inl(h[2])+`</h${v}>`);continue}
    if(/^(-{3,}|\*{3,})$/.test(s)){fa();out.push('<hr>');continue}
    if(s.startsWith('&gt;')){fp();fl();q.push(s.replace(/^&gt;\s?/,''));continue}
    if(s.startsWith('|')&&i+1<L.length&&/^\|?[\s:|-]+\|[\s:|-]*$/.test(L[i+1].trim())){
      fa();const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>inl(c.trim()));const head=cells(s);i++;const rows=[];
      while(i+1<L.length&&L[i+1].trim().startsWith('|'))rows.push(cells(L[++i]));
      out.push('<div class="tbl"><table><thead><tr>'+head.map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>');continue}
    const m=s.match(/^([-*+]|\d+\.)\s+(.*)$/);
    if(m){fp();fq();const tag=/^\d/.test(m[1])?'ol':'ul';if(!li||li.t!==tag){fl();li={t:tag,i:[]}}li.i.push(m[2]);continue}
    fl();fq();p.push(s);
  }
  fa();return out.join('\n').replace(/\u0001B(\d+)\u0001/g,(_,i)=>boxes[+i]);
}

      body:JSON.stringify({url:srv.url,payload:body,headers}),signal:AbortSignal.timeout(45000)});

    for(const l of lines){try{const j=JSON.parse(l.slice(5).trim());if(j.id===body.id)return j}catch{}}

async function mcpConnect(srv){
  srv.status='connecting';renderPanel();
  try{
    const init=await mcpRPC(srv,'initialize',{protocolVersion:'2024-11-05',capabilities:{tools:{},resources:{},prompts:{}},clientInfo:{name:'Forge Studio',version:'1.0'}});
    if(init.error)throw new Error(init.error.message);
    srv.info=init.result?.serverInfo||{name:srv.name};
    srv.caps=init.result?.capabilities||{};
    try{await mcpRPC(srv,'notifications/initialized',{},true)}catch{}
    const tl=await mcpRPC(srv,'tools/list',{});
    if(tl.error)throw new Error(tl.error.message);
    srv.tools=(tl.result?.tools||[]).map(t=>({name:t.name,description:t.description||'',schema:t.inputSchema||{type:'object',properties:{}}}));
    try{const rl=await mcpRPC(srv,'resources/list',{});srv.resources=rl.result?.resources||[]}catch{srv.resources=[]}
    srv.status='online';srv.error='';srv.connectedAt=Date.now();
    toast(`${srv.name}: ${srv.tools.length} tools online`,{type:'ok'});
  }catch(e){srv.status='error';srv.error=String(e.message||e);toast(`${srv.name}: ${srv.error}`,{type:'er',timeout:7000})}
  saveS();renderPanel();paintFoot();
  return srv.status==='online';
}
async function mcpCall(srv,tool,args){
  const r=await mcpRPC(srv,'tools/call',{name:tool,arguments:args||{}});
  if(r.error)throw new Error(r.error.message);
  const c=r.result?.content;
  if(Array.isArray(c))return c.map(x=>x.type==='text'?x.text:x.type==='image'?`[image ${x.mimeType}]`:JSON.stringify(x)).join('\n');
  return JSON.stringify(r.result,null,2);
}

async function conFetch(con,path,opts={}){
  const t=conType(con.type);
  let url,headers={...(opts.headers||{})};
  if(con.type==='github'){url='https://api.github.com'+path;headers.Authorization='Bearer '+con.cfg.token;headers.Accept='application/vnd.github+json'}
  else if(con.type==='gmail'){url='https://gmail.googleapis.com/gmail/v1/users/me'+path;headers.Authorization='Bearer '+con.cfg.token}
  else if(con.type==='notion'){url='https://api.notion.com'+path;headers.Authorization='Bearer '+con.cfg.token;headers['Notion-Version']='2022-06-28'}
  else if(con.type==='slack'){url='https://slack.com/api'+path;headers.Authorization='Bearer '+con.cfg.token}
  else if(con.type==='supabase'){url=con.cfg.url.replace(/\/+$/,'')+'/rest/v1'+path;headers.apikey=con.cfg.token;headers.Authorization='Bearer '+con.cfg.token}
  else if(con.type==='cloudflare'){url='https://api.cloudflare.com/client/v4'+path;headers.Authorization='Bearer '+con.cfg.token}
  else if(con.type==='linear'){url='https://api.linear.app/graphql';headers.Authorization=con.cfg.token}
  else{url=(con.cfg.url||'').replace(/\/+$/,'')+path;if(con.cfg.token)headers.Authorization='Bearer '+con.cfg.token}
  if(opts.body&&!headers['Content-Type'])headers['Content-Type']='application/json';
  const r=await proxyFetch(url,{method:opts.method||'GET',headers,body:opts.body?JSON.stringify(opts.body):null});
  const txt=await r.text();
  if(!r.ok)throw new Error(`${t.n} ${r.status}: ${txt.slice(0,200)}`);
  try{return JSON.parse(txt)}catch{return txt}
}

async function runJS(code){
  return new Promise(res=>{
    const f=document.createElement('iframe');f.sandbox='allow-scripts';f.style.display='none';
    const id='r'+Math.random().toString(36).slice(2);
    const html=`<script>const L=[];const c=(...a)=>L.push(a.map(x=>{try{return typeof x==='object'?JSON.stringify(x):String(x)}catch{return String(x)}}).join(' '));
      console.log=c;console.error=c;console.warn=c;console.info=c;
      (async()=>{let r;try{r=await (async()=>{${code}})()}catch(e){c('Error: '+e.message)}
      parent.postMessage({t:'${id}',out:L.join('\\n'),val:r===undefined?'':String(r)},'*')})();<\/script>`;
    const to=setTimeout(()=>{cleanup();res('Timed out after 5s')},5000);
    function h(e){if(e.data&&e.data.t===id){clearTimeout(to);cleanup();res((e.data.out||'')+(e.data.val?'\n→ '+e.data.val:'')||'(no output)')}}
    function cleanup(){window.removeEventListener('message',h);f.remove()}
    window.addEventListener('message',h);f.srcdoc=html;document.body.appendChild(f);
  });
}
async function execTool(name,args,ctx){

    }

    else if(name==='list_files')out=projectFiles().map(f=>`${f.name} · ${bytes(f.size)} · ${f.type}`).join('\n')||'(no files)';
    else if(name==='read_file'){const f=projectFiles().find(x=>x.name===args.name);out=f?f.content.slice(0,20000):'File not found: '+args.name}
    else if(name==='write_file'){

      projectFiles().forEach(f=>{if(f.name.toLowerCase().includes(q)||f.content.toLowerCase().includes(q))hits.push('file: '+f.name)});
      S.skills.forEach(s=>{if((s.name+s.description+s.instructions).toLowerCase().includes(q))hits.push('skill: '+s.name)});
      S.snippets.forEach(s=>{if((s.name+s.code).toLowerCase().includes(q))hits.push('snippet: '+s.name)});
      out=hits.slice(0,40).join('\n')||'No matches.';
    }
    else if(name==='terminal')out=await termExec(String(args.command||''),true);
    else if(name==='spawn_subagent')out=await runSubagent(args.agent,args.task,ctx);
    else if(name==='create_skill'){
      S.skills.push({id:uid(),name:String(args.name),description:String(args.description||''),instructions:String(args.instructions),enabled:true,asTool:false,triggers:[],createdAt:Date.now(),projectId:S.activeProject});
      saveS();paintFoot();out='Skill created: '+args.name;
    }
    else if(name==='remember'){const p=proj();p.agent.knowledge=(p.agent.knowledge||'')+'\n- '+args.note;saveS();out='Noted in project knowledge.'}

    else if(name==='save_snippet'){S.snippets.push({id:uid(),projectId:S.activeProject,name:String(args.name),language:args.language||'text',code:String(args.code),createdAt:Date.now()});saveS();out='Snippet saved.'}
    else if(name.startsWith('mcp__')){
      const [,sid,...rest]=name.split('__');const srv=S.mcp.find(m=>m.id===sid);
      if(!srv)throw new Error('MCP server missing');
      out=await mcpCall(srv,rest.join('__'),args);
    }
    else if(name.startsWith('gh__')){
      const [,cid,act]=name.split('__');const con=S.connectors.find(c=>c.id===cid);if(!con)throw new Error('Connector missing');
      const owner=args.owner||con.cfg.owner||'';
      if(act==='list_repos'){const r=await conFetch(con,owner?`/users/${owner}/repos?per_page=30`:'/user/repos?per_page=30');out=r.map(x=>`${x.full_name} ★${x.stargazers_count} ${x.language||''}`).join('\n')}
      else if(act==='get_file'){const r=await conFetch(con,`/repos/${owner||con.cfg.owner}/${args.repo}/contents/${args.path}${args.ref?'?ref='+args.ref:''}`);out=r.content?atob(r.content.replace(/\n/g,'')):JSON.stringify(r).slice(0,4000)}
      else if(act==='create_issue'){const r=await conFetch(con,`/repos/${owner||con.cfg.owner}/${args.repo}/issues`,{method:'POST',body:{title:args.title,body:args.body||''}});out='Issue #'+r.number+' '+r.html_url}
      else{const r=await conFetch(con,'/search/code?q='+encodeURIComponent(args.q));out=(r.items||[]).slice(0,15).map(x=>x.repository.full_name+' / '+x.path).join('\n')}
    }
    else if(name.startsWith('mail__')){
      const [,cid,act]=name.split('__');const con=S.connectors.find(c=>c.id===cid);if(!con)throw new Error('Connector missing');
      if(act==='list'){const r=await conFetch(con,`/messages?q=${encodeURIComponent(args.q||'')}&maxResults=${args.max||10}`);
        const ids=(r.messages||[]).map(m=>m.id);const det=[];
        for(const id of ids.slice(0,10)){const m=await conFetch(con,'/messages/'+id+'?format=metadata&metadataHeaders=Subject&metadataHeaders=From');
          const h=m.payload?.headers||[];det.push(`${id} · ${h.find(x=>x.name==='From')?.value||''} · ${h.find(x=>x.name==='Subject')?.value||''}`)}
        out=det.join('\n')||'No messages.'}
      else if(act==='read'){const m=await conFetch(con,'/messages/'+args.id+'?format=full');
        const part=m.payload?.parts?.find(p=>p.mimeType==='text/plain')||m.payload;
        out=(part?.body?.data?decodeURIComponent(escape(atob(part.body.data.replace(/-/g,'+').replace(/_/g,'/')))):m.snippet||'').slice(0,8000)}
      else{const raw=`To: ${args.to}\r\nSubject: ${args.subject}\r\nContent-Type: text/plain; charset=UTF-8\r\n\r\n${args.body}`;
        const b64=btoa(unescape(encodeURIComponent(raw))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
        const r=await conFetch(con,'/messages/send',{method:'POST',body:{raw:b64}});out='Sent id '+r.id}
    }
    else if(name.startsWith('rest__')){
      const cid=name.split('__')[1];const con=S.connectors.find(c=>c.id===cid);if(!con)throw new Error('Connector missing');
      const r=await conFetch(con,args.path,{method:args.method||'GET',body:args.body});out=typeof r==='string'?r.slice(0,8000):JSON.stringify(r,null,2).slice(0,8000);
    }
    else if(name.startsWith('skill__')){
      const s=S.skills.find(x=>x.id===name.slice(7));if(!s)throw new Error('Skill missing');
      out=`SKILL "${s.name}" ACTIVATED. Follow these instructions exactly:\n\n${s.instructions}\n\nINPUT: ${args.input}`;
    }
    else throw new Error('Unknown tool: '+name);
    return {ok:true,out:String(out).slice(0,24000),ms:Math.round(performance.now()-t0)};
  }catch(e){return {ok:false,out:String(e.message||e),ms:Math.round(performance.now()-t0)}}
}

function modeParams(mode){
  if(mode==='fast')return {temperature:.3,reasoning:null,sys:'Answer immediately and concisely. No preamble.'};
  if(mode==='think')return {temperature:.6,reasoning:{effort:'high'},sys:'Think carefully step by step before answering. Consider edge cases, then give the verified result.'};
  return {temperature:PF.temp,reasoning:null,sys:''};
}
async function streamChat({messages,tools,mode,signal,onText,onReason}){
  const ep=chatEndpoint();const g=gateway();
  const model=S.activeModel||(g.cfg&&g.cfg.model)||'';
  if(!model)throw Object.assign(new Error('No model selected. Open the model picker.'),{needs:'model'});
  if(!g.base&&!workerOn())throw Object.assign(new Error('Gateway base URL is empty. Configure it in Gateways & keys.'),{needs:'key'});
  if(!g.key&&!g.p.nokey&&!workerOn())throw Object.assign(new Error('No API key for '+g.p.n+'. Add it in Gateways & keys (BYOK).'),{needs:'key'});
  const mp=modeParams(mode);
  const body={model,messages,stream:PF.stream,temperature:mp.temperature};
  if(PF.maxTok>0)body.max_tokens=PF.maxTok;
  if(tools&&tools.length){body.tools=tools;body.tool_choice='auto'}
  if(mp.reasoning&&S.activeProvider==='openrouter')body.reasoning=mp.reasoning;
  if(S.activeProvider==='openrouter')body.usage={include:true};
  const r=await fetch(ep.url,{method:'POST',headers:ep.headers,body:JSON.stringify(body),signal});
  if(!r.ok){
    let m='';try{const j=await r.json();m=j.error?.message||j.message||''}catch{try{m=(await r.text()).slice(0,200)}catch{}}
    const e=new Error(r.status===401?'Invalid key (401) for '+g.p.n+'.':r.status===429?'Rate limited (429). Retry or switch model.':r.status===402?'Credits required (402). Pick a free model.':(m||'Request failed')+' (HTTP '+r.status+')');
    if(r.status===401||r.status===403)e.needs='key';
    throw e;
  }
  let content='',reason='',finish='',usage=null;const tc=[];
  if(!PF.stream){
    const j=await r.json();const ch=j.choices?.[0];
    content=ch?.message?.content||'';reason=ch?.message?.reasoning||ch?.message?.reasoning_content||'';
    if(content)onText(content);if(reason)onReason(reason);
    (ch?.message?.tool_calls||[]).forEach((t,i)=>tc[i]={id:t.id,type:'function',function:{name:t.function.name,arguments:t.function.arguments}});
    return {content,reason,toolCalls:tc.filter(Boolean),finish:ch?.finish_reason||'',usage:j.usage};
  }
  const rd2=r.body.getReader(),dec=new TextDecoder();let buf='';
  while(true){
    const {done,value}=await rd2.read();if(done)break;
    buf+=dec.decode(value,{stream:true});let i;
    while((i=buf.indexOf('\n'))>=0){
      const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
      if(!line.startsWith('data:'))continue;
      const d=line.slice(5).trim();if(d==='[DONE]')continue;
      try{
        const j=JSON.parse(d);const ch=j.choices?.[0];
        if(ch?.delta?.content){content+=ch.delta.content;onText(ch.delta.content)}
        const rz=ch?.delta?.reasoning||ch?.delta?.reasoning_content;
        if(rz){reason+=rz;onReason(rz)}
        if(ch?.delta?.tool_calls){
          ch.delta.tool_calls.forEach(t=>{
            const k=t.index??0;
            tc[k]=tc[k]||{id:'',type:'function',function:{name:'',arguments:''}};
            if(t.id)tc[k].id=t.id;
            if(t.function?.name)tc[k].function.name+=t.function.name;
            if(t.function?.arguments)tc[k].function.arguments+=t.function.arguments;
          });
        }
        if(ch?.finish_reason)finish=ch.finish_reason;
        if(j.usage)usage=j.usage;
      }catch{}
    }
  }
  return {content,reason,toolCalls:tc.filter(Boolean),finish,usage};
}

      if(m.images&&m.images.length){
        const parts=[{type:'text',text:m.content||''}];
        m.images.forEach(im=>parts.push({type:'image_url',image_url:{url:im.data}}));
        out.push({role:'user',content:parts});
      }else out.push({role:'user',content:m.content});
      continue;
    }
    if(m.pending)continue;
    let buf='',calls=[];
    const flushText=()=>{if(buf){out.push({role:'assistant',content:buf});buf=''}};
    const flushCalls=()=>{
      if(!calls.length)return;
      flushText();
      out.push({role:'assistant',content:null,tool_calls:calls.map(t=>({id:t.id,type:'function',function:{name:t.name,arguments:t.args}}))});
      calls.forEach(t=>out.push({role:'tool',tool_call_id:t.id,content:String(t.result||'').slice(0,12000)}));
      calls=[];
    };
    (m.segments||[]).forEach(sg=>{
      if(sg.type==='text')buf+=sg.text;
      else if(sg.type==='tool'&&sg.done){flushText();calls.push(sg)}
    });
    flushCalls();
    if(buf)out.push({role:'assistant',content:buf});
    if(!m.segments&&m.content)out.push({role:'assistant',content:m.content});
  }
  return out;
}

async function agentLoop(c,m,{depth=0,extraSys=''}={}){
  const t0=performance.now();
  m.pending=true;m.error='';m.needs='';m.stopped=false;m.truncated=false;m.segments=m.segments||[];
  m.model=S.activeModel;m.mode=proj().agent.mode||PF.mode;m.toolCount=0;
  repaint(m,c);if(!nodeOf(m.id))thread.appendChild(msgNode(m,c));toEnd(true);
  const st={cid:c.id,ac:new AbortController(),stopped:false,t0,usage:null,raf:0};
  if(depth===0){live=st;paintSend();paintState()}
  const tools=depth>0?[]:toolSpecs();
  const maxLoops=depth>0?1:PF.toolLoops;
  let msgs=toApi(c);
  if(extraSys)msgs[0]={role:'system',content:msgs[0].content+'\n\n'+extraSys};
  let textSeg=null,reasonSeg=null;
  const flush=()=>{st.raf=0;
    const el=nodeOf(m.id);if(!el)return;
    el.querySelector('.abody').innerHTML=m.segments.map(segHTML).join('')+'<span class="caret"></span>';
    if(near())toEnd();else $('#jump').hidden=false;
  };
  const sched=()=>{if(!st.raf)st.raf=requestAnimationFrame(flush)};
  let problem=null;
  try{
    for(let loop=0;loop<maxLoops;loop++){
      if(st.stopped)break;
      textSeg=null;reasonSeg=null;
      const res=await streamChat({messages:msgs,tools,mode:m.mode,signal:st.ac.signal,
        onText:d=>{if(!textSeg){textSeg={type:'text',text:''};m.segments.push(textSeg)}textSeg.text+=d;sched()},
        onReason:d=>{if(!reasonSeg){reasonSeg={type:'reason',text:''};m.segments.unshift(reasonSeg)}reasonSeg.text+=d;sched()}});
      if(res.usage)st.usage=res.usage;
      if(res.finish==='length')m.truncated=true;
      if(!res.toolCalls.length)break;
      if(loop===maxLoops-1){m.segments.push({type:'text',text:'\n\n_Tool loop limit reached. Ask me to continue if more steps are needed._'});break}
      const pending=[];
      for(const t of res.toolCalls){
        const seg={type:'tool',id:t.id||uid(),name:t.function.name,args:t.function.arguments||'{}',done:false};
        m.segments.push(seg);m.toolCount++;pending.push({t,seg});
      }
      sched();renderPanel();
      msgs.push({role:'assistant',content:res.content||null,tool_calls:res.toolCalls.map(t=>({id:t.id,type:'function',function:{name:t.function.name,arguments:t.function.arguments}}))});
      for(const {t,seg} of pending){
        if(st.stopped)break;
        let args={};try{args=JSON.parse(seg.args||'{}')}catch{}
        if(proj().agent.autonomy==='confirm'&&depth===0&&['write_file','rest__','mail__','gh__'].some(x=>seg.name.startsWith(x))){
          const ok=await confirmModal({title:'Allow tool call?',body:`${seg.name}\n\n${JSON.stringify(args,null,2).slice(0,700)}`,ok:'Run tool',danger:false});
          if(!ok){seg.done=true;seg.ok=false;seg.result='Denied by user.';msgs.push({role:'tool',tool_call_id:seg.id,content:'User denied this tool call.'});repaint(m,c);continue}
        }
        const r=await execTool(seg.name,args,{chat:c,st});
        seg.done=true;seg.ok=r.ok;seg.result=r.out;seg.ms=r.ms;
        S.runs.unshift({id:uid(),tool:seg.name,ok:r.ok,ms:r.ms,at:Date.now(),args:seg.args.slice(0,500),out:r.out.slice(0,1200),chat:c.id});
        if(S.runs.length>200)S.runs.length=200;
        msgs.push({role:'tool',tool_call_id:seg.id,content:r.out});
        repaint(m,c);renderPanel();
      }
      textSeg=null;
    }
  }catch(e){
    if(e?.name==='AbortError'||st.stopped)problem='stopped';
    else{problem=e;m.needs=e?.needs||'';console.error('[forge] loop',e)}
  }
  cancelAnimationFrame(st.raf);
  m.pending=false;m.ms=Math.round(performance.now()-t0);
  const allText=m.segments.filter(s=>s.type==='text').map(s=>s.text).join('');
  m.content=allText;m.tokens=st.usage?.total_tokens||est(allText);
  if(problem==='stopped'){m.stopped=true;if(!allText)m.segments.push({type:'text',text:'_Stopped before output._'})}
  else if(problem)m.error=problem instanceof TypeError?'Network error — check the gateway URL, CORS, or enable the Worker proxy.':String(problem.message||problem).slice(0,400);
  c.updatedAt=Date.now();
  repaint(m,c);saveS();renderChats();renderPanel();
  if(depth===0){live=null;paintSend();paintState();paintFoot()}
  if(near())toEnd();
  if(PF.autoSpeak&&allText&&depth===0)speak(allText.slice(0,1200));
  return allText;
}

function loadVoices(){voices=speechSynthesis.getVoices()}

function speak(text){
  if(!('speechSynthesis' in window)){toast('Speech synthesis unavailable.',{type:'wa'});return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text.replace(/```[\s\S]*?```/g,' code block ').replace(/[#*`_>|]/g,'').slice(0,4000));
  const v=voices.find(x=>x.voiceURI===PF.voice);if(v)u.voice=v;
  u.rate=PF.rate;u.pitch=PF.pitch;speechSynthesis.speak(u);
  PF.tts=true;savePF();paintTts();
}

function visibleChats(){
  let l=S.chats.filter(c=>PF.allProjects||c.projectId===S.activeProject);
  if(PF.starOnly)l=l.filter(c=>c.pinned);
  if(chatQ){const q=chatQ.toLowerCase();l=l.filter(c=>c.title.toLowerCase().includes(q)||c.messages.some(m=>(m.content||'').toLowerCase().includes(q)))}
  if(PF.sort==='oldest')l.sort((a,b)=>a.updatedAt-b.updatedAt);
  else if(PF.sort==='alpha')l.sort((a,b)=>a.title.localeCompare(b.title));
  else if(PF.sort==='size')l.sort((a,b)=>b.messages.length-a.messages.length);
  else l.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||b.updatedAt-a.updatedAt);
  return l;
}
const prevOf=c=>{const m=c.messages.at(-1);if(!m)return 'Empty';
  const t=m.role==='user'?m.content:(m.segments||[]).filter(s=>s.type==='text').map(s=>s.text).join(' ');
  return (t||'…').replace(/[`#*>|_~-]/g,'').replace(/\s+/g,' ').trim().slice(0,64)};
function renderChats(){
  const l=visibleChats(),box=$('#chatList');
  if(!l.length){box.innerHTML=`<div class="empty-list">${S.chats.length?'Nothing matches.':'No conversations in this project yet.'}</div>`;paintFoot();return}
  let h='',g='';
  l.forEach(c=>{
    if(PF.sort==='recent'){const k=c.pinned?'Pinned':dayKey(c.updatedAt);if(k!==g){g=k;h+=`<div class="grp">${g}</div>`}}
    h+=`<div class="crow${c.id===S.activeChat?' on':''}${selSet.has(c.id)?' sel':''}" data-id="${c.id}" role="button" tabindex="0">
      ${selMode?`<input type="checkbox" ${selSet.has(c.id)?'checked':''} data-chk="${c.id}" aria-label="Select"/>`:''}
      <div class="cmain"><div class="ctitle">${esc(c.title)}</div><div class="cprev">${esc(prevOf(c))}</div></div>
      <div class="cacts">
        <button data-a="pin" class="${c.pinned?'on':''}" title="Pin">${I('pin')}</button>
        <button data-a="ren" title="Rename">${I('edit')}</button>
        <button data-a="del" title="Delete">${I('trash')}</button>
      </div></div>`;
  });
  box.innerHTML=h;paintFoot();
}
$('#chatList').addEventListener('click',async e=>{
  const it=e.target.closest('.crow');if(!it)return;const id=it.dataset.id;
  if(e.target.closest('[data-chk]')){selSet.has(id)?selSet.delete(id):selSet.add(id);paintBulk();renderChats();return}
  const a=e.target.closest('[data-a]');
  if(a){e.stopPropagation();const c=S.chats.find(x=>x.id===id);
    if(a.dataset.a==='pin'){c.pinned=!c.pinned;saveS();renderChats()}
    else if(a.dataset.a==='del'){delChat(id)}
    else{const v=await promptModal({title:'Rename chat',label:'Title',value:c.title});if(v){c.title=v.slice(0,80);saveS();renderChats();layout()}}
    return}
  if(selMode){selSet.has(id)?selSet.delete(id):selSet.add(id);paintBulk();renderChats();return}
  openChat(id);
});
function openChat(id){
  if(live){live.stopped=true;try{live.ac.abort()}catch{}}
  S.activeChat=id;const c=chat();if(c&&c.projectId!==S.activeProject)S.activeProject=c.projectId;
  saveS();layout();renderChats();renderThread();renderPanel();paintState();paintChip();
  input.value=c?.draft||'';grow();paintSend();closeSidebar();
  if(matchMedia('(min-width:1024px)').matches)input.focus();
}
function delChat(id){
  const i=S.chats.findIndex(c=>c.id===id);if(i<0)return;
  if(live?.cid===id){live.stopped=true;try{live.ac.abort()}catch{}}
  const [s]=S.chats.splice(i,1),was=S.activeChat===id;
  if(was){S.activeChat='';layout();renderThread()}
  saveS();renderChats();
  toast('Chat deleted.',{type:'wa',timeout:6500,action:{label:'Undo',fn(){S.chats.splice(Math.min(i,S.chats.length),0,s);if(was){S.activeChat=s.id;layout();renderThread()}saveS();renderChats()}}});
}

let terms=[{id:uid(),name:'main',lines:[{t:'dim',v:'Forge terminal — type `help` for commands.'}],hist:[],hi:0}];
let termActive=terms[0].id;
const term=()=>terms.find(t=>t.id===termActive)||terms[0];
async function termExec(cmd,silent=false){
  const T=term();const line=cmd.trim();
  if(!silent){T.lines.push({t:'cmd',v:'❯ '+line});T.hist.push(line);T.hi=T.hist.length}
  if(!line){renderPanel();return ''}
  const [c,...rest]=line.split(/\s+/);const arg=rest.join(' ');
  let out='',cls='';
  try{
    switch(c){
      case 'help':out=['Forge terminal commands:','  help                      this list','  ls                        project files','  cat <file>                print a file',
        '  write <file> <text>       create a file','  rm <file>                 delete a file','  echo <text>               print text','  js <code>                 run JavaScript in sandbox',
        '  http <url>                fetch a URL','  mcp                       list MCP servers + tools','  mcp call <srv> <tool> {json}   call an MCP tool',
        '  mcp connect <srv>         reconnect a server','  skill                     list skills','  skill run <name> <input>  activate a skill',
        '  agent                     list subagents','  agent run <name> <task>   delegate to a subagent','  con                       list connectors',
        '  provider                  current gateway','  models                    list cached models','  project                   project summary',
        '  task <title>              add a task','  tasks                     list tasks','  export                    download terminal log','  clear                     clear this tab'].join('\n');break;
      case 'clear':T.lines=[];renderPanel();return '';
      case 'ls':out=projectFiles().map(f=>`${f.name.padEnd(28)} ${bytes(f.size)}`).join('\n')||'(no files)';break;
      case 'cat':{const f=projectFiles().find(x=>x.name===arg);out=f?f.content:'Not found: '+arg;if(!f)cls='err';break}
      case 'write':{const n=rest[0],body=rest.slice(1).join(' ');if(!n){out='usage: write <file> <text>';cls='err';break}
        S.files.push({id:uid(),projectId:S.activeProject,name:n,type:'text',content:body,size:body.length,createdAt:Date.now()});saveS();out='wrote '+n;cls='ok';break}
      case 'rm':{const i=S.files.findIndex(x=>x.projectId===S.activeProject&&x.name===arg);if(i<0){out='Not found';cls='err'}else{S.files.splice(i,1);saveS();out='removed '+arg;cls='ok'}break}
      case 'echo':out=arg;break;
      case 'js':out=await runJS(arg);break;
      case 'http':{const r=await proxyFetch(arg);out=(await r.text()).slice(0,4000);cls='ok';break}
      case 'mcp':{
        if(rest[0]==='call'){const srv=S.mcp.find(m=>m.name===rest[1]||m.id===rest[1]);if(!srv){out='server not found';cls='err';break}
          let a={};try{a=JSON.parse(rest.slice(3).join(' ')||'{}')}catch{}
          out=await mcpCall(srv,rest[2],a);cls='ok'}
        else if(rest[0]==='connect'){const srv=S.mcp.find(m=>m.name===rest[1]||m.id===rest[1]);if(!srv){out='server not found';cls='err'}else{await mcpConnect(srv);out=srv.status+' · '+srv.tools.length+' tools'}}
        else out=S.mcp.map(m=>`${m.name} [${m.status}] ${m.tools.length} tools\n`+m.tools.map(t=>'   · '+t.name).join('\n')).join('\n')||'No MCP servers. Add one from the rail.';
        break}
      case 'skill':{
        if(rest[0]==='run'){const s=S.skills.find(x=>x.name.toLowerCase()===rest[1]?.toLowerCase());if(!s){out='skill not found';cls='err'}else{out=(await execTool('skill__'+s.id,{input:rest.slice(2).join(' ')},{})).out;cls='ok'}}
        else out=S.skills.map(s=>`${s.enabled?'●':'○'} ${s.name} — ${s.description}`).join('\n')||'No skills yet.';break}
      case 'agent':{
        if(rest[0]==='run'){out=await runSubagent(rest[1],rest.slice(2).join(' '),{});cls='ok'}
        else out=S.subagents.map(a=>`${a.name} — ${a.role}`).join('\n')||'No subagents yet.';break}
      case 'con':out=S.connectors.map(c=>`${conType(c.type)?.n} [${c.status}] ${c.name}`).join('\n')||'No connectors.';break;
      case 'provider':{const g=gateway();out=`${g.p.n}\nbase: ${g.base}\nkey: ${g.key?'set':'not set'}\nmodel: ${S.activeModel||'—'}\nworker: ${workerOn()?PF.workerUrl:'off'}`;break}
      case 'models':out=(S.modelsCache[S.activeProvider]?.list||[]).slice(0,60).map(m=>m.id+(m.free?'  [free]':'')).join('\n')||'No cached models. Open the picker.';break;
      case 'project':{const p=proj();out=`${p.name}\n${p.desc||''}\nchats: ${S.chats.filter(c=>c.projectId===p.id).length}\nfiles: ${projectFiles().length}\nskills: ${activeSkills().length}\ntools: ${toolSpecs().length}\nautonomy: ${p.agent.autonomy}`;break}
      case 'task':S.tasks.push({id:uid(),projectId:S.activeProject,title:arg,due:'',done:false,createdAt:Date.now()});saveS();out='task added';cls='ok';break;
      case 'tasks':out=S.tasks.filter(t=>t.projectId===S.activeProject).map(t=>`${t.done?'✔':'○'} ${t.title}${t.due?' · '+t.due:''}`).join('\n')||'No tasks.';break;
      case 'export':dl('forge-terminal.log',T.lines.map(l=>l.v).join('\n'));out='log downloaded';cls='ok';break;
      default:out=`Unknown command: ${c}. Try help.`;cls='err';
    }
  }catch(e){out=String(e.message||e);cls='err'}
  if(out)T.lines.push({t:cls,v:out});
  renderPanel();
  return out;
}
function renderPanel(){
  if(root.dataset.panel!=='open')return;
  const body=$('#pBody'),tab=PF.panelTab;
  $$('#pTabs [data-p]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.p===tab)));
  body.className='p-body'+(tab==='term'?' flush':'');
  if(tab==='run'){
    const c=chat(),runs=S.runs.slice(0,25);
    body.innerHTML=`<div class="stats">
        <div class="stat"><b>${S.runs.length}</b><span>tool calls</span></div>
        <div class="stat"><b>${S.runs.filter(r=>r.ok).length}</b><span>succeeded</span></div>
        <div class="stat"><b>${c?c.messages.length:0}</b><span>messages</span></div>
        <div class="stat"><b>${toolSpecs().length}</b><span>tools live</span></div>
      </div>
      <div class="card"><b>${I('activity')}Recent tool activity</b>
        <div class="scroll-list">${runs.length?runs.map(r=>`<div class="item"><div class="im"><b class="mono" style="font-size:.75rem">${esc(r.tool)}</b><small>${hhmm(r.at)} · ${r.ms}ms</small></div><span class="tag ${r.ok?'ok':'er'}">${r.ok?'ok':'fail'}</span></div>`).join(''):'<p class="help">No tool calls yet.</p>'}</div>
        ${runs.length?`<button class="btn sm" id="clearRuns">${I('trash')}Clear log</button>`:''}</div>
      <div class="card"><b>${I('folder')}Project</b>
        <dl><div class="kv"><dt>Name</dt><dd>${esc(proj().name)}</dd></div>
        <div class="kv"><dt>Autonomy</dt><dd>${esc(proj().agent.autonomy)}</dd></div>
        <div class="kv"><dt>Mode</dt><dd>${esc(proj().agent.mode||PF.mode)}</dd></div>
        <div class="kv"><dt>Files</dt><dd>${projectFiles().length}</dd></div></dl>
        <div class="line"><button class="btn sm" id="pAgent">${I('agent')}Agent settings</button><button class="btn sm" id="pExport">${I('download')}Export chat</button></div></div>`;
    $('#clearRuns')&&($('#clearRuns').onclick=()=>{S.runs=[];saveS();renderPanel()});
    $('#pAgent').onclick=openAgents;$('#pExport').onclick=exportChat;
  }
  else if(tab==='term'){
    const T=term();
    body.innerHTML=`<div class="term">
      <div class="term-tabs">${terms.map(t=>`<button class="ttab${t.id===termActive?' on':''}" data-t="${t.id}">${esc(t.name)}<span class="x" data-tx="${t.id}">${I('x')}</span></button>`).join('')}
        <button class="ttab" id="tNew">${I('plus')}</button><span style="flex:1"></span>
        <button class="ttab" id="tClear" title="Clear">${I('trash')}</button><button class="ttab" id="tDl" title="Export">${I('download')}</button></div>
      <div class="term-out" id="tOut">${T.lines.map(l=>`<div class="tline ${l.t}">${esc(l.v)}</div>`).join('')}</div>
      <div class="term-in"><span>❯</span><input type="text" id="tIn" placeholder="type help" aria-label="Terminal command" autocomplete="off"/></div></div>`;
    const out=$('#tOut');out.scrollTop=out.scrollHeight;
    const inp=$('#tIn');
    inp.onkeydown=async e=>{
      if(e.key==='Enter'){const v=inp.value;inp.value='';inp.disabled=true;await termExec(v);const ni=$('#tIn');if(ni){ni.disabled=false;ni.focus()}
        const o=$('#tOut');if(o)o.scrollTop=o.scrollHeight}
      else if(e.key==='ArrowUp'){e.preventDefault();T.hi=Math.max(0,T.hi-1);inp.value=T.hist[T.hi]||''}
      else if(e.key==='ArrowDown'){e.preventDefault();T.hi=Math.min(T.hist.length,T.hi+1);inp.value=T.hist[T.hi]||''}
      else if(e.key==='Tab'){e.preventDefault();const cs=['help','ls','cat','write','rm','echo','js','http','mcp','skill','agent','con','provider','models','project','task','tasks','export','clear'];
        const m=cs.filter(x=>x.startsWith(inp.value));if(m.length===1)inp.value=m[0]+' '}
      else if(e.key==='l'&&e.ctrlKey){e.preventDefault();T.lines=[];renderPanel()}
    };
    setTimeout(()=>inp.focus(),30);
    body.querySelectorAll('[data-t]').forEach(b=>b.onclick=e=>{if(e.target.closest('[data-tx]'))return;termActive=b.dataset.t;renderPanel()});
    body.querySelectorAll('[data-tx]').forEach(b=>b.onclick=e=>{e.stopPropagation();if(terms.length===1)return;
      terms=terms.filter(t=>t.id!==b.dataset.tx);if(termActive===b.dataset.tx)termActive=terms[0].id;renderPanel()});

        <button class="btn sm" id="addFile">${I('upload')}Add files</button></div>
      <div class="card"><b>${I('code')}Snippets (${S.snippets.length})</b>

      <div class="card"><b>${I('bell')}Tasks</b>
        <div class="scroll-list">${S.tasks.filter(t=>t.projectId===S.activeProject).map(t=>`<div class="item"><input type="checkbox" ${t.done?'checked':''} data-tk="${t.id}"/><div class="im"><b style="${t.done?'text-decoration:line-through;opacity:.6':''}">${esc(t.title)}</b>${t.due?`<small>${esc(t.due)}</small>`:''}</div><button class="btn q sm" data-td="${t.id}">${I('trash')}</button></div>`).join('')||'<p class="help">No tasks.</p>'}</div>
        <button class="btn sm" id="addTask">${I('plus')}Add task</button></div>`;
    $('#saveKnow').onclick=()=>{proj().agent.knowledge=$('#know').value;saveS();toast('Knowledge saved.',{type:'ok'})};
    $('#addFile').onclick=()=>$('#filePick').click();
    $('#addTask').onclick=async()=>{const v=await promptModal({title:'New task',label:'Title'});if(v){S.tasks.push({id:uid(),projectId:S.activeProject,title:v,due:'',done:false,createdAt:Date.now()});saveS();renderPanel()}};
    body.querySelectorAll('[data-fv]').forEach(b=>b.onclick=()=>{const f=S.files.find(x=>x.id===b.dataset.fv);
      modal({title:f.name,icon:'file',size:'lg',body:`<div class="codeview"><pre>${esc(f.content.slice(0,60000))}</pre></div>`,foot:`<span class="sp"></span><button class="btn" data-d>${I('download')}Download</button>`})
        .el.querySelector('[data-d]').onclick=()=>dl(f.name,f.content)});
    body.querySelectorAll('[data-fd]').forEach(b=>b.onclick=()=>{S.files=S.files.filter(x=>x.id!==b.dataset.fd);saveS();renderPanel()});
    body.querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>{const s=S.snippets.find(x=>x.id===b.dataset.sv);
      modal({title:s.name,icon:'code',size:'lg',body:`<div class="codeview"><pre>${esc(s.code)}</pre></div>`})});
    body.querySelectorAll('[data-tk]').forEach(b=>b.onchange=()=>{const t=S.tasks.find(x=>x.id===b.dataset.tk);t.done=b.checked;saveS();renderPanel()});

  }
  else if(tab==='agents'){
    body.innerHTML=`<div class="card"><b>${I('agent')}Subagents (${S.subagents.length})</b>
      <div class="scroll-list">${S.subagents.map(a=>`<div class="item"><div class="im"><b>${esc(a.name)}</b><small>${esc(a.role)}</small></div>
        <div class="ia"><button class="btn q sm" data-ar="${a.id}">${I('play')}</button><button class="btn q sm" data-ae="${a.id}">${I('edit')}</button></div></div>`).join('')||'<p class="help">Create specialists the main agent can delegate to.</p>'}</div>
      <div class="line"><button class="btn p sm" id="newAgent">${I('plus')}New subagent</button><button class="btn sm" id="agentCfg">${I('gear')}Project agent</button></div></div>
      <div class="card"><b>${I('shield')}Autonomy</b><p class="help">Confirm asks before write / network tools. Auto runs everything requested.</p>
      <div class="line" id="autoSeg"></div></div>`;
    const seg=document.createElement('div');seg.className='seg';
    seg.innerHTML=['confirm','auto'].map(v=>`<button data-au="${v}" aria-pressed="${proj().agent.autonomy===v}">${v==='confirm'?I('shield'):I('zap')}<span>${v}</span></button>`).join('');
    $('#autoSeg').appendChild(seg);
    seg.querySelectorAll('[data-au]').forEach(b=>b.onclick=()=>{proj().agent.autonomy=b.dataset.au;saveS();renderPanel()});
    $('#newAgent').onclick=()=>editSubagent();
    $('#agentCfg').onclick=openAgents;
    body.querySelectorAll('[data-ae]').forEach(b=>b.onclick=()=>editSubagent(b.dataset.ae));
    body.querySelectorAll('[data-ar]').forEach(b=>b.onclick=async()=>{const a=S.subagents.find(x=>x.id===b.dataset.ar);
      const t=await promptModal({title:'Delegate to '+a.name,label:'Task',multiline:true});if(t){openPanel('run');await runSubagent(a.id,t,{})}});
  }
}

function openProjects(){
  const m=modal({title:'Projects',icon:'folder',size:'lg',
    body:`<div class="line"><div class="searchbar">${I('search')}<input type="text" id="pq" placeholder="Search projects"/></div><button class="btn p" id="pNew">${I('plus')}New project</button></div>
      <div class="pgrid" id="pList"></div>`,
    foot:`<span>Everything is scoped to the active project.</span><span class="sp"></span><button class="btn" id="pExp">${I('download')}Export workspace</button>`});
  const paint=()=>{
    const q=(m.el.querySelector('#pq').value||'').toLowerCase();
    const list=S.projects.filter(p=>p.name.toLowerCase().includes(q));
    m.el.querySelector('#pList').innerHTML=list.map(p=>`<div class="pcard${p.id===S.activeProject?' on':''}">
      <div class="pt"><span class="proj-dot" style="background:${esc(p.color)}"></span><b>${esc(p.name)}</b>${p.id===S.activeProject?I('check'):''}</div>
      <small>${esc(p.desc||'No description')}</small>
      <div class="ptags"><span class="tag">${S.chats.filter(c=>c.projectId===p.id).length} chats</span><span class="tag">${S.files.filter(f=>f.projectId===p.id).length} files</span><span class="tag ac">${esc(p.agent.autonomy)}</span></div>
      <div class="line" style="margin-top:4px"><button class="btn sm" data-open="${p.id}">Open</button><button class="btn q sm" data-edit="${p.id}">${I('edit')}</button><button class="btn q sm" data-del="${p.id}">${I('trash')}</button></div></div>`).join('')||'<p class="help">No projects match.</p>';
    m.el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{S.activeProject=b.dataset.open;S.activeChat='';saveS();layout();renderChats();renderThread();paintChip();paintHero();renderPanel();m.close();toast('Project switched.',{type:'ok',timeout:2000})});
    m.el.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editProject(b.dataset.edit,paint));
    m.el.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      if(S.projects.length===1){toast('Keep at least one project.',{type:'wa'});return}
      const p=S.projects.find(x=>x.id===b.dataset.del);
      if(!await confirmModal({title:'Delete project?',body:`"${p.name}" and its chats, files and tasks will be removed.`}))return;
      S.projects=S.projects.filter(x=>x.id!==p.id);S.chats=S.chats.filter(c=>c.projectId!==p.id);
      S.files=S.files.filter(f=>f.projectId!==p.id);S.tasks=S.tasks.filter(t=>t.projectId!==p.id);
      if(S.activeProject===p.id){S.activeProject=S.projects[0].id;S.activeChat=''}
      saveS();paint();layout();renderChats();renderThread();paintChip()});
  };
  m.el.querySelector('#pq').oninput=deb(paint,120);
  m.el.querySelector('#pNew').onclick=()=>editProject(null,paint);
  m.el.querySelector('#pExp').onclick=exportWorkspace;
  paint();
}
function editProject(id,after){
  const p=id?S.projects.find(x=>x.id===id):null;
  const colors=['#1F5E52','#3A4E6B','#8A5A3B','#2E6B4F','#8A6320','#A3392F','#2C5A8A','#5B5B56'];
  const m=modal({title:p?'Edit project':'New project',icon:'folder',size:'md',
    body:`<div class="field"><label class="lbl">Name</label><input type="text" id="pn" value="${esc(p?.name||'')}" placeholder="Client site, SaaS, Research…"/></div>
      <div class="field"><label class="lbl">Description</label><input type="text" id="pd" value="${esc(p?.desc||'')}" placeholder="What this project is about"/></div>
      <div class="field"><label class="lbl">Colour</label><div class="swatches" id="pc">${colors.map(c=>`<button class="swatch${(p?.color||colors[0])===c?' on':''}" data-c="${c}" style="background:${c}" aria-label="${c}"></button>`).join('')}</div></div>
      <div class="field"><label class="lbl">Agent persona for this project</label><textarea id="pp" rows="6">${esc(p?.agent.persona||SYS_DEFAULT)}</textarea></div>
      <div class="grid g2"><div class="field"><label class="lbl">Default mode</label><div id="pm"></div></div>
      <div class="field"><label class="lbl">Autonomy</label><div id="pa"></div></div></div>`,
    foot:`<span class="sp"></span><button class="btn" data-no>Cancel</button><button class="btn p" data-ok>${I('check')}Save project</button>`});
  let color=p?.color||colors[0],mode=p?.agent.mode||'auto',aut=p?.agent.autonomy||'confirm';
  m.el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;m.el.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b))});
  mountSelect(m.el.querySelector('#pm'),{value:mode,options:[{v:'fast',n:'Fast',i:'zap'},{v:'auto',n:'Auto',i:'auto'},{v:'think',n:'Thinking',i:'brain'}],onChange:v=>mode=v});
  mountSelect(m.el.querySelector('#pa'),{value:aut,options:[{v:'confirm',n:'Confirm risky tools',i:'shield'},{v:'auto',n:'Full auto',i:'zap'}],onChange:v=>aut=v});
  m.el.querySelector('[data-no]').onclick=()=>m.close();
  m.el.querySelector('[data-ok]').onclick=()=>{
    const name=m.el.querySelector('#pn').value.trim();if(!name){toast('Name required.',{type:'wa'});return}
    const data={name,desc:m.el.querySelector('#pd').value.trim(),color};
    const agent={persona:m.el.querySelector('#pp').value.trim()||SYS_DEFAULT,mode,autonomy:aut};
    if(p){Object.assign(p,data);p.agent={...p.agent,...agent}}
    else{const np={id:uid(),...data,createdAt:Date.now(),agent:{...agent,provider:'',model:'',skills:[],tools:[],mcp:[],connectors:[],knowledge:''}};
      S.projects.push(np);S.activeProject=np.id;S.activeChat=''}
    saveS();m.close();after&&after();layout();renderChats();renderThread();paintChip();paintHero();renderPanel();
    toast('Project saved.',{type:'ok'});
  };
}

let provCat='all',provQ='',provSel='openrouter';
function openProviders(tab='all'){
  provCat=tab;provSel=S.activeProvider;
  const m=modal({title:'Gateways & keys',icon:'key',size:'full',flush:true,tag:'<span class="beta">BYOK beta</span>',
    body:`<div class="split"><div class="split-l" id="cats"></div><div class="split-r" id="pane"></div></div>`,
    foot:`<span>${PROVIDERS.length} providers · keys stay in this browser</span><span class="sp"></span>
      <button class="btn sm" id="wCfg">${I('worker')}Worker proxy</button><button class="btn sm" id="uncBtn">${I('shield')}Uncensored lane</button><button class="btn p sm" id="doneBtn">${I('check')}Done</button>`});
  const cats=m.el.querySelector('#cats'),pane=m.el.querySelector('#pane');
  const counts=c=>c==='all'?PROVIDERS.length:c==='free'?PROVIDERS.filter(p=>p.free).length:c==='uncensored'?PROVIDERS.filter(p=>p.unc).length:
    c==='connected'?PROVIDERS.filter(p=>keyOf(p.id)||S.keys['__cfg_'+p.id]).length:PROVIDERS.filter(p=>p.c===c).length;
  function paintCats(){
    cats.innerHTML=CATS.map(c=>`<button class="catbtn${provCat===c.id?' on':''}" data-c="${c.id}">${I(c.i)}<span>${esc(c.n)}</span><small>${counts(c.id)}</small></button>`).join('');
    cats.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{provCat=b.dataset.c;paintCats();paintPane()});
  }
  function filtered(){
    let l=[...PROVIDERS];
    if(provCat==='free')l=l.filter(p=>p.free);
    else if(provCat==='uncensored')l=l.filter(p=>p.unc);
    else if(provCat==='connected')l=l.filter(p=>keyOf(p.id)||S.keys['__cfg_'+p.id]);
    else if(provCat!=='all')l=l.filter(p=>p.c===provCat);
    if(provQ){const q=provQ.toLowerCase();l=l.filter(p=>(p.n+p.id+p.note).toLowerCase().includes(q))}
    return l;
  }
  function paintPane(){
    const l=filtered();
    pane.innerHTML=`<div class="line"><div class="searchbar">${I('search')}<input type="text" id="pvq" value="${esc(provQ)}" placeholder="Search ${PROVIDERS.length} providers"/></div>
      <span class="tag ac">${l.length} shown</span></div>
      <div class="pgrid" id="pvGrid"></div><div id="pvDetail"></div>`;
    const grid=pane.querySelector('#pvGrid');
    grid.innerHTML=l.map(p=>{
      const has=keyOf(p.id)||p.nokey;
      return `<button class="pcard${provSel===p.id?' on':''}" data-p="${p.id}">
        <div class="pt">${I(p.c==='local'?'term':p.c==='router'?'branch':p.c==='uncensored'?'shield':'cloud')}<b>${esc(p.n)}</b>${has?I('check'):''}</div>
        <small>${esc(p.note)}</small>
        <div class="ptags">${p.free?'<span class="tag ok">free tier</span>':''}${p.unc?'<span class="tag wa">uncensored</span>':''}${p.nokey?'<span class="tag">no key</span>':''}${S.activeProvider===p.id?'<span class="tag ac">active</span>':''}</div></button>`;
    }).join('')||'<p class="help">No provider matches.</p>';
    grid.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{provSel=b.dataset.p;paintPane()});
    const si=pane.querySelector('#pvq');
    si.oninput=deb(e=>{provQ=e.target.value.trim();paintPane();const n=pane.querySelector('#pvq');n.focus();n.setSelectionRange(n.value.length,n.value.length)},160);
    paintDetail();
  }
  function paintDetail(){
    const p=provById(provSel);if(!p)return;
    const cfg=S.keys['__cfg_'+p.id]||{};
    const box=pane.querySelector('#pvDetail');
    box.innerHTML=`<div class="card" style="background:var(--surface)">
      <b>${I('key')}${esc(p.n)} ${p.free?'<span class="tag ok">free</span>':''}${p.unc?'<span class="tag wa">uncensored</span>':''}</b>
      <p class="help">${esc(p.note)} ${p.d?`<a href="${esc(p.d)}" target="_blank" rel="noopener">Get a key ${I('ext')}</a>`:''}</p>
      <div class="field"><label class="lbl">Base URL</label><input type="text" id="pvBase" value="${esc(cfg.base||p.b)}" placeholder="https://…/v1"/></div>
      ${p.nokey?'<p class="help">Local runtime — no key needed. Make sure CORS allows this page.</p>':`
      <div class="field"><label class="lbl">API key</label><div class="line" style="flex-wrap:nowrap">
        <input type="password" id="pvKey" value="${esc(keyOf(p.id))}" placeholder="${esc(p.k)}" autocomplete="off"/>
        <button class="btn ic" id="pvEye">${I('eye')}</button></div></div>
      <label class="chk"><input type="checkbox" id="pvRem" ${S.keys[p.id]?'checked':''}/>Remember on this device</label>`}
      <div class="line"><button class="btn p" id="pvSave">${I('check')}Save &amp; verify</button>
        <button class="btn" id="pvLoad">${I('refresh')}Load models</button>
        <button class="btn" id="pvUse">${I('play')}Use this gateway</button>
        ${p.nokey?'':`<button class="btn d sm" id="pvDel">Remove key</button>`}</div>
      <div id="pvNote"></div>
      <div class="field"><label class="lbl">Model</label><div class="line" style="flex-wrap:nowrap">
        <input type="text" id="pvModel" value="${esc(S.activeProvider===p.id?S.activeModel:(cfg.model||''))}" placeholder="model id"/>
        <button class="btn" id="pvSetModel">Set</button></div></div>
      ${p.id==='openrouter'?`<label class="chk"><input type="checkbox" id="pvFree" ${S.freeOnly?'checked':''}/>Only show free models</label>`:''}
      <div class="scroll-list" id="pvModels" style="max-height:260px;overflow:auto"></div></div>`;
    const note=box.querySelector('#pvNote');
    const setNote=(cls,txt)=>{note.innerHTML=`<div class="note ${cls}">${I(cls==='ok'?'check':cls==='er'?'alert':'info')}<span>${txt}</span></div>`};
    box.querySelector('#pvEye')&&(box.querySelector('#pvEye').onclick=()=>{const i=box.querySelector('#pvKey');i.type=i.type==='password'?'text':'password'});
    const loadInto=async()=>{
      const b=box.querySelector('#pvLoad');b.disabled=true;b.innerHTML='<span class="ring"></span>Loading…';
      try{delete S.modelsCache[p.id];const list=await listModels(p.id);renderModels(list);setNote('ok',list.length+' models loaded.')}
      catch(err){setNote('er',esc(err.message||'Load failed.'))}
      b.disabled=false;b.innerHTML=I('refresh')+'Load models';
    };
    box.querySelector('#pvFree')&&(box.querySelector('#pvFree').onchange=e=>{S.freeOnly=e.target.checked;saveS();delete S.modelsCache[p.id];loadInto()});
    box.querySelector('#pvSave').onclick=async e=>{
      const base=box.querySelector('#pvBase').value.trim();
      S.keys['__cfg_'+p.id]={...(S.keys['__cfg_'+p.id]||{}),base};
      if(!p.nokey)setKey(p.id,box.querySelector('#pvKey').value.trim(),box.querySelector('#pvRem').checked);
      saveS();
      const b=e.currentTarget;b.disabled=true;b.innerHTML='<span class="ring"></span>Verifying…';
      try{const list=await listModels(p.id);setNote('ok',`Connected · ${list.length} models available.`);renderModels(list)}
      catch(err){setNote('er',esc(err.message||'Could not verify. Check base URL, key, or enable the Worker proxy.'))}
      b.disabled=false;b.innerHTML=I('check')+'Save &amp; verify';paintFoot();paintState();paintChip();
    };
    box.querySelector('#pvLoad').onclick=loadInto;
    box.querySelector('#pvUse').onclick=()=>{S.activeProvider=p.id;const c=S.keys['__cfg_'+p.id]||{};S.activeModel=c.model||'';saveS();paintChip();paintState();paintFoot();paintHero();paintPane();toast(p.n+' is now the active gateway.',{type:'ok'})};
    box.querySelector('#pvDel')&&(box.querySelector('#pvDel').onclick=()=>{setKey(p.id,'',false);box.querySelector('#pvKey').value='';paintFoot();paintState();toast('Key removed.',{type:'ok',timeout:2000})});
    box.querySelector('#pvSetModel').onclick=()=>{
      const v=box.querySelector('#pvModel').value.trim();if(!v)return;
      S.activeProvider=p.id;S.activeModel=v;S.keys['__cfg_'+p.id]={...(S.keys['__cfg_'+p.id]||{}),model:v};
      saveS();paintChip();paintState();paintFoot();paintHero();toast('Model set: '+v,{type:'ok'});
    };
    function renderModels(list){
      const el=box.querySelector('#pvModels');
      el.innerHTML=list.slice(0,300).map(mm=>`<div class="item" data-m="${esc(mm.id)}" style="cursor:pointer">
        <div class="im"><b style="font-size:.75rem">${esc(mm.name)}</b><small class="mono">${esc(mm.id)}</small></div>
        <div class="ia">${mm.free?'<span class="tag ok">free</span>':''}${mm.ctx?`<span class="tag in">${Math.round(mm.ctx/1000)}k</span>`:''}${mm.tools?'<span class="tag">tools</span>':''}${mm.vision?'<span class="tag">vision</span>':''}</div></div>`).join('')||'<p class="help">No models returned — type an id manually above.</p>';
      el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
        S.activeProvider=p.id;S.activeModel=b.dataset.m;S.keys['__cfg_'+p.id]={...(S.keys['__cfg_'+p.id]||{}),model:b.dataset.m};
        saveS();box.querySelector('#pvModel').value=b.dataset.m;paintChip();paintState();paintFoot();paintHero();toast('Model set: '+b.dataset.m,{type:'ok',timeout:2200})});
    }
    const cached=S.modelsCache[p.id];if(cached)renderModels(cached.list);
  }
  paintCats();paintPane();
  m.el.querySelector('#wCfg').onclick=openWorker;
  m.el.querySelector('#uncBtn').onclick=openUncensored;
  m.el.querySelector('#doneBtn').onclick=()=>m.close();
}
function openUncensored(){
  const list=PROVIDERS.filter(p=>p.unc);
  const m=modal({title:'Uncensored lane',icon:'shield',size:'lg',tag:'<span class="beta">beta</span>',

function openMCP(){
  const m=modal({title:'MCP servers',icon:'plug',size:'lg',

        <button class="btn q sm" data-e="${s.id}" title="Edit">${I('edit')}</button>
        <button class="btn q sm" data-d="${s.id}" title="Remove">${I('trash')}</button></div></div>`).join('')
      ||`<div class="note">${I('plug')}<span>No servers yet. Add any MCP HTTP endpoint, or deploy the Forge Worker MCP proxy.</span></div>`;
    m.el.querySelector('#mStat').textContent=`${S.mcp.filter(x=>x.status==='online').length}/${S.mcp.length} online · ${S.mcp.reduce((a,b)=>a+b.tools.length,0)} tools`;
    m.el.querySelectorAll('[data-c]').forEach(b=>b.onclick=async()=>{const s=S.mcp.find(x=>x.id===b.dataset.c);await mcpConnect(s);paint()});
    m.el.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>editMCP(b.dataset.e,paint));

      if(!await confirmModal({title:'Remove MCP server?',body:'Its tools will no longer be exposed.'}))return;
      S.mcp=S.mcp.filter(x=>x.id!==b.dataset.d);saveS();paint();paintFoot();renderPanel()});
    m.el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{
      const s=S.mcp.find(x=>x.id===b.dataset.t);
      const mm=modal({title:s.name+' tools',icon:'layers',size:'lg',body:`<div class="scroll-list">${s.tools.map(t=>`<div class="card"><b class="mono" style="font-size:.8125rem">${esc(t.name)}</b>
        <p class="help">${esc(t.description)}</p><div class="codeview"><pre>${esc(JSON.stringify(t.schema,null,2))}</pre></div>
        <button class="btn sm" data-call="${esc(t.name)}">${I('play')}Call tool</button></div>`).join('')||'<p class="help">No tools.</p>'}</div>`});
      mm.el.querySelectorAll('[data-call]').forEach(cb=>cb.onclick=async()=>{

        try{const out=await mcpCall(s,cb.dataset.call,a);modal({title:'Result',icon:'check',size:'lg',body:`<div class="codeview"><pre>${esc(out)}</pre></div>`})}
        catch(e){toast(e.message,{type:'er',timeout:7000})}});

}

      ${t.fields.map(f=>`<div class="field"><label class="lbl">${esc(f.l)}</label><input type="${f.t}" id="cf_${f.k}" value="${esc(c?.cfg?.[f.k]||'')}" placeholder="${esc(f.ph)}" autocomplete="off"/></div>`).join('')}

    foot:`<span class="sp"></span><button class="btn" data-no>Cancel</button><button class="btn p" data-ok>${I('check')}Save &amp; verify</button>`});
