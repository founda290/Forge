<script type="module">
/* ══ CLOUD SYNC · self-contained add-on: account, state sync, usage, webhooks, worker ══ */
const CK='fs.cloud';
const Ce=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const Crd=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}};
const Cwr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const Cloud=Crd(CK)||{token:'',email:'',uid:''};
const deviceId=(()=>{let d=Crd('fs.device');if(!d){d='dev-'+(crypto.randomUUID?crypto.randomUUID():''+Date.now()+Math.random().toString(36).slice(2));Cwr('fs.device',d)}return d})();
const auth=h=>Cloud.token?{...h,Authorization:'Bearer '+Cloud.token}:h;
const api=async(p,o={})=>{const r=await fetch(p,{...o,headers:{'Content-Type':'application/json',...auth(o.headers||{}),'x-forge-device':deviceId}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j};
const logIn=(t,u)=>{Cloud.token=t;Cloud.email=u.email;Cloud.uid=u.id;Cwr(CK,Cloud)};
const copy=async t=>{try{await navigator.clipboard.writeText(t);return true}catch{return false}};

const cloudOn=()=>!!Cloud.token;
const paintBtn=()=>{};

/* fetch wrapper → records real usage from chat responses when signed in */
const origFetch=window.fetch.bind(window);
window.fetch=async(...args)=>{
  const res=await origFetch(...args);
  try{
    const url=typeof args[0]==='string'?args[0]:(args[0]?.url||'');
    if(url.includes('/chat/completions')&&cloudOn()&&res.ok){
      const reqBody=(()=>{try{return JSON.parse(args[1]?.body||'{}')}catch{return{}}})();
      const clone=res.clone();
      clone.text().then(txt=>{
        let prompt=0,completion=0,cost=0,deltaChars=0;
        if(txt.includes('data:')){
          for(const line of txt.split('\n')){
            const l=line.trim();if(!l.startsWith('data:'))continue;
            try{const j=JSON.parse(l.slice(5).trim());const u=j.usage||{};
              if(u.prompt_tokens)prompt=u.prompt_tokens;
              if(u.completion_tokens)completion=u.completion_tokens;
              cost=u.total_cost||j.cost||cost;
              const d=j.choices?.[0]?.delta?.content;if(d)deltaChars+=d.length;
            }catch{}
          }
          if(!prompt&&!completion)completion=Math.round(deltaChars/4);
        }else{
          try{const j=JSON.parse(txt);const u=j.usage||{};
            prompt=u.prompt_tokens||0;completion=u.completion_tokens||0;cost=u.total_cost||u.cost||0;
          }catch{return}
        }
        if(!prompt&&!completion)return;
        const st=Crd('fs.state')||{};
        api('/api/usage',{method:'POST',body:JSON.stringify({provider:st.activeProvider||'unknown',model:reqBody.model||st.activeModel||'unknown',chatId:st.activeChat||'',promptTokens:prompt,completionTokens:completion,costUsd:cost})}).catch(()=>{});
      }).catch(()=>{});
    }
  }catch{}
  return res;
};

/* state sync (last-write-wins) */
let pushing=false;
async function pushState(silent){
  if(!cloudOn()||pushing)return;pushing=true;
  try{
    const payload={state:Crd('fs.state'),prefs:Crd('fs.prefs'),syncedAt:new Date().toISOString()};
    await api('/api/state',{method:'PUT',body:JSON.stringify(payload)});
    if(!silent)note('ok','Pushed workspace to Neon ('+JSON.stringify(payload).length+' bytes).');
  }catch(e){if(!silent)note('er','Push failed: '+e.message)}
  pushing=false;
}
window.addEventListener('pagehide',()=>{if(cloudOn()&&localStorage.getItem('fs.autoSync')==='1')pushState(true)});

/* modal */
let ov=null;
const closeOv=()=>{ov&&ov.remove();ov=null};
function note(kind,msg){
  const n=ov&&ov.querySelector('#ovNote');if(!n)return;
  n.style.color=kind==='ok'?'var(--ok,#2E6B4F)':kind==='er'?'var(--danger,#A3392F)':'var(--tx2,#555)';
  n.textContent=msg;
}
const field=(label,id,val,type='text')=>`<label style="display:flex;flex-direction:column;gap:4px;font-size:12px"><span style="color:var(--tx2,#555)">${Ce(label)}</span><input id="${id}" type="${type}" value="${Ce(val||'')}" style="padding:8px 10px;border:1px solid var(--line,#ddd);border-radius:8px;background:var(--surface2,#fafaf8);color:var(--tx,#111);font:inherit"/></label>`;
const obtn=(id,label,primary)=>`<button id="${id}" style="border:1px solid ${primary?'var(--ac,#1F5E52)':'var(--line,#ddd)'};background:${primary?'var(--ac,#1F5E52)':'transparent'};color:${primary?'var(--ac-ink,#fff)':'var(--tx,#111)'};border-radius:10px;padding:7px 14px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600">${Ce(label)}</button>`;
const hh=t=>`<div style="font-weight:700;font-size:11px;color:var(--tx3,#888);text-transform:uppercase;letter-spacing:.05em">${Ce(t)}</div>`;
const authed=()=>cloudOn()?null:`<div style="color:var(--tx2,#555)">Sign in first — see the Account tab.</div>`;

function openOv(tab='account'){
  closeOv();
  ov=document.createElement('div');
  Object.assign(ov.style,{position:'fixed',inset:0,zIndex:2147483100,background:'var(--scrim,rgba(0,0,0,.4))',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'var(--ui,sans-serif)'});
  ov.innerHTML=`<div style="width:min(600px,92vw);max-height:86vh;overflow:auto;background:var(--surface,#fff);color:var(--tx,#111);border:1px solid var(--line,#ddd);border-radius:var(--r3,18px);box-shadow:var(--sh3,0 24px 70px rgba(0,0,0,.18));padding:20px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
      <b style="font-size:15px">Forge Cloud</b><span style="color:var(--tx3,#888);font-size:12px">Neon Postgres · Vercel · Cloudflare Worker</span>
      <span style="flex:1"></span><button id="ovX" style="border:0;background:none;font-size:18px;cursor:pointer;color:inherit">✕</button></div>
    <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap" id="ovTabs">
      ${['account','sync','usage','webhooks','worker'].map(t=>`<button data-tab="${t}" style="border:1px solid var(--line,#ddd);background:${tab===t?'var(--ac-bg,#e8f0ee)':'transparent'};color:var(--tx,#111);border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>
    <div id="ovBody" style="display:flex;flex-direction:column;gap:10px;font-size:13px"></div>
    <div id="ovNote" style="margin-top:10px;font-size:12px;min-height:16px;color:var(--tx2,#555)"></div></div>`;
  document.body.appendChild(ov);
  ov.querySelector('#ovX').onclick=closeOv;
  ov.onclick=e=>{if(e.target===ov)closeOv()};
  ov.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>openOv(b.dataset.tab));
  paintBody(tab);
}

function paintBody(tab){
  const body=ov.querySelector('#ovBody');
  if(!body)return;
  if(tab==='account'){
    if(cloudOn()){
      body.innerHTML=`${hh('Signed in')}
        <div>Signed in as <b>${Ce(Cloud.email)}</b></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">${obtn('acOut','Sign out')}${obtn('acPing','Test API',true)}</div>
        <div style="color:var(--tx3,#888);font-size:12px">Sessions last 30 days. State snapshots are stored per account + device in Neon Postgres.</div>`;
      body.querySelector('#acOut').onclick=()=>{delete Cloud.token;Cloud.email='';Cloud.uid='';Cwr(CK,Cloud);paintBtn();openOv('account')};
      body.querySelector('#acPing').onclick=async()=>{try{const j=await api('/api/health');note('ok','API healthy · database '+j.db+' · '+j.latencems+'ms')}catch(e){note('er',e.message)}};
    }else{
      body.innerHTML=`${hh('Sign in or create an account')}
        ${field('Email','acEm','')} ${field('Password (min 8 chars)','acPw','','password')} ${field('Display name (new accounts)','acDn','')}
        <div style="display:flex;gap:8px;flex-wrap:wrap">${obtn('acLin','Sign in',true)}${obtn('acReg','Create account')}</div>`;
      const creds=()=>({email:body.querySelector('#acEm').value.trim().toLowerCase(),password:body.querySelector('#acPw').value});
      body.querySelector('#acLin').onclick=async()=>{
        const {email,password}=creds();
        try{const j=await api('/api/auth',{method:'POST',body:JSON.stringify({action:'login',email,password})});
          logIn(j.token,j.user);paintBtn();note('ok','Welcome back, '+(j.user.displayName||j.user.email)+'.');openOv('sync')}
        catch(e){note('er',e.message)}};
      body.querySelector('#acReg').onclick=async()=>{
        const {email,password}=creds();
        try{const j=await api('/api/auth',{method:'POST',body:JSON.stringify({action:'register',email,password,displayName:body.querySelector('#acDn').value.trim()})});
          logIn(j.token,j.user);paintBtn();note('ok','Account created. You can now sync your workspace.');openOv('sync')}
        catch(e){note('er',e.message)}};
    }
  }else if(tab==='sync'){
    if(authed()){body.innerHTML=authed();return}
    body.innerHTML=`${hh('Workspace sync')}
      <div style="color:var(--tx2,#555);font-size:12px">Push your whole workspace (projects, chats, skills, providers, files) to Neon as a snapshot bound to your account and this device. Pull restores the latest snapshot and reloads the page.</div>
      <div>Device&nbsp;<code>${Ce(deviceId)}</code>${cloudOn()?' · signed into <b>'+Ce(Cloud.email)+'</b>':''}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${obtn('syPush','Push now',true)}${obtn('syPull','Pull (replaces local)')}<button id="syAuto" style="border:1px solid var(--line,#ddd);background:transparent;color:var(--tx,#111);border-radius:10px;padding:7px 14px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600">${localStorage.getItem('fs.autoSync')==='1'?'Auto-sync ON':'Auto-sync OFF'}</button></div>
      <div style="color:var(--tx3,#888);font-size:12px">Auto-sync silently pushes whenever you leave the page.</div>`;
    body.querySelector('#syPush').onclick=()=>pushState(false);
    body.querySelector('#syPull').onclick=async()=>{
      try{
        const j=await api('/api/state');
        if(!j.payload){note('er','No snapshot stored yet — push first.');return}
        if(j.payload.state)Cwr('fs.state',j.payload.state);
        if(j.payload.prefs)Cwr('fs.prefs',j.payload.prefs);
        note('ok','Snapshot restored — reloading…');setTimeout(()=>location.reload(),600);
      }catch(e){note('er',e.message)}};
    body.querySelector('#syAuto').onclick=()=>{
      const on=localStorage.getItem('fs.autoSync')==='1';
      localStorage.setItem('fs.autoSync',on?'0':'1');
      note('ok','Auto-sync '+(on?'disabled':'enabled.'));openOv('sync')};
  }else if(tab==='usage'){
    if(authed()){body.innerHTML=authed();return}
    body.innerHTML=`${hh('Usage · last 30 days')}<div id="usOut" style="color:var(--tx3,#888)">Loading…</div>`;
    Promise.all([api('/api/usage'),api('/api/usage?detail=models')]).then(([agg,detail])=>{
      const fmt=n=>n>=.01?('$'+n.toFixed(2)):('$'+Number(n).toFixed(5));
      const rows=(detail.byModel||[]).slice(0,12).map(m=>`<tr><td style="padding:4px 6px">${Ce(m.provider)}</td><td style="padding:4px 6px"><code>${Ce(m.model)}</code></td><td style="padding:4px 6px;text-align:right">${m.calls}</td><td style="padding:4px 6px;text-align:right">${m.prompt_tokens}↑ ${m.completion_tokens}↓</td><td style="padding:4px 6px;text-align:right">${fmt(m.cost_usd)}</td></tr>`).join('');
      body.querySelector('#usOut').innerHTML=`
        <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px;align-items:center">
          <span><b>${agg.plan||'free'}</b> plan</span>
          <span><b>${agg.totals?.calls||0}</b> calls</span>
          <span><b>${agg.totals?.promptTokens||0}</b> prompt tok</span>
          <span><b>${agg.totals?.completionTokens||0}</b> completion tok</span>
          <span><b>${fmt(agg.totals?.costUsd||0)}</b></span></div>
        ${rows?`<table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr style="color:var(--tx3,#888);text-align:left"><th style="padding:4px 6px">Provider</th><th style="padding:4px 6px">Model</th><th style="padding:4px 6px;text-align:right">Calls</th><th style="padding:4px 6px;text-align:right">Tokens</th><th style="padding:4px 6px;text-align:right">Cost</th></tr></thead><tbody>${rows}</tbody></table>`:'No usage recorded yet — send a chat message.'}`;
    }).catch(e=>{body.querySelector('#usOut').textContent='Failed: '+e.message});
  }else if(tab==='webhooks'){
    if(authed()){body.innerHTML=authed();return}
    body.innerHTML=`${hh('Inbound webhooks')}
      <div style="color:var(--tx2,#555);font-size:12px">POST <code>{"prompt":"…"}</code> to <code>/api/webhook?key=YOUR_KEY</code> to queue an agent run for a project. Queue execution lands with the cron worker (next phase).</div>
      ${field('Project ID','wbPid',(Crd('fs.state')||{}).activeProject||'')} ${field('Label','wbLbl','')}
      <div>${obtn('wbNew','Create webhook',true)}</div>
      <div id="wbList" style="color:var(--tx3,#888)">Loading…</div>`;
    body.querySelector('#wbNew').onclick=async()=>{
      try{
        const j=await api('/api/webhook',{method:'PUT',body:JSON.stringify({projectId:body.querySelector('#wbPid').value.trim(),label:body.querySelector('#wbLbl').value.trim()})});
        await copy(j.key);
        note('ok','Webhook key created and copied to clipboard.');
        openOv('webhooks');
      }catch(e){note('er',e.message)}};
    api('/api/webhook').then(j=>{
      const list=j.webhooks||[];
      body.querySelector('#wbList').innerHTML=list.length?
        `<div style="font-size:12px"><b>${list.length}</b> webhook key(s)</div><table style="width:100%;border-collapse:collapse;font-size:12px;margin-top:6px">${list.map(w=>`<tr><td style="padding:4px 6px;font-family:var(--mono,monospace)">${Ce(String(w.key).slice(0,8))}…</td><td style="padding:4px 6px">${Ce(w.project_id)}</td><td style="padding:4px 6px;color:var(--tx3,#888)">${Ce(w.label||'')}</td></tr>`).join('')}</table>`
        :'No webhooks yet.';
    }).catch(e=>{body.querySelector('#wbList').textContent='Failed: '+e.message});
  }else if(tab==='worker'){
    const prefs=Crd('fs.prefs')||{};
    body.innerHTML=`${hh('Cloudflare Worker gateway')}
      <div style="color:var(--tx2,#555);font-size:12px">The deployed <code>forge-gateway</code> Worker proxies provider + MCP calls: fixes CORS, unlocks the Anthropic/Vertex adapters, rate-limits, and provides KV-backed <code>/sync</code>. Provider keys stay in this browser and are forwarded per request.</div>
      ${field('Worker URL','wkUrl',prefs.workerUrl||'https://forge-gateway.legateakanjimusab.workers.dev')}
      ${field('Forge token','wkTok',prefs.workerToken||'','password')}
      <div style="display:flex;gap:8px;flex-wrap:wrap">${obtn('wkSave','Save & reload',true)}${obtn('wkTest','Test')}${obtn('wkOff','Disable proxy')}</div>`;
    const readVal=()=>({workerUrl:body.querySelector('#wkUrl').value.trim(),workerToken:body.querySelector('#wkTok').value.trim()});
    body.querySelector('#wkSave').onclick=()=>{
      const v=readVal();Cwr('fs.prefs',{...prefs,...v});
      note('ok','Saved to prefs — reloading…');setTimeout(()=>location.reload(),600);};
    body.querySelector('#wkTest').onclick=async()=>{
      const v=readVal();if(!v.workerUrl)return note('er','Enter the Worker URL.');
      try{const r=await origFetch(v.workerUrl+'/',{headers:{'x-forge-token':v.workerToken}});const j=await r.json();note(JSON.stringify(j).includes('gateway')?'ok':'er',JSON.stringify(j))}
      catch(e){note('er',e.message)}};
    body.querySelector('#wkOff').onclick=()=>{Cwr('fs.prefs',{...prefs,workerUrl:'',workerToken:''});note('ok','Proxy disabled — reloading…');setTimeout(()=>location.reload(),600)};
  }
}
if(window.__forge)window.__forge.openSync=()=>openOv('account');
if(localStorage.getItem('fs.autoSync')==='1'&&cloudOn())pushState(true);
</script>
<!-- FORGE PRO runtime styles (Codex/Claude-Code skin layer) -->
<style id="fxStyle">
#fxRun{display:flex;align-items:center;gap:10px;font:600 11px/1 ui-monospace,'JetBrains Mono',SFMono-Regular,Menlo,monospace;letter-spacing:.05em;text-transform:uppercase;color:var(--tx3,#76766E);padding:0 2px 8px;margin-bottom:6px;border-bottom:1px dashed var(--line2,#D4D3CE)}
#fxRun[hidden]{display:none}
#fxRun .dot{width:7px;height:7px;border-radius:50%;background:#1F5E52;animation:fxpulse 1.1s ease-in-out infinite}
#fxRun .dot.ok{background:var(--ok,#2E6B4F);animation:none}
#fxRun b{color:var(--tx,#1A1A18)}
#fxJobs{position:fixed;top:60px;right:14px;width:420px;max-width:94vw;max-height:70dvh;overflow:auto;z-index:90;background:var(--surface,#fff);border:1px solid var(--line2,#d4d3ce);border-radius:16px;box-shadow:0 24px 70px rgba(26,26,24,.18)}
#fxJobs .hd{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line,#e5e4e0);font-size:.9rem}
#fxJobs .hd .sp,#fxJobs .job .sp{flex:1}
#fxJobs .bd{padding:10px 14px 14px;display:grid;gap:10px;font-size:.86rem}
#fxJobs .job{border:1px solid var(--line,#e5e4e0);border-radius:12px;padding:10px 12px}
#fxJobs .job .l1{display:flex;align-items:center;gap:8px}
#fxJobs .job pre{margin:8px 0 0;white-space:pre-wrap;font:12px/1.55 var(--mono,monospace);color:var(--tx2,#555)}
#fxJobs .job pre.er{color:var(--danger,#a3392f)}
#fxJobs .job .q{color:var(--tx3,#888);font-size:.8rem}
#fxJobs .job .st{font:600 10px/1 var(--mono,monospace);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:99px;background:var(--surface3,#eee);color:var(--tx2,#555)}
#fxJobs .job .st.done,#fxJobs .job .st.running{background:#E9F1EC;color:#1F5E52}
#fxJobs .job .st.error{background:#F8E9E7;color:#A3392F}
#fxJobs .b{border:1px solid var(--line2,#d4d3ce);background:var(--surface2,#fafaf8);border-radius:8px;padding:4px 9px;font-size:.75rem;cursor:pointer}
#fxRun .mx{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34ch}
@keyframes fxpulse{0%,100%{opacity:1}50%{opacity:.25}}
.msg[data-fxbadge]::after{content:attr(data-fxbadge);display:block;font:500 10px/1.4 ui-monospace,'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3,#76766E);opacity:.75;margin:6px 10px 0}
@media print{
  body *{visibility:hidden}
  #thread,#thread *{visibility:visible}
  #thread{position:absolute;left:0;top:0;width:100%;height:auto;max-height:none;overflow:visible}
  #fxRun{display:none}
}
</style>
<script type="module">
/* ══ FORGE PRO · Codex / Claude-Code-style runtime layer ══ */
const R = () => window.__forge;
const F = await new Promise((res) => {
  const t = setInterval(() => { if (R()) { clearInterval(t); res(R()); } }, 40);
});

const $s = (sel) => document.querySelector(sel);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const thread = $s('#thread');
const composer = $s('#composer');
const input = $s('#input');
const DL = (name, text, type = 'text/plain') => {
  const u = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a'); a.href = u; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 4000);
};
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2));
const msgText = (m) => m.role === 'user' ? (m.content || '') : (m.segments || []).filter((x) => x.type === 'text').map((x) => x.text).join('\n');
const app = () => F.S.chats.find((c) => c.id === F.S.activeChat) || null;
const slug = (t) => (t || 'chat').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48) || 'chat';

/* ── 1 · Codex-style run strip: live elapsed · tok/s · output tokens ── */
const strip = document.createElement('div');
strip.id = 'fxRun'; strip.hidden = true;
composer.prepend(strip);
let run = null;
const paintRun = () => {
  if (!run) { strip.hidden = true; return; }
  const el = (Date.now() - run.t0) / 1000;
  const tp = run.tok > 0 && el > .3 ? run.tok / el : 0;
  strip.innerHTML = `<span class="dot${run.done ? ' ok' : ''}"></span><b>${run.done ? 'Done' : 'Streaming'}</b>`
    + `<span>${el.toFixed(1)}s</span>`
    + (tp ? `<span>${tp < 10 ? tp.toFixed(1) : Math.round(tp)} tok/s</span>` : '')
    + (run.tok ? `<span>~${run.tok} out tok</span>` : '')
    + `<span class="mx">${esc(run.label)}</span>`;
  strip.hidden = false;
};
setInterval(() => { if (run && !run.done) paintRun(); }, 200);
const settle = (r) => { if (run !== r || r.done) return; r.done = true; paintRun(); setTimeout(() => { if (run === r) { run = null; strip.hidden = true; } }, 3500); };
async function consume(body, r) {
  if (!body) { settle(r); return; }
  const rd = body.getReader(); const dec = new TextDecoder(); let buf = '';
  try {
    for (;;) {
      const { done, value } = await rd.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const ln = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!ln.startsWith('data:')) continue;
        const d = ln.slice(5).trim();
        if (d === '[DONE]') continue;
        try {
          const j = JSON.parse(d);
          if (j.usage?.completion_tokens) r.tok = j.usage.completion_tokens;
          else {
            const dt = j.choices?.[0]?.delta || {};
            const txt = dt.content || dt.reasoning_content || '';
            if (txt) r.tok += Math.max(1, Math.round(txt.length / 4));
          }
          if (run === r && !r.done) paintRun();
        } catch { /* keep-alive or partial frame */ }
      }
    }
  } catch { /* aborted stream */ }
  settle(r);
}
const origFetch = window.fetch.bind(window);
window.fetch = async (...args) => {
  let url = '';
  try { url = String((args[0] && args[0].url) || args[0] || ''); } catch { /* non-url input */ }
  if (!url.includes('/chat/completions')) return origFetch(...args);
  const r = { t0: Date.now(), tok: 0, done: false, label: '' };
  run = r; paintRun();
  const res = await origFetch(...args);
  r.label = 'stream'; 
  let reqBody = '';
  try {
    reqBody = typeof args[1]?.body === 'string' ? args[1].body : '';
    const m = reqBody.match(/"model":\s*"([^"]+)"/);
    if (m) r.label = m[1];
  } catch { /* ignore */ }
  if (!res.ok) { r.label = 'HTTP ' + res.status; settle(r); return res; }
  const ct = res.headers.get('content-type') || '';
  if (ct.includes('event-stream')) consume(res.clone().body, r);
  else {
    try {
      const j = await res.clone().json();
      if (j.usage?.completion_tokens) r.tok = j.usage.completion_tokens;
    } catch { /* opaque */ }
    settle(r);
  }
  return res;
};

/* ── 2 · Context badges: words · ~tok on every message ── */
const sweep = () => {
  const c = app(); if (!c) return;
  thread.querySelectorAll('article.msg').forEach((el) => {
    if (el.dataset.fxbadge) return;
    const m = c.messages.find((x) => x.id === el.dataset.id);
    if (!m || m.pending) return;
    const t = msgText(m);
    const w = (t.trim().match(/\S+/g) || []).length;
    const k = Math.max(1, Math.round(t.length / 4));
    el.dataset.fxbadge = `${w} words · ~${k} tok`;
  });
};
const mo = new MutationObserver(() => { clearTimeout(mo._t); mo._t = setTimeout(sweep, 350); });
mo.observe(thread, { childList: true, subtree: true, characterData: true });
sweep();

/* ── 3 · Slash commands (capture phase — runs before the composer handler) ── */
const HELP = 'Commands: /new · /model · /worker · /export (md) · /json · /import · /clear · /usage · /help';
const chatMD = (c) => '# ' + (c.title || 'Chat') + '\n\n' + (c.messages || [])
  .map((m) => '**' + (m.role === 'user' ? 'You' : 'Forge') + '**\n\n' + (msgText(m) || '_(no text)_'))
  .join('\n\n---\n\n');
function pickJSON() {
  const i = document.createElement('input');
  i.type = 'file'; i.accept = '.json,application/json';
  i.onchange = () => {
    const f = i.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const j = JSON.parse(rd.result);
        const msgs = j.messages || j;
        if (!Array.isArray(msgs)) throw new Error('no messages');
        const nc = {
          id: uid(), projectId: F.S.activeProject,
          title: String(j.title || f.name.replace(/\.json$/i, '')).slice(0, 54),
          messages: msgs.map((m) => ({
            id: uid(), role: m.role === 'user' ? 'user' : 'assistant',
            content: String(m.content || ''), ts: m.ts || Date.now(), segments: [],
          })),
          createdAt: Date.now(), updatedAt: Date.now(),
        };
        F.S.chats.unshift(nc); F.S.activeChat = nc.id; F.saveS();
        F.layout(); F.renderChats(); F.renderThread();
        F.toast('Imported ' + nc.messages.length + ' messages.', { type: 'ok' });
      } catch { F.toast('Not a valid chat JSON.', { type: 'er' }); }
    };
    rd.readAsText(f);
  };
  i.click();
}
async function showUsage() {
  let cloud = null;
  try { cloud = JSON.parse(localStorage.getItem('fs.cloud') || 'null'); } catch { /* unsigned */ }
  if (!cloud) return F.toast('Sign in to see cloud usage.', { type: 'wa' });
  try {
    const r = await fetch('/api/usage', { headers: { Authorization: 'Bearer ' + cloud.token } });
    const j = await r.json();
    const t = j.totals || {};
    F.toast(`30-day usage — ${t.calls ?? 0} calls · in ${t.promptTokens ?? 0} tok · out ${t.completionTokens ?? 0} tok · $${(t.costUsd ?? 0).toFixed ? (t.costUsd ?? 0).toFixed(4) : t.costUsd ?? 0}`,
      { type: 'in', timeout: 9000 });
  } catch (e) { F.toast('Usage unavailable: ' + e.message, { type: 'er' }); }
}
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
  const ta = $s('#input');
  if (!ta || document.activeElement !== ta) return;
  const v = ta.value.trim();
  if (!v.startsWith('/')) return;
  const cmd = v.split(/\s/)[0].toLowerCase();
  const c = app();
  const ok = () => {
    e.preventDefault(); e.stopImmediatePropagation();
    ta.value = ''; ta.dispatchEvent(new Event('input')); ta.focus();
  };
  switch (cmd) {
    case '/new':
      ok(); F.S.activeChat = ''; F.saveS(); F.layout(); F.renderChats(); F.renderThread();
      break;
    case '/model': ok(); F.openModelPicker(); break;
    case '/worker': ok(); F.openWorker(); break;
    case '/export':
      ok();
      if (!c) { F.toast('Nothing to export yet.', { type: 'wa' }); break; }
      DL(slug(c.title) + '.md', chatMD(c), 'text/markdown');
      break;
    case '/json':
      ok();
      if (!c) { F.toast('Nothing to export yet.', { type: 'wa' }); break; }
      DL(slug(c.title) + '.json', JSON.stringify({ title: c.title, exportedAt: Date.now(), messages: c.messages }, null, 2), 'application/json');
      break;
    case '/import': ok(); pickJSON(); break;
    case '/clear':
      ok();
      if (c && c.messages.length) { c.messages = []; F.saveS(); F.renderThread(); F.toast('Messages cleared.', { type: 'ok' }); }
      break;
    case '/usage': ok(); showUsage(); break;
    case '/help': ok(); F.toast(HELP, { type: 'in', timeout: 12000 }); break;
    default:
      e.preventDefault(); e.stopImmediatePropagation();
      F.toast('Unknown command ' + esc(cmd) + ' — try /help', { type: 'wa' });
  }
}, true);
let hinted = false;
input.addEventListener('input', () => {
  if (!hinted && input.value === '/') { hinted = true; F.toast('Slash mode — /help lists commands.', { type: 'in', timeout: 5000 }); }
});

/* ── 4 · Multi-tab conflict guard ── */
let lastSt = 0;
window.addEventListener('storage', (e) => {
  if (e.key !== 'fs.state') return;
  const now = Date.now();
  if (now - lastSt < 8000) return;
  lastSt = now;
  F.toast('Workspace changed in another tab.', { type: 'wa', timeout: 9000, action: { label: 'Load latest', fn: () => location.reload() } });
});
</script>
<script type="module">
/* ══ FORGE PRO · background jobs — the agent works while the browser is closed ══
   Runs server-side in forge-gateway (Cloudflare cron). The browser only queues
   and reads jobs: idle cost here is zero. */
const R = () => window.__forge;
const F = await new Promise((res) => { const t = setInterval(() => { if (R()) { clearInterval(t); res(R()); } }, 40); });

const prefs = () => { try { return JSON.parse(localStorage.getItem('fs.prefs') || '{}'); } catch { return {}; } };
const wBase = () => { const p = prefs(); return (p.workerUrl || '').replace(/\/+$/, ''); };
const wTok = () => prefs().workerToken || '';
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2));

async function wapi(path, opts = {}, silent = false) {
  const base = wBase();
  if (!base) { if (!silent) F.toast('Set up the gateway first: /worker then /bg.', { type: 'wa' }); throw new Error('no gateway'); }
  const r = await fetch(base + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'x-forge-token': wTok(), ...(opts.headers || {}) },
  });
  if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + (await r.text()).slice(0, 140));
  return r.json();
}

async function bgRun(task) {
  const g = F.gateway();
  const base = g.base || g.cfg?.base || g.p?.b || '';
  if (!base || !g.p) { F.toast('Pick a model/provider first.', { type: 'wa' }); return; }
  const key = g.p.nokey ? '' : (g.key || '');
  const model = F.S.activeModel;
  if (!model) { F.toast('Pick a model first (/model).', { type: 'wa' }); return; }
  const j = await wapi('/jobs', { method: 'POST', body: JSON.stringify({
    prompt: task, model, base, key,
    system: 'You are Forge, an autonomous background agent. Complete the task fully, then output the final result. Show intermediate steps compactly.',
    name: task.slice(0, 60),
  }) });
  F.toast('Background run queued — it keeps running even if you close the browser. /jobs to check.', { type: 'ok', timeout: 7000 });
  return j.id;
}

let pane = null;
function jobsPane() {
  if (pane) { pane.remove(); pane = null; return; }
  pane = document.createElement('div');
  pane.id = 'fxJobs';
  pane.innerHTML = '<div class="hd"><b>Background runs</b><span class="sp"></span>'
    + '<button class="b" data-a="refresh">Refresh</button><button class="b" data-a="close">✕</button></div><div class="bd"><i>Loading…</i></div>';
  document.body.appendChild(pane);
  pane.querySelector('[data-a=close]').onclick = () => { pane.remove(); pane = null; };
  pane.querySelector('[data-a=refresh]').onclick = () => loadJobs(pane);
  loadJobs(pane);
}
async function loadJobs(pane) {
  const bd = pane.querySelector('.bd');
  try {
    const { jobs } = await wapi('/jobs');
    if (!jobs.length) { bd.innerHTML = '<i>No background runs yet. Queue one with /bg &lt;task&gt;.</i>'; return; }
    bd.innerHTML = '';
    for (const j of jobs) {
      const row = document.createElement('div');
      row.className = 'job ' + j.status;
      row.innerHTML = '<div class="l1"><span class="st ' + j.status + '">' + esc(j.status) + '</span><b>' + esc(j.name || j.id.slice(0, 8)) + '</b>'
        + '<span class="sp"></span><button class="b" data-a="go">Open</button><button class="b" data-a="del">Delete</button></div>'
        + (j.result ? '<pre>' + esc(String(j.result).slice(0, 4000)) + '</pre>' : j.error ? '<pre class="er">' + esc(j.error) + '</pre>' : '<span class="q">queued — the Worker cron picks it up within a minute. This keeps running while the browser is closed.</span>');
      row.querySelector('[data-a=del]').onclick = async () => { await wapi('/jobs?id=' + j.id, { method: 'DELETE' }); loadJobs(pane); };
      row.querySelector('[data-a=go]').onclick = () => {
        const c = F.S.chats.find((x) => x.id === F.S.activeChat);
        if (!c) { F.toast('Open a chat first.', { type: 'wa' }); return; }
        c.messages.push({ id: uid(), role: 'assistant', content: '**[Background: ' + (j.name || 'task') + ']**\n\n' + (j.result || j.error || '(still running)'), ts: Date.now(), segments: [] });
        F.saveS(); F.renderThread();
        F.toast('Result added to the open chat.', { type: 'ok', timeout: 4000 });
      };
      bd.appendChild(row);
    }
  } catch (e) { bd.innerHTML = '<i>Failed: ' + esc(e.message) + '</i>'; }
}

/* commands */
const prevKeydown = document.addEventListener;
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
  const ta = document.getElementById('input');
  if (!ta || document.activeElement !== ta) return;
  const v = ta.value.trim();
  if (v.startsWith('/bg')) {
    if (!wBase()) return;
    e.preventDefault(); e.stopImmediatePropagation();
    const task = v.slice(4).trim();
    ta.value = ''; ta.dispatchEvent(new Event('input'));
    if (!task) { jobsPane(); return; }
    bgRun(task).catch((er) => F.toast('Queue failed: ' + er.message, { type: 'er' }));
  } else if (v === '/jobs') {
    if (!wBase()) return;
    e.preventDefault(); e.stopImmediatePropagation();
    ta.value = ''; ta.dispatchEvent(new Event('input'));
    jobsPane();
  }
}, true);

if (window.__forge) window.__forge.openBgJobs = jobsPane;
</script>
<script type="module">
/* FORGE PRO - connector marketplace + vault (nothing sensitive stays on the device) */
const F = window.__forge;
const esc = (v) => String(v ?? '').replace(/[&<>\"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', "'": '&#39;' }[c]));
const api = async (p, m, b) => {
  const r = await fetch(p, { method: m || 'GET', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + F.tok }, body: b ? JSON.stringify(b) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
};
let conns = [];let cat = [];let tab = 'conns';let pane = null;
function paint() {
  const bd = pane.querySelector('.bd');
  if (tab === 'vault') {
    bd.innerHTML = '<div class=\"vx\"><input id=vKey placeholder=\"key\"><input id=vVal placeholder=\"value\" type=\"password\"><button class=\"b pri\" id=vAdd>Save</button></div><div id=vList><i>Loading\u2026</i></div>';
    api('/api/vault').then((d) => {
      const ks = Object.keys(d.values || {});
      const el = document.getElementById('vList'); if (!el) return;
      el.innerHTML = ks.length ? ks.map((k) => '<div class=\"row\"><b>' + esc(k) + '</b><span class=\"val\">' + esc(String(d.values[k]).slice(0, 6) + '\u2022\u2022\u2022') + '</span><span class=\"sp\"></span><button class=\"b\" data-k=\"' + esc(k) + '\" data-a=\"del\">\u2715</button></div>').join('') : '<i>Vault empty. Add API keys and secrets here - AES-256-GCM encrypted in the database, never on this device.</i>';
      el.querySelectorAll('[data-a=del]').forEach((b) => b.onclick = async () => { await api('/api/vault?key=' + encodeURIComponent(b.dataset.k), 'DELETE'); F.toast('Deleted ' + b.dataset.k, { type: 'ok' }); paint(); });
    }).catch((e) => { const el = document.getElementById('vList'); if (el) el.innerHTML = '<i>' + esc(e.message) + '</i>'; });
    document.getElementById('vAdd').onclick = async () => { const k = document.getElementById('vKey').value.trim(), v = document.getElementById('vVal').value.trim(); if (!k || !v) return; await api('/api/vault', 'PUT', { key: k, value: v }); F.toast('Saved to encrypted vault', { type: 'ok' }); paint(); };
    return;
  }
  bd.innerHTML = '<div class=\"cx\"><input id=cq placeholder=\"Search connectors\u2026\"></div><div id=cl></div>';
  const draw = (q) => {
    const cl = document.getElementById('cl'); if (!cl) return;
    q = (q || '').toLowerCase();
    const groups = {};
    cat.forEach((c) => { (groups[c.cat] = groups[c.cat] || []).push(c); });
    const CATN = { ai: 'AI models', dev: 'Developer', work: 'Work apps', fin: 'Finance', media: 'Media', com: 'Communication', data: 'Data', other: 'Other' };
    let out = '';
    for (const g of Object.keys(groups)) {
      const items = groups[g].filter((c) => !q || (c.n + ' ' + c.d + ' ' + c.id).toLowerCase().includes(q));
      if (!items.length) continue;
      out += '<details open class=\"cg\"><summary>' + esc(CATN[g] || g) + ' \u00b7 ' + items.length + '</summary>';
      for (const c of items) {
        const cc = conns.find((x) => x.provider.toLowerCase() === c.id.toLowerCase());
        out += '<div class=\"row\" data-id=\"' + esc(c.id) + '\"><div class=\"ic\">' + esc((c.n || '?')[0].toUpperCase()) + '</div><div class=\"mi\"><b>' + esc(c.n) + '</b><span>' + esc(c.d || '') + '</span></div>'
          + (cc ? '<span class=\"st ok\">Connected</span><button class=\"b\" data-a=\"off\">\u2715</button>' : '<span class=\"st\">\u2014</span><button class=\"b pri\" data-a=\"on\">Connect</button>') + '</div>';
      }
      out += '</details>';
    }
    cl.innerHTML = out || '<i>Nothing matches.</i>';
    cl.querySelectorAll('[data-a=on]').forEach((b) => b.onclick = (e) => startConn(e.target.closest('.row').dataset.id));
    cl.querySelectorAll('[data-a=off]').forEach((b) => b.onclick = async (e) => { const id = e.target.closest('.row').dataset.id; await api('/api/connections?provider=' + encodeURIComponent(id), 'DELETE'); F.toast('Disconnected ' + id, { type: 'ok' }); load(); });
  };
  document.getElementById('cq').oninput = (e) => draw(e.target.value);
  draw('');
}
function startConn(id) {
  const c = cat.find((x) => x.id === id); if (!c) return;
  if (c.a === 'oauth') {
    api('/api/connections/oauth/' + id + '?action=start').then((d) => {
      if (d.configured) { window.addEventListener('message', function h(e) { if (e.data && e.data.forgeOauth === 'ok') { window.removeEventListener('message', h); F.toast(c.n + ' connected', { type: 'ok' }); load(); } }); window.open(d.authorizeUrl, 'forge-oauth', 'width=620,height=760'); }
      else { F.toast(c.n + ' OAuth not registered yet - see setup info in the console. You can connect with a token instead.', { type: 'wa', timeout: 9000 }); console.log('[Forge] Setup for ' + id, d.setup); }
    }).catch((e) => F.toast('Failed: ' + e.message, { type: 'er' }));
  } else {
    const tok = prompt('Paste your ' + c.n + ' API key or token (' + (c.doc || 'see provider docs') + ')');
    if (!tok) return;
    api('/api/connections', 'POST', { provider: id, accessToken: tok }).then(() => { F.toast(c.n + ' connected - token encrypted in the vault', { type: 'ok' }); load(); }).catch((e) => F.toast('Failed: ' + e.message, { type: 'er' }));
  }
}
function load() {
  if (!pane) return;
  pane.querySelector('.bd').innerHTML = '<i>Loading\u2026</i>';
  api('/api/connections?catalog=1').then((d) => { conns = d.connections || []; cat = d.catalog || []; paint(); }).catch((e) => { if (pane) pane.querySelector('.bd').innerHTML = '<i>' + esc(e.message) + '</i>'; });
}
function panel() {
  if (pane) { pane.remove(); pane = null; return; }
  pane = document.createElement('div'); pane.id = 'fxConns';
  pane.innerHTML = '<div class=\"hd\"><b>Connectors &amp; Vault</b><span class=\"sp\"></span><button class=\"b\" data-a=\"t0\">Connections</button><button class=\"b\" data-a=\"t1\">Vault</button><button class=\"b\" data-a=\"x\">\u2715</button></div><div class=\"bd\"><i>Loading\u2026</i></div>';
  document.body.appendChild(pane);
  pane.querySelector('[data-a=x]').onclick = () => { pane.remove(); pane = null; };
  pane.querySelector('[data-a=t0]').onclick = () => { tab = 'conns'; load(); };
  pane.querySelector('[data-a=t1]').onclick = () => { tab = 'vault'; paint(); };
  load();
}
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
  const ta = document.getElementById('input');
  if (!ta || document.activeElement !== ta) return;
  const v = ta.value.trim();
  if (v.startsWith('/connect') || v.startsWith('/vault')) {
    e.preventDefault(); e.stopImmediatePropagation();
    tab = v.startsWith('/vault') ? 'vault' : 'conns';
    ta.value = ''; ta.dispatchEvent(new Event('input'));
    panel();
  }
}, true);
if (window.__forge) window.__forge.openConnMarket = () => { tab = 'conns'; pane ? (pane.remove(), pane = null) : panel(); };
</script>
